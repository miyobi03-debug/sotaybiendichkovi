<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Luyện dịch 10 bài</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* Layout: one narrow notebook column; each sentence is a ruled exercise row with the answer in "red pen" */
:root{
  --bg:#eef1f4; --paper:#ffffff; --fg:#1d2733; --muted:#5d6b7a; --line:#d6dde5;
  --ink:#1f4e8c; --ink-soft:#e3ecf8; --pen:#c0392b; --pen-soft:#fbecea; --good:#1e7a4c; --good-soft:#e2f3ea; --warn:#9a6200; --warn-soft:#fbf0d9;
  --kr:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a21; --paper:#1c242d; --fg:#e4e9ef; --muted:#9aa7b5; --line:#2e3946;
  --ink:#8fb6ec; --ink-soft:#24344a; --pen:#f08a7e; --pen-soft:#3a2524; --good:#7fd1a4; --good-soft:#1d3428; --warn:#f2c46b; --warn-soft:#3a3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a21; --paper:#1c242d; --fg:#e4e9ef; --muted:#9aa7b5; --line:#2e3946;
  --ink:#8fb6ec; --ink-soft:#24344a; --pen:#f08a7e; --pen-soft:#3a2524; --good:#7fd1a4; --good-soft:#1d3428; --warn:#f2c46b; --warn-soft:#3a3020; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 120px}
header h1{font-size:1.5rem;margin:0;text-wrap:balance}
header h1 span{font-family:var(--kr);color:var(--ink)}
header p{color:var(--muted);margin:.4rem 0 0;max-width:62ch}
.tabs{display:flex;gap:8px;margin:20px 0 8px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--fg);padding:8px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.progress{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 8px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;margin-bottom:12px}
.top{display:flex;gap:10px;align-items:baseline}
.num{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-width:2.2em}
.src{min-width:0}
.src.kr{font-family:var(--kr);font-size:1.08rem;line-height:1.85}
.src b{color:var(--ink);background:var(--ink-soft);padding:0 3px;border-radius:3px;font-weight:700}
.src sup{font-size:.6em;color:var(--muted)}
textarea{width:100%;font:inherit;color:var(--fg);background:transparent;border:0;border-bottom:1px dashed var(--line);
  padding:6px 2px;resize:vertical;min-height:2.6em;line-height:1.6}
textarea.kr{font-family:var(--kr)}
textarea:focus{outline:none;border-bottom:1px solid var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.82rem;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 10px;border-radius:6px;cursor:pointer}
.btn:hover{color:var(--fg);border-color:var(--muted)}
.btn:focus-visible,.tab:focus-visible,.primary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cite{font-size:.82rem;color:var(--muted);margin:-4px 0 10px}
.cite a{color:var(--ink)}
.hint{font-size:.88rem;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.ans{font-size:.92rem;color:var(--pen);background:var(--pen-soft);border-radius:6px;padding:8px 10px}
.ans.kr{font-family:var(--kr)}
.grade{display:grid;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.9rem}
.grade .score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.grade .pts{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--pen)}
.grade .pts small{font-size:.8rem;color:var(--muted);font-weight:500}
.grade .tag{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.tag.hi{background:var(--good-soft);color:var(--good)} .tag.mid{background:var(--warn-soft);color:var(--warn)} .tag.lo{background:var(--pen-soft);color:var(--pen)}
.grade ul{margin:0;padding-left:1.2em} .grade .better{color:var(--muted)} .grade .better b{color:var(--fg);font-weight:600}
.grade .stale{color:var(--warn);font-size:.82rem}
.self{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.btn.g{color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.55;cursor:wait}
#summary{font-weight:600;color:var(--ink)}
.vtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.vwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.vt{width:100%;border-collapse:collapse;font-size:.92rem}
.vt th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
.vt td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.vt tr:last-child td{border-bottom:0}
.vt .n{color:var(--muted);font-variant-numeric:tabular-nums;width:2em}
.vt .w{font-family:var(--kr);font-weight:700;color:var(--ink);white-space:nowrap}
.vt .hv{color:var(--muted);font-size:.85rem}
.vt .s a{color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline}
.vt.hide .m span{visibility:hidden}
.vt.hide .m{cursor:pointer;background:var(--ink-soft)}
.vt .m.show span{visibility:visible}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.primary{font:inherit;font-weight:600;background:var(--ink);color:var(--paper);border:0;padding:9px 16px;border-radius:8px;cursor:pointer}
.msg{font-size:.85rem;color:var(--muted);flex:1;min-width:0}
#out{width:100%;min-height:6em;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper);color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.think{display:grid;gap:8px;background:var(--ink-soft);border-radius:8px;padding:10px 12px}
.tk-h{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.think label{display:grid;gap:2px;font-size:.8rem;color:var(--muted);font-weight:600}
.think textarea{min-height:1.9em;padding:3px 2px;font-size:.92rem;font-weight:400}
.tfb{display:grid;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;font-size:.9rem}
.tfb ul{margin:0;padding-left:1.2em}
.amodel{display:grid;gap:4px;font-size:.88rem;background:var(--paper);border-radius:8px;padding:10px 12px;border-left:3px solid var(--good)}
.amodel b{color:var(--good)}
[hidden]{display:none!important}
.lessons{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.lessons button{font:inherit;font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--fg);padding:5px 11px;border-radius:8px;cursor:pointer}
.lessons button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lessons button:disabled{opacity:.4;cursor:default}
</style>

<div class="wrap">
  <header>
    <h1>Luyện dịch Hàn → Việt <span id="lt"></span></h1>
    <p id="lp"></p>
    <div class="lessons" id="lessons" role="group" aria-label="Chọn bài"></div>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" id="tabA" role="tab" aria-selected="true">A · Hàn → Việt</button>
    <button class="tab" id="tabB" role="tab" aria-selected="false">B · Báo Hàn</button>
    <button class="tab" id="tabV" role="tab" aria-selected="false">Từ vựng</button>
    <span class="progress" id="prog"></span><span class="progress" id="summary"></span>
  </div>
  <div id="list"></div>
  <textarea id="out" hidden readonly></textarea>
</div>
<div class="bar"><div class="in">
  <button class="primary" id="gradeAll">Chấm cả phần</button>
  <button class="btn" id="copy">Copy bài dịch</button>
  <button class="btn" id="showAll">Hiện hết đáp án</button>
  <span class="msg" id="msg">Chỉ chấm những câu đã dịch.</span>
</div></div>

<script>
const L={"1": {"t": "경제의 원칙", "p": "17–19", "A": [["Đoạn 1 · Con người cần gì để sống"], ["A1", "만일 우리에게 입을 옷과 먹을 쌀 그리고 살 집이 없다면 어떻게 될까?", "만일 ‐다면 = giả sử, nếu như · 입을 / 먹을 / 살 = (áo) để mặc, (gạo) để ăn, (nhà) để ở", "Giả sử chúng ta không có quần áo để mặc, gạo để ăn và nhà để ở thì sẽ ra sao?"], ["A2", "일상생활에서 가장 기본적인 <b>의식주<sup>2</sup></b>가 해결되지 못한다면 우리는 인간답게 살 수 없을 것이다.", "의식주 = ăn, mặc, ở · 해결되다 = được giải quyết · 인간답게 = cho ra con người", "Nếu nhu cầu ăn, mặc, ở, thứ cơ bản nhất trong đời sống hằng ngày, không được giải quyết thì chúng ta sẽ không thể sống cho ra con người."], ["A3", "최소한 인간답게 살기 위해 우리는 다양한 <b>재화<sup>3</sup></b>와 서비스가 필요하다.", "재화 = hàng hóa · 최소한 인간답게 살다 = đảm bảo mức sống tối thiểu của con người (kiểu văn kinh tế, gọn nhất) · đừng dịch “sống tối thiểu”, nghe như sống tằn tiện", "Để đảm bảo mức sống tối thiểu của con người, chúng ta cần nhiều loại hàng hóa và dịch vụ."], ["Đoạn 2 · Hoạt động kinh tế là gì"], ["A4", "의식주를 해결해 주는 옷과 쌀 그리고 집과 같은 기본적인 재화들은 물론이고, 의사의 친절한 진료 그리고 스트레스를 풀게 해 주는 재미있는 영화와 같은 서비스는 우리의 삶을 <b>윤택하게<sup>4</sup></b> 해 주는 것들이다.", "윤택하다 = sung túc · 진료 = khám chữa bệnh · N과 같은 = như N · N은 물론이고 = không chỉ N mà cả · ‐게 해 주다 = làm cho", "Không chỉ những hàng hóa cơ bản giải quyết nhu cầu ăn, mặc, ở như quần áo, gạo, nhà cửa, mà cả những dịch vụ như sự khám chữa tận tình của bác sĩ hay bộ phim thú vị giúp giải tỏa căng thẳng cũng là những thứ làm cho cuộc sống của chúng ta sung túc hơn."], ["A5", "이처럼 사람에게 필요한 재화와 서비스를 <b>생산<sup>5</sup></b>, <b>분배<sup>6</sup></b>, <b>소비하는<sup>7</sup></b> 활동을 경제활동이라고 한다.", "생산 = sản xuất · 분배 = phân phối · 소비하다 = tiêu dùng · N을 ~(이)라고 한다 = gọi N là ~", "Như vậy, hoạt động sản xuất, phân phối và tiêu dùng hàng hóa, dịch vụ cần thiết cho con người được gọi là hoạt động kinh tế."], ["Đoạn 3 · Nguyên tắc kinh tế"], ["A6", "모든 사람들은 어떻게 하면 경제활동을 잘 할 수 있는가에 관심을 가져왔다.", "N에 관심을 가져오다 = từ trước đến nay luôn quan tâm đến N", "Mọi người từ trước đến nay luôn quan tâm đến việc làm thế nào để hoạt động kinh tế cho tốt."], ["A7", "가장 <b>효율적<sup>8</sup></b>인 경제활동이란 일정하게 주어진 생산<b>자원<sup>9</sup></b>으로부터 가장 적은 비용을 <b>들여<sup>10</sup></b> 최대의 <b>만족<sup>11</sup></b>을 얻어 내는 활동이라고 할 수 있다.", "효율적 = hiệu quả · 자원 = nguồn lực · 들이다 = bỏ ra · 만족 = sự hài lòng · 일정하게 주어진 생산자원 = nguồn lực sản xuất có hạn / sẵn có (일정하다 = cố định, nhất định + 주어지다 = được cho → lượng cố định, không tăng thêm được; 생산자원 = đất, vốn, lao động, thời gian) · N(이)란 ~(이)라고 할 수 있다 = N có thể nói là ~", "Hoạt động kinh tế hiệu quả nhất có thể nói là hoạt động bỏ ra chi phí ít nhất từ nguồn lực sản xuất có hạn để đạt được sự hài lòng lớn nhất."], ["A8", "즉 경제원칙이란 '비용<b>편익<sup>12</sup></b>의 원리'를 의미한다.", "편익 = lợi ích · 원리 = nguyên lý · 즉 = tức là · 비용편익의 원리 = nguyên lý chi phí – lợi ích (Cost-Benefit Principle): chỉ làm khi lợi ích thu được lớn hơn chi phí bỏ ra. 비용 + 편익 ghép lại, dịch có gạch nối, không dịch “chi phí lợi ích” liền nhau", "Tức là, nguyên tắc kinh tế có nghĩa là “nguyên lý chi phí – lợi ích”."], ["Đoạn 4 · Tính khan hiếm"], ["A9", "하지만 이러한 경제원칙도 우리의 <b>욕구<sup>13</sup></b>를 충분히 만족시켜 줄 수 없다.", "욕구 = nhu cầu · 충분히 만족시켜 주다 = thỏa mãn đầy đủ / đáp ứng trọn vẹn (충분히 = đầy đủ; 만족하다 = tự hài lòng → 만족시키다 = làm cho hài lòng; ‐아/어 주다 = giúp, cho). Cụm hay đi: 욕구를 만족시키다 = đáp ứng nhu cầu", "Tuy nhiên, ngay cả nguyên tắc kinh tế này cũng không thể thỏa mãn đầy đủ nhu cầu của chúng ta."], ["A10", "사람들의 <b>무한한<sup>14</sup></b> 욕망에 <b>비해서<sup>15</sup></b> 재화나 서비스가 <b>부족하기<sup>16</sup></b> 때문이다.", "무한하다 = vô hạn · 욕망 = ham muốn · N에 비해서 = so với N · 부족하다 = thiếu", "Vì so với ham muốn vô hạn của con người thì hàng hóa hay dịch vụ luôn thiếu."], ["A11", "이러한 현상을 '<b>희소성<sup>17</sup></b>'이라고 한다.", "희소성 = tính khan hiếm · 현상 = hiện tượng", "Hiện tượng này được gọi là “tính khan hiếm”."], ["A12", "이와 같은 자원의 희소성은 자원의 양이 <b>절대적<sup>18</sup></b>으로 부족하여 <b>생기<sup>19</sup></b>기도 하지만 그것을 사용하고자 하는 욕망에 비해서 자원이 <b>상대적<sup>20</sup></b>으로 부족하여 생기는 경우도 많다.", "절대적 = tuyệt đối · 생기다 = phát sinh · 상대적 = tương đối · ‐기도 하지만 ~ 경우도 많다 = có khi… nhưng cũng nhiều khi… · ‐고자 하다 = muốn", "Tính khan hiếm của nguồn lực như vậy có khi phát sinh do lượng tài nguyên thiếu một cách tuyệt đối, nhưng cũng có nhiều trường hợp phát sinh do tài nguyên thiếu một cách tương đối so với mong muốn sử dụng nó."], ["A13", "예를 들어 석유는 <b>엄청난<sup>21</sup></b> 양이 매장되어 있지만 사람들이 사용하려는 양(욕망)은 그보다 더 많기 때문에 희소성이 큰 반면, 구리는 석유보다 매장량은 적지만 사람들이 원하는 양이 적기 때문에 희소성이 석유만큼 크지 않다.", "석유는 엄청난 양이 매장되어 있다 = dầu mỏ có trữ lượng khổng lồ (N은 + M이 V: nói về N thì M thế nào → dịch “N có M…”; 엄청난 양 = lượng khổng lồ; 매장되다 = được chôn/trữ dưới đất → 매장량 = trữ lượng) · 석유 = dầu mỏ · 구리 = đồng · ‐(으)ㄴ 반면 = trái lại · N만큼 = bằng N", "Ví dụ, dầu mỏ có trữ lượng khổng lồ nhưng lượng người ta muốn dùng còn nhiều hơn thế nên tính khan hiếm lớn; trái lại, đồng tuy trữ lượng ít hơn dầu mỏ nhưng lượng người ta cần cũng ít nên tính khan hiếm không lớn bằng dầu mỏ."], ["Đoạn 5 · Chi phí cơ hội"], ["A14", "또한 어떤 선택을 할 때 <b>포기해야<sup>22</sup></b> 하는 다른 것의 <b>가치<sup>23</sup></b>를 '<b>기회비용<sup>24</sup></b>'이라고 한다.", "포기하다 = từ bỏ · 가치 = giá trị · 기회비용 = chi phí cơ hội", "Ngoài ra, giá trị của thứ khác mà ta phải từ bỏ khi đưa ra một lựa chọn được gọi là “chi phí cơ hội”."], ["A15", "어떤 농부가 갖고 있는 땅에 배추와 무 둘 중 배추를 더 많이 심으려고 한다면 무 심기를 포기해야 한다.", "농부 = nông dân · 배추 = cải thảo · 무 = củ cải · 심다 = trồng · ‐(으)려고 한다면 = nếu muốn / nếu định (‐(으)려고 하다 = định, muốn + ‐ㄴ다면 = nếu). 심으려고 한다면 = nếu muốn trồng · 어떤 농부가 갖고 있는 땅에 = trên mảnh đất mà một người nông dân có (갖고 있다 = đang có, sở hữu; ‐는 + 땅 = định ngữ → dịch “đất mà … có”; N에 = trên, ở N)", "Nếu một người nông dân muốn trồng nhiều cải thảo hơn trên mảnh đất mình có, giữa hai loại cải thảo và củ cải, thì phải từ bỏ việc trồng củ cải."], ["A16", "이런 경우에 배추 생산의 기회비용은 생산을 포기한 무가 된다.", "", "Trong trường hợp này, chi phí cơ hội của việc trồng cải thảo chính là phần củ cải đã bỏ không trồng."], ["Đoạn 6 · Lựa chọn tốt là gì"], ["A17", "선택을 잘한다는 것은 기회비용을 올바로 계산하여 선택하는 것을 말한다.", "올바로 = đúng đắn · 계산하다 = tính toán · ‐는다는 것은 ~는 것을 말한다 = … có nghĩa là … · 선택을 잘한다는 것은 = lựa chọn giỏi / biết lựa chọn có nghĩa là (선택을 잘하다 = chọn giỏi; ‐ㄴ다는 것은 = việc… thì, dùng để mở câu định nghĩa)", "Lựa chọn giỏi có nghĩa là tính toán đúng chi phí cơ hội rồi mới lựa chọn."], ["A18", "기회비용을 올바로 계산하여 선택을 잘하면 <b>제한된<sup>25</sup></b> 자원으로도 큰 만족을 얻을 수 있다.", "제한되다 = bị giới hạn · N(으)로도 = dù chỉ với N cũng", "Nếu tính đúng chi phí cơ hội và lựa chọn khéo thì dù nguồn lực có hạn vẫn có thể đạt được sự hài lòng lớn."], ["A19", "또한 같은 만족을 얻는 데 들어가는 비용을 최소화할 수도 있다.", "최소화하다 = giảm đến mức tối thiểu · ‐는 데 들어가다 = tốn vào việc… · 같은 만족을 얻는 데 들어가는 비용 = chi phí bỏ ra để đạt được cùng một mức hài lòng (‐는 데 = vào việc…; 들어가다 = tốn, được chi vào; ‐는 + 비용 là định ngữ → dịch “chi phí (bỏ ra) để…”)", "Ngoài ra, cũng có thể giảm tối thiểu chi phí bỏ ra để đạt được cùng một mức hài lòng."]], "B": [["Bài báo 1 · 욕망은 무한, 경제자원은 유한… 선택은 경제학의 기초", "<a href=\"https://sgsg.hankyung.com/article/2018012612761\" target=\"_blank\" rel=\"noopener\">생글생글 (한국경제), 2018.01.29</a>"], ["N1", "\"어느 누구도 원하는 모든 것을 원하는 만큼 가질 수 없다.\"", "어느 누구도 ~ 없다 = không ai có thể… · ‐는 만큼 = bằng mức… · 가질 수 없다 = không thể có được (가지다 = có, sở hữu + ‐(으)ㄹ 수 없다 = không thể; 가지다 → 가질) · 원하는 모든 것을 원하는 만큼 = mọi thứ mình muốn, nhiều như mình muốn", "“Không ai có thể có được mọi thứ mình muốn, nhiều như mình muốn.”"], ["N2", "법조인이 한 말이지만 이것보다 경제학의 기초인 <b>희소성</b>을 더 잘 표현한 말을 찾기 어렵다.", "법조인 = người làm ngành luật · 기초 = nền tảng · 표현하다 = diễn đạt · ‐기 어렵다 = khó mà…", "Dù là câu nói của một người làm luật, nhưng khó tìm được câu nào diễn tả tính khan hiếm, nền tảng của kinh tế học, hay hơn câu này."], ["N3", "경제학에서 희소성은 '<b>절대적</b>인 부족'을 의미하지 않는다.", "의미하다 = có nghĩa là", "Trong kinh tế học, tính khan hiếm không có nghĩa là “thiếu hụt tuyệt đối”."], ["N4", "사람들이 현재 있는 것보다 더 많이 원한다는 뜻을 갖는다.", "‐는다는 뜻을 갖다 = mang nghĩa là…", "Nó mang nghĩa là con người muốn nhiều hơn những gì hiện đang có."], ["N5", "즉 인간 개개인은 수많은 <b>욕망</b>을 가지고 있지만 욕망을 모두 충족할 만큼 충분한 경제적 <b>자원</b>은 존재하지 않는다.", "개개인 = từng cá nhân · 충족하다 = đáp ứng, thỏa mãn · 존재하다 = tồn tại", "Tức là mỗi cá nhân có vô số ham muốn, nhưng không tồn tại đủ nguồn lực kinh tế để thỏa mãn tất cả những ham muốn đó."], ["Bài báo 2 · 모든 선택에는 반드시 '기회비용'이 따르죠", "<a href=\"https://sgsg.hankyung.com/article/2019112254451\" target=\"_blank\" rel=\"noopener\">생글생글 (한국경제), 2019.11.25</a>"], ["N6", "늙고 배고픈 사자는 먹잇감을 찾아 온종일 들판을 헤맸다.", "늙고 배고픈 사자 = con sư tử già và đói (늙다 = già + ‐고 = và; 배고프다 = đói → 배고픈 + N = N đang đói; 2 tính từ nối bằng ‐고, cái cuối mới đổi sang ‐(으)ㄴ trước danh từ) · 먹잇감 = con mồi · 온종일 = suốt cả ngày · 들판 = cánh đồng · 헤매다 = lang thang", "Con sư tử già và đói lang thang khắp cánh đồng suốt cả ngày để tìm mồi."], ["N7", "하지만 마땅한 사냥감을 잡지 못해 굶주린 채 돌아올 수밖에 없었다.", "마땅하다 = phù hợp, ra hồn · 굶주리다 = đói khát · ‐(으)ㄴ 채 = trong tình trạng… · ‐(으)ㄹ 수밖에 없다 = đành phải", "Nhưng vì không bắt được con mồi nào ra hồn nên nó đành phải trở về trong cơn đói."], ["N8", "<b>기회비용</b>이란 무엇을 선택하고 다른 것을 <b>포기함</b>으로써 잃어버리는 <b>편익</b>을 뜻한다.", "‐(으)ㅁ으로써 = bằng việc, do việc · 잃어버리다 = đánh mất · 뜻하다 = có nghĩa là", "Chi phí cơ hội là lợi ích bị mất đi do chọn một thứ và từ bỏ thứ khác."], ["N9", "그래서 어떤 하나를 선택할 때는 다른 하나 혹은 선택에 따른 득실을 따져 보고 신중히 선택해야 한다.", "득실 = được và mất · 따지다 = cân nhắc, tính toán · 신중히 = thận trọng · N에 따른 = theo N, đi kèm N", "Vì vậy khi chọn một thứ, ta phải cân nhắc thứ còn lại hoặc cái được cái mất đi kèm lựa chọn đó rồi mới thận trọng quyết định."], ["Bài báo 3 · 기회비용과 매몰비용… 우리는 늘 합리적 선택 고민해야", "<a href=\"https://sgsg.hankyung.com/article/2017112472581\" target=\"_blank\" rel=\"noopener\">생글생글 (한국경제), 2017.11.27</a>"], ["N10", "기업과 정부 역시 이러한 선택 문제를 늘 겪고 있다.", "기업 = doanh nghiệp · 정부 = chính phủ · 역시 = cũng · 겪다 = trải qua, gặp phải", "Doanh nghiệp và chính phủ cũng luôn gặp phải vấn đề lựa chọn như vậy."], ["N11", "저비용 고효율이라고 하는 경제 원칙에 따라서 더욱 이익을 추구할 수 있는 경우를 만들기 위해서 기업은 매 순간 '선택'을 하고 정부 역시 국민과 기업으로부터 받은 세금을 어떻게 사용해야 하는지, 어느 분야에 더욱 집중해야 하는지 등 다양한 '선택'의 갈림길에 서 있는 건 다를 바 없다.", "저비용 고효율 = chi phí thấp, hiệu quả cao · 추구하다 = theo đuổi · 세금 = thuế · 분야 = lĩnh vực · 갈림길 = ngã rẽ · 다를 바 없다 = cũng chẳng khác gì", "Theo nguyên tắc kinh tế “chi phí thấp, hiệu quả cao”, doanh nghiệp lựa chọn từng khoảnh khắc để tạo ra cơ hội theo đuổi nhiều lợi nhuận hơn; chính phủ cũng chẳng khác gì, luôn đứng trước nhiều ngã rẽ lựa chọn như nên dùng tiền thuế thu từ người dân và doanh nghiệp ra sao, nên tập trung hơn vào lĩnh vực nào."], ["N12", "어느 하나를 선택함으로써 포기해야만 하는 다른 하나를 우리는 '기회비용'이라고 부른다.", "‐아/어야만 하다 = buộc phải · N을 ~(이)라고 부르다 = gọi N là ~", "Thứ còn lại mà ta buộc phải từ bỏ khi chọn một thứ, chúng ta gọi là “chi phí cơ hội”."], ["N13", "이미 써 버렸기 때문에 돌려받을 수 없는 돈을 우리는 '매몰비용'이라고 한다.", "써 버리다 = đã tiêu mất · 돌려받다 = nhận lại · 매몰비용 = chi phí chìm", "Số tiền đã tiêu mất nên không thể lấy lại được, chúng ta gọi là “chi phí chìm”."], ["N14", "'매몰비용을 포기하지 못하고 더 큰 손해를 보는 것'을 매몰비용의 오류라고 한다.", "손해를 보다 = chịu thiệt · 오류 = sai lầm, ngụy biện", "Việc không chịu buông bỏ chi phí chìm rồi chịu thiệt hại lớn hơn được gọi là “ngụy biện chi phí chìm”."]], "V": [[1, "원칙", "原則 nguyên tắc", "nguyên tắc"], [2, "의식주", "衣食住 y thực trú", "ăn, mặc, ở"], [3, "재화", "財貨 tài hóa", "hàng hóa, của cải"], [4, "윤택하다", "潤澤 nhuận trạch", "sung túc, dư dả"], [5, "생산", "生產 sinh sản", "sản xuất"], [6, "분배", "分配 phân phối", "phân phối"], [7, "소비하다", "消費 tiêu phí", "tiêu dùng"], [8, "효율적", "效率的 hiệu suất", "hiệu quả"], [9, "자원", "資源 tư nguyên", "nguồn lực, tài nguyên"], [10, "들이다", "—", "bỏ ra (tiền, công sức)"], [11, "만족", "滿足 mãn túc", "sự hài lòng"], [12, "편익", "便益 tiện ích", "lợi ích, tiện lợi"], [13, "욕구", "欲求 dục cầu", "nhu cầu, mong muốn"], [14, "무한하다", "無限 vô hạn", "vô hạn"], [15, "비하다", "比 tỉ", "so với"], [16, "부족하다", "不足 bất túc", "thiếu"], [17, "희소성", "稀少性 hi thiểu tính", "tính khan hiếm"], [18, "절대적", "絶對的 tuyệt đối", "tuyệt đối"], [19, "생기다", "—", "phát sinh, xảy ra"], [20, "상대적", "相對的 tương đối", "tương đối"], [21, "엄청나다", "—", "khổng lồ, ghê gớm"], [22, "포기하다", "拋棄 phao khí", "từ bỏ"], [23, "가치", "價值 giá trị", "giá trị"], [24, "기회비용", "機會費用 cơ hội phí dụng", "chi phí cơ hội"], [25, "제한되다", "制限 chế hạn", "bị giới hạn"]], "AN": {"N1": {"v": "Chủ ngữ: 어느 누구도 (không ai) · Vị ngữ chính: 가질 수 없다 → câu phủ định toàn bộ: 'không ai có thể có được…'.", "cut": "1 khúc (câu trích dẫn ngắn), nhưng tách 2 phần tân ngữ: ① 원하는 모든 것을 (mọi thứ mình muốn) ② 원하는 만큼 (nhiều như mình muốn).", "mod": "원하는 → 모든 것 (thứ mình muốn): dịch 'mọi thứ' trước, 'mình muốn' sau. 원하는 → 만큼: 'nhiều như mình muốn'.", "words": "만큼 = mức độ, chừng → 'bằng/như' · 가질 = 가지다 (có, sở hữu) + ‐(으)ㄹ 수 없다"}, "N2": {"v": "Chủ ngữ ẩn (người viết/ta) · Vị ngữ 1: 한 말이지만 (là câu nói của…) · Vị ngữ chính: 찾기 어렵다 → 'khó tìm được…'.", "cut": "2 khúc tại ‐지만: ① 법조인이 한 말이지만 (dù là câu của người làm luật) ② 이것보다 … 더 잘 표현한 말을 찾기 어렵다 (khó tìm câu nào diễn tả … hay hơn câu này).", "mod": "법조인이 한 → 말 ('câu nói của người làm luật') · 경제학의 기초인 → 희소성 ('tính khan hiếm, nền tảng của kinh tế học' – dịch như đồng vị ngữ) · 이것보다 희소성을 더 잘 표현한 → 말 ('câu nào diễn tả tính khan hiếm hay hơn câu này').", "words": "법조인 法曹人 pháp tào nhân = người làm luật · 희소성 稀少性 hy thiểu tính = tính khan hiếm · 기초 基礎 cơ sở = nền tảng"}, "N3": {"v": "Chủ ngữ: 희소성은 · Vị ngữ chính: 의미하지 않는다 → 'không có nghĩa là…'.", "cut": "1 khúc: 경제학에서 (trong kinh tế học) + 희소성은 '절대적인 부족'을 의미하지 않는다.", "mod": "절대적인 → 부족: 'thiếu hụt tuyệt đối' (danh từ trước, tính từ sau).", "words": "절대적 絶對的 tuyệt đối đích = tuyệt đối · 부족 不足 bất túc = thiếu hụt"}, "N4": {"v": "Chủ ngữ ẩn (nó = tính khan hiếm, từ câu trước) · Vị ngữ chính: 뜻을 갖는다 → 'mang nghĩa là…'.", "cut": "1 khúc, nội dung trong ‐는다는: 사람들이 현재 있는 것보다 더 많이 원한다 (con người muốn nhiều hơn cái hiện có) + 뜻을 갖는다.", "mod": "현재 있는 → 것 ('những gì hiện đang có') · cả mệnh đề …원한다는 → 뜻: dịch 'nghĩa là' trước, nội dung sau.", "words": "뜻 = ý nghĩa · 현재 現在 hiện tại = hiện nay"}, "N5": {"v": "Vế 1: Chủ ngữ 인간 개개인은 · Vị ngữ 가지고 있지만 · Vế 2: Chủ ngữ 자원은 · Vị ngữ 존재하지 않는다 → 'không tồn tại…'.", "cut": "2 khúc tại ‐지만: ① 즉 인간 개개인은 수많은 욕망을 가지고 있지만 (tức là mỗi cá nhân có vô số ham muốn, nhưng) ② 욕망을 모두 충족할 만큼 충분한 경제적 자원은 존재하지 않는다 (không có đủ nguồn lực để thỏa mãn hết).", "mod": "욕망을 모두 충족할 만큼 충분한 경제적 → 자원: dịch 'nguồn lực kinh tế' trước, 'đủ để thỏa mãn tất cả ham muốn' sau.", "words": "욕망 慾望 dục vọng = ham muốn · 충족 充足 sung túc = đáp ứng đủ · 자원 資源 tư nguyên = tài nguyên, nguồn lực"}, "N6": {"v": "Chủ ngữ: 사자는 · Vị ngữ chính: 헤맸다 → 'lang thang'.", "cut": "2 khúc tại ‐아/어: ① 늙고 배고픈 사자는 먹잇감을 찾아 (con sư tử già và đói, để tìm mồi) ② 온종일 들판을 헤맸다 (lang thang khắp cánh đồng cả ngày). Khi dịch đưa 'để tìm mồi' ra cuối.", "mod": "늙고 배고픈 → 사자: 'con sư tử già và đói' (danh từ trước).", "words": "먹잇감 = 먹이 (thức ăn) + 감 (đồ, vật) → con mồi · 온종일 = 온 (cả) + 종일 終日 chung nhật → suốt cả ngày"}, "N7": {"v": "Chủ ngữ ẩn (con sư tử) · Vị ngữ chính: 돌아올 수밖에 없었다 → 'đành phải trở về'.", "cut": "2 khúc tại ‐아/어(서): ① 하지만 마땅한 사냥감을 잡지 못해 (nhưng vì không bắt được con mồi ra hồn) ② 굶주린 채 돌아올 수밖에 없었다 (đành phải về trong cơn đói).", "mod": "마땅한 → 사냥감: 'con mồi ra hồn' (ngắn, danh từ trước).", "words": "사냥감 = 사냥 (săn) + 감 → con mồi · 굶주리다 = đoán từ 굶다 (nhịn đói) → đói khát"}, "N8": {"v": "Chủ ngữ: 기회비용이란 (chi phí cơ hội là) · Vị ngữ chính: 편익을 뜻한다 → câu định nghĩa: 'A là B'.", "cut": "2 khúc: ① 기회비용이란 (chi phí cơ hội là) ② 무엇을 선택하고 다른 것을 포기함으로써 잃어버리는 편익을 뜻한다 (lợi ích mất đi do chọn một thứ và bỏ thứ khác).", "mod": "무엇을 선택하고 다른 것을 포기함으로써 잃어버리는 → 편익: dịch 'lợi ích bị mất đi' trước, 'do chọn… và từ bỏ…' sau.", "words": "기회비용 機會費用 cơ hội phí dụng = chi phí cơ hội · 편익 便益 tiện ích = lợi ích · 포기 抛棄 phao khí = từ bỏ"}, "N9": {"v": "Chủ ngữ ẩn (ta, người lựa chọn) · Vị ngữ chính: 신중히 선택해야 한다 → 'phải thận trọng lựa chọn'.", "cut": "3 khúc: ① 그래서 어떤 하나를 선택할 때는 (vì vậy khi chọn một thứ) ② 다른 하나 혹은 선택에 따른 득실을 따져 보고 (cân nhắc thứ còn lại hoặc được mất) ③ 신중히 선택해야 한다 (rồi mới thận trọng quyết định).", "mod": "선택에 따른 → 득실: 'cái được cái mất đi kèm lựa chọn'.", "words": "득실 得失 đắc thất = được và mất · 신중 愼重 thận trọng · 따지다 = cân nhắc, tính toán (đoán từ ngữ cảnh 'xem xét rồi chọn')"}, "N10": {"v": "Chủ ngữ: 기업과 정부 (역시) · Vị ngữ chính: 겪고 있다 → 'luôn gặp phải'.", "cut": "1 khúc: 기업과 정부 역시 (doanh nghiệp và chính phủ cũng) + 이러한 선택 문제를 늘 겪고 있다.", "mod": "이러한 → 선택 문제: 'vấn đề lựa chọn như vậy'.", "words": "기업 企業 xí nghiệp = doanh nghiệp · 정부 政府 chính phủ"}, "N11": {"v": "Vế 1: Chủ ngữ 기업은 · Vị ngữ '선택'을 하고 · Vế 2: Chủ ngữ 정부 역시 · Vị ngữ 갈림길에 서 있는 건 다를 바 없다 → 'cũng chẳng khác gì, đứng trước ngã rẽ'.", "cut": "4 khúc: ① 저비용 고효율이라고 하는 경제 원칙에 따라서 (theo nguyên tắc 'chi phí thấp, hiệu quả cao') ② 더욱 이익을 추구할 수 있는 경우를 만들기 위해서 기업은 매 순간 '선택'을 하고 (để tạo cơ hội theo đuổi lợi nhuận, doanh nghiệp lựa chọn từng khoảnh khắc) ③ 정부 역시 … 어떻게 사용해야 하는지, 어느 분야에 더욱 집중해야 하는지 등 (chính phủ cũng: dùng thuế ra sao, tập trung lĩnh vực nào…) ④ 다양한 '선택'의 갈림길에 서 있는 건 다를 바 없다 (đứng trước nhiều ngã rẽ, chẳng khác gì).", "mod": "저비용 고효율이라고 하는 → 경제 원칙 ('nguyên tắc kinh tế \"chi phí thấp, hiệu quả cao\"') · 더욱 이익을 추구할 수 있는 → 경우 ('cơ hội theo đuổi nhiều lợi nhuận hơn') · 국민과 기업으로부터 받은 → 세금 ('tiền thuế thu từ người dân và doanh nghiệp').", "words": "저비용 고효율 低費用 高效率 đê phí dụng cao hiệu suất = chi phí thấp, hiệu quả cao · 추구 追求 truy cầu = theo đuổi · 갈림길 = 갈리다 (tách ra) + 길 (đường) → ngã rẽ"}, "N12": {"v": "Chủ ngữ: 우리는 · Vị ngữ chính: '기회비용'이라고 부른다 → cấu trúc 'gọi A là B'.", "cut": "2 khúc: ① 어느 하나를 선택함으로써 포기해야만 하는 다른 하나를 (thứ còn lại phải bỏ khi chọn một thứ) ② 우리는 '기회비용'이라고 부른다 (chúng ta gọi là 'chi phí cơ hội').", "mod": "어느 하나를 선택함으로써 포기해야만 하는 → 다른 하나: dịch 'thứ còn lại' trước, 'mà ta buộc phải từ bỏ khi chọn một thứ' sau.", "words": "‐(으)ㅁ으로써 = bằng việc, do việc · ‐아/어야만 하다 = buộc phải (만 nhấn mạnh)"}, "N13": {"v": "Chủ ngữ: 우리는 · Vị ngữ chính: '매몰비용'이라고 한다 → 'gọi là chi phí chìm'.", "cut": "2 khúc: ① 이미 써 버렸기 때문에 돌려받을 수 없는 돈을 (số tiền đã tiêu nên không lấy lại được) ② 우리는 '매몰비용'이라고 한다 (chúng ta gọi là chi phí chìm).", "mod": "이미 써 버렸기 때문에 돌려받을 수 없는 → 돈: 'số tiền' trước, 'đã tiêu mất nên không thể lấy lại' sau.", "words": "매몰 埋沒 mai một = chôn vùi → 매몰비용 = chi phí chìm · 돌려받다 = 돌리다 (trả lại) + 받다 (nhận) → nhận lại"}, "N14": {"v": "Chủ ngữ ẩn (ta/người ta) · Vị ngữ chính: 매몰비용의 오류라고 한다 → 'được gọi là ngụy biện chi phí chìm'.", "cut": "2 khúc: ① '매몰비용을 포기하지 못하고 더 큰 손해를 보는 것'을 (việc không buông được chi phí chìm rồi chịu thiệt lớn hơn) ② 매몰비용의 오류라고 한다 (gọi là ngụy biện chi phí chìm).", "mod": "매몰비용을 포기하지 못하고 더 큰 손해를 보는 → 것: 'việc' trước, 'không chịu buông bỏ… rồi chịu thiệt hại lớn hơn' sau.", "words": "손해 損害 tổn hại = thiệt hại · 오류 誤謬 ngộ mậu = sai lầm (ở đây dịch 'ngụy biện')"}}}, "2": {"t": "K-pop과 경제적 가치", "p": "36–37", "A": [["Đoạn 1 · Đêm diễn K-pop ở Paris"], ["A1", "소녀시대, 샤이니, 2PM. 이들은 한국의 대표적 아이돌 그룹(idol group)이다.", "대표적 = tiêu biểu · 아이돌 그룹 = nhóm nhạc thần tượng · 이들 = những người này", "Girls’ Generation, SHINee, 2PM – đây là những nhóm nhạc thần tượng tiêu biểu của Hàn Quốc."], ["A2", "이들 그룹이 유럽 각지에서 온 1만여 K-pop 관중들을 <b>사로잡았다<sup>1</sup></b>.", "사로잡다 = chinh phục, thu hút · 각지 = khắp nơi · 1만여 = hơn 1 vạn (hơn 10.000)", "Các nhóm nhạc này đã chinh phục hơn 10.000 khán giả K-pop đến từ khắp nơi ở châu Âu."], ["A3", "프랑스는 물론이고 스페인, 이탈리아 등지에서 온 <b>관중<sup>2</sup></b>들은 영하 8도의 추운 날씨에도 아랑곳없이 K-pop 스타들을 <b>응원하였다<sup>3</sup></b>.", "관중 = khán giả · 응원하다 = cổ vũ · N은/는 물론이고 = không chỉ N mà còn · 등지 = những nơi như · 영하 = âm (độ) · N에(도) 아랑곳없이 = bất chấp N", "Khán giả không chỉ từ Pháp mà còn từ Tây Ban Nha, Ý và nhiều nơi khác đã cổ vũ các ngôi sao K-pop, bất chấp thời tiết lạnh âm 8 độ."], ["A4", "이것은 파리의 ‘베르시 스타디움(Bercy Stadium)’에서 열린 KBS ‘K-pop Festival Music Bank in Paris’에서의 모습이다.", "열리다 = được tổ chức · 모습 = hình ảnh, quang cảnh · N에서의 = tại N", "Đó là quang cảnh tại chương trình ‘K-pop Festival Music Bank in Paris’ của đài KBS, được tổ chức ở ‘Sân vận động Bercy’ tại Paris."], ["Đoạn 2 · K-pop thành giải trí toàn cầu"], ["A5", "이제 K-pop은 일본, 중국은 물론이고 동남아시아와 중동 지역에 이어 전 세계인이 함께 즐기는 ‘글로벌 엔터테인먼트(global entertainment)’가 되었다.", "N은/는 물론이고 = không chỉ N mà còn · 중동 = Trung Đông · N에 이어 = tiếp sau N · 전 세계인 = người dân toàn thế giới · N이/가 되다 = trở thành N", "Giờ đây, K-pop không chỉ phổ biến ở Nhật Bản, Trung Quốc mà tiếp sau Đông Nam Á và Trung Đông, đã trở thành ‘nền giải trí toàn cầu’ mà người dân khắp thế giới cùng thưởng thức."], ["A6", "이들 K-pop 스타들의 <b>활약<sup>4</sup></b>은 한국 엔터테인먼트 산업 성장에 기여를 했을 뿐만 아니라, 나아가 한국이라는 국가 브랜드 이미지를 높이는 데에도 큰 <b>공헌<sup>5</sup></b>을 했다.", "활약 = hoạt động sôi nổi, sự tỏa sáng · 공헌 = cống hiến, đóng góp · 기여하다 = góp phần · ‐았/었을 뿐만 아니라 = không những… mà còn · 나아가 = xa hơn nữa · ‐는 데(에) = trong việc", "Sự tỏa sáng của các ngôi sao K-pop này không những góp phần vào sự phát triển của ngành giải trí Hàn Quốc, mà xa hơn còn đóng góp lớn trong việc nâng cao hình ảnh thương hiệu quốc gia mang tên Hàn Quốc."], ["Đoạn 3 · Vì sao K-pop được yêu thích"], ["A7", "그렇다면 왜 K-pop이 전세계적으로 <b>인기몰이<sup>6</sup></b>를 하고 있을까?", "인기몰이(를) 하다 = gây sốt, thu hút sự yêu thích · 그렇다면 = vậy thì · 전세계적으로 = trên toàn thế giới · ‐(으)ㄹ까? = phải chăng / tại sao…?", "Vậy thì tại sao K-pop lại đang gây sốt trên toàn thế giới?"], ["A8", "우선 아이돌 그룹의 음악적 특징 때문이라고 할 수 있다.", "음악적 특징 = đặc trưng âm nhạc · N 때문이다 = là do N · ‐다고 할 수 있다 = có thể nói là", "Trước hết, có thể nói đó là nhờ đặc trưng âm nhạc của các nhóm nhạc thần tượng."], ["A9", "단순하고 <b>경쾌하며<sup>7</sup></b> 따라 부르기 쉬운 멜로디(melody), 재미있는 노랫말은 듣는 사람으로 하여금 노래를 쉽게 기억하게 만든다.", "경쾌하다 = vui tươi, nhẹ nhàng · 단순하다 = đơn giản · 따라 부르다 = hát theo · 노랫말 = lời bài hát · N(으)로 하여금 ‐게 만들다 = khiến N phải/được…", "Giai điệu đơn giản, vui tươi, dễ hát theo cùng ca từ thú vị khiến người nghe dễ dàng nhớ bài hát."], ["A10", "또한 기획사에서 오랜 시간 동안 훈련을 받은 아이돌 그룹은 훌륭한 춤 실력뿐만 아니라 멋진 외모, <b>감각적<sup>8</sup></b> 패션 스타일로 서구의 팝보다는 <b>시각적<sup>9</sup></b>으로도 즐거움이 크다.", "감각적 = đầy cảm quan, tinh tế · 시각적 = về mặt thị giác · 기획사 = công ty quản lý · 훈련을 받다 = được đào tạo · N뿐만 아니라 = không chỉ N · 외모 = ngoại hình · 서구 = phương Tây · N보다는 = so với N", "Ngoài ra, các nhóm thần tượng được công ty quản lý đào tạo trong thời gian dài không chỉ có kỹ năng nhảy xuất sắc mà còn có ngoại hình đẹp và phong cách thời trang tinh tế, nên so với nhạc pop phương Tây, họ còn mang lại nhiều niềm vui cả về mặt thị giác."], ["Đoạn 4 · Giá trị kinh tế của K-pop"], ["A11", "K-pop의 인기는 경제적 가치 창출로도 <b>이어진다<sup>10</sup></b>.", "이어지다 = dẫn đến, tiếp nối · 창출 = tạo ra · N(으)로 이어지다 = dẫn đến N", "Sự nổi tiếng của K-pop còn dẫn đến việc tạo ra giá trị kinh tế."], ["A12", "한국문화산업교류재단(韓國文化産業交流財團)이 발표한 K-pop의 경제적 <b>파급<sup>11</sup></b> 효과는 2011년에만 약 6조원<b>에 달하는<sup>12</sup></b> 것으로 <b>추정하고<sup>13</sup></b> 있다.", "파급 효과 = hiệu ứng lan tỏa · 달하다 = đạt tới · 추정하다 = ước tính · N에 달하다 = lên tới N · 조 = nghìn tỷ · ‐는 것으로 추정하다 = ước tính rằng", "Theo công bố của Quỹ Giao lưu Công nghiệp Văn hóa Hàn Quốc, hiệu ứng lan tỏa kinh tế của K-pop được ước tính lên tới khoảng 6 nghìn tỷ won chỉ riêng trong năm 2011."], ["A13", "한국관광공사(韓國觀光公社)의 ‘한국의료관광총람 2012년’에 따르면 의료 서비스를 받기 위해 내한한 외국인은 2009년 6만 201명에서, 2010년 8만 1789명으로 늘어난 데 이어서 2011년에는 11만 명으로 증가하였다고 한다.", "N에 따르면 = theo N · 내한하다 = đến Hàn Quốc · ‐기 위해 = để · N에서 N(으)로 늘어나다 = tăng từ N lên N · ‐(으)ㄴ 데 이어(서) = tiếp sau việc · ‐다고 한다 = nghe nói, cho biết", "Theo ‘Tổng lãm Du lịch Y tế Hàn Quốc 2012’ của Tổng cục Du lịch Hàn Quốc, số người nước ngoài đến Hàn Quốc để sử dụng dịch vụ y tế đã tăng từ 60.201 người năm 2009 lên 81.789 người năm 2010, và tiếp tục tăng lên 110.000 người vào năm 2011."], ["A14", "K-pop의 인기는 문화, 관광, 유통 등의 매출 <b>증대<sup>14</sup></b>에 큰 파급 효과를 주었다.", "증대 = sự gia tăng · 매출 = doanh thu · 유통 = phân phối, bán lẻ · 효과를 주다 = tạo hiệu ứng", "Sự nổi tiếng của K-pop đã tạo hiệu ứng lan tỏa lớn đến việc tăng doanh thu của các ngành văn hóa, du lịch, phân phối…"], ["Đoạn 5 · Internet, SNS và YouTube"], ["A15", "이 같은 K-pop의 글로벌 진출 배경에는 인터넷(internet)과 SNS가 <b>한몫<sup>15</sup></b>하고 있다.", "한몫하다 = góp một phần · 진출 = vươn ra · 배경 = bối cảnh, phía sau · 이 같은 = như thế này", "Internet và mạng xã hội đã góp một phần quan trọng phía sau việc K-pop vươn ra toàn cầu như vậy."], ["A16", "뿐만 아니라 YouTube도 K-pop 스타들의 인기를 <b>달군<sup>16</sup></b> 요인 중의 하나라고 <b>분석되고<sup>17</sup></b> 있다.", "달구다 = hâm nóng · 분석되다 = được phân tích · 요인 = yếu tố · N 중의 하나 = một trong những N · ‐(이)라고 분석되다 = được phân tích là", "Không chỉ vậy, YouTube cũng được phân tích là một trong những yếu tố hâm nóng sự nổi tiếng của các ngôi sao K-pop."], ["A17", "최근 전 세계를 <b>휩쓸고<sup>18</sup></b> 있는 싸이(Psy)의 ‘강남 스타일(Gangnam Style)’은 2014년 유튜브 <b>조회<sup>19</sup></b> 수 20억 건을 <b>돌파했으며<sup>20</sup></b>, K-pop 가수들의 <b>영상<sup>21</sup></b>은 2012년 이미 235개국에서 40억 차례 이상 조회되어 2010년에 비해 5배나 늘었다.", "휩쓸다 = càn quét, làm mưa làm gió · 조회 수 = lượt xem · 돌파하다 = vượt mốc · 영상 = video · ‐(으)며 = và · 억 = trăm triệu · 차례 = lần · N에 비해 = so với N · N배나 = những N lần<br><b>Note:</b> câu dài 2 vế, cắt ở ‐(으)며. Vế ①: 강남 스타일은 … 돌파했으며. Vế ②: 영상은 … 조회되어 늘었다. Định ngữ 최근 전 세계를 휩쓸고 있는 → dịch “Gangnam Style của Psy” trước, rồi “bài hát gần đây đang làm mưa làm gió…”. Hai chủ ngữ cùng có 은/는 → vế sau thêm “còn”. 이미 = ngay từ · 5배나 = tăng tới 5 lần · 20억 = 2 tỷ, 40억 = 4 tỷ.", "‘Gangnam Style’ của PSY – bài hát gần đây làm mưa làm gió khắp thế giới – đã vượt mốc 2 tỷ lượt xem trên YouTube vào năm 2014; còn video của các ca sĩ K-pop ngay từ năm 2012 đã được xem hơn 4 tỷ lần ở 235 quốc gia, tăng gấp 5 lần so với năm 2010."], ["Đoạn 6 · Thách thức: duy trì làn sóng Hallyu"], ["A18", "K-pop은 짧은 시간에 국가브랜드 가치와 경제적 효과를 <b>상승시키는<sup>22</sup></b> 역할을 하고 있다.", "상승시키다 = nâng cao · 역할을 하다 = đóng vai trò · 짧은 시간에 = trong thời gian ngắn", "K-pop đang đóng vai trò nâng cao giá trị thương hiệu quốc gia và hiệu quả kinh tế chỉ trong thời gian ngắn."], ["A19", "따라서 전세계에 불고 있는 한류 <b>열풍<sup>23</sup></b>을 <b>지속시킬<sup>24</sup></b> 방법 <b>모색<sup>25</sup></b>이 K-pop이 안고 있는 과제다.", "열풍 = cơn sốt · 지속시키다 = duy trì · 모색 = sự tìm tòi · 한류 = làn sóng Hàn Quốc (Hallyu) · 불다 = thổi · 과제를 안다 = mang trên vai nhiệm vụ", "Vì vậy, nhiệm vụ mà K-pop đang phải gánh vác là tìm ra cách duy trì cơn sốt Hallyu đang lan khắp thế giới."]], "B": [["Bài báo 1 · K팝 뜨면 화장품도 뜬다…한류, 연관산업 수출 2배 견인", "<a href=\"https://v.daum.net/v/20260709175215275\" target=\"_blank\" rel=\"noopener\">파이낸셜뉴스 (qua Daum), 2026.07.09</a>"], ["N1", "한류가 화장품·식품·패션 등 연관 산업의 해외 진출을 견인하는 경제적 <b>파급</b>효과가 큰 것으로 나타났다.", "파급효과 = hiệu ứng lan tỏa · 연관 산업 = ngành liên quan · 해외 진출 = vươn ra nước ngoài · 견인하다 = kéo theo, dẫn dắt · ‐는 것으로 나타나다 = cho thấy là<br><b>Note (gặp từ lạ):</b> ① dựng khung câu, chừa trống từ lạ; ② đoán Hán Việt: 견인 牽引 khiên dẫn = kéo, 파급 波及 ba cập = lan tới → 파급효과 = hiệu ứng lan tỏa; ③ đoán theo ngữ cảnh (Hallyu làm gì với việc ra nước ngoài → thúc đẩy); ④ bí thì dùng từ chung: tác động, góp phần.", "Kết quả cho thấy Hallyu có hiệu ứng lan tỏa kinh tế lớn, kéo theo việc vươn ra nước ngoài của các ngành liên quan như mỹ phẩm, thực phẩm, thời trang."], ["N2", "9일 한국콘텐츠진흥원이 발행한 ‘코카포커스 214호 ‘한류산업 수출의 경제 효과’’에 따르면 한류산업 수출이 1억 달러 증가할 경우 화장품, 식품, 패션 등 한류 연관산업의 수출은 2억200만 달러 늘어나는 것으로 분석됐다.", "N에 따르면 = theo N · 발행하다 = phát hành · ‐(으)ㄹ 경우 = trong trường hợp · 수출 = xuất khẩu · 분석되다 = được phân tích", "Theo ‘KOCCA Focus số 214 – Hiệu quả kinh tế của xuất khẩu ngành Hallyu’ do Cơ quan Xúc tiến Nội dung Hàn Quốc phát hành ngày 9, phân tích cho thấy khi xuất khẩu ngành Hallyu tăng 100 triệu USD thì xuất khẩu các ngành liên quan như mỹ phẩm, thực phẩm, thời trang tăng 202 triệu USD."], ["N3", "다시 말해 K팝과 드라마, 게임 등 한류 콘텐츠 수출이 1억 달러 늘면 해외 소비자들이 한국 화장품과 식품, 패션 제품 등을 추가로 구매하면서 약 2억200만 달러의 연관산업 수출이 발생하는 셈이다.", "다시 말해 = nói cách khác · 추가로 = thêm · 구매하다 = mua · ‐(으)면서 = trong khi, đồng thời · ‐는 셈이다 = coi như là, tính ra là", "Nói cách khác, nếu xuất khẩu nội dung Hallyu như K-pop, phim truyền hình, game tăng 100 triệu USD thì người tiêu dùng nước ngoài sẽ mua thêm mỹ phẩm, thực phẩm, thời trang Hàn Quốc…, tính ra tạo thêm khoảng 202 triệu USD xuất khẩu cho các ngành liên quan."], ["N4", "국내 경제에 미치는 파급효과도 상당했다.", "N에 미치다 = tác động đến N · 상당하다 = đáng kể", "Hiệu ứng lan tỏa đối với nền kinh tế trong nước cũng rất đáng kể."], ["N5", "한류산업 수출은 국내에서 7824억원의 생산을 유발하고, 3389명의 취업을 창출하는 것으로 나타났다.", "유발하다 = gây ra, kéo theo · 취업 = việc làm · 창출하다 = tạo ra", "Xuất khẩu ngành Hallyu được cho là kéo theo 782,4 tỷ won giá trị sản xuất trong nước và tạo ra 3.389 việc làm."], ["N6", "이번 보고서는 2006년부터 2024년까지 중화권, 일본, 동남아시아, 북미, 유럽 등 6개 권역의 수출 데이터를 바탕으로 한류산업과 한류 연관산업의 연계 효과를 분석했다.", "보고서 = báo cáo · 중화권 = khu vực Hoa ngữ · 권역 = khu vực · N을/를 바탕으로 = dựa trên N · 연계 효과 = hiệu ứng liên kết", "Báo cáo lần này dựa trên dữ liệu xuất khẩu từ năm 2006 đến 2024 của 6 khu vực gồm khu vực Hoa ngữ, Nhật Bản, Đông Nam Á, Bắc Mỹ, châu Âu…, để phân tích hiệu ứng liên kết giữa ngành Hallyu và các ngành liên quan."], ["N7", "한류산업 수출에서는 게임이 전체의 64.3%로 가장 높은 비중을 차지했다.", "비중을 차지하다 = chiếm tỷ trọng · 전체 = toàn bộ", "Trong xuất khẩu ngành Hallyu, game chiếm tỷ trọng cao nhất với 64,3% tổng số."], ["N8", "하지만 성장세 기준으로 살펴보면 K-팝을 중심으로 한 음악이 연평균 29.7%, 웹툰 성장에 힘입은 만화는 연평균 26.3%의 성장세를 기록하며 게임 중심의 수출 구조를 넘어 한류 콘텐츠의 성장축이 다변화되고 있음을 보여줬다.", "성장세 = đà tăng trưởng · N을/를 중심으로 한 = lấy N làm trung tâm · 연평균 = bình quân năm · N에 힘입다 = nhờ vào N · 다변화되다 = được đa dạng hóa · ‐음을 보여주다 = cho thấy rằng", "Tuy nhiên, xét theo đà tăng trưởng, âm nhạc với K-pop làm trung tâm tăng bình quân 29,7% mỗi năm, truyện tranh nhờ sự phát triển của webtoon tăng 26,3% mỗi năm, cho thấy trục tăng trưởng của nội dung Hallyu đang được đa dạng hóa, vượt ra ngoài cơ cấu xuất khẩu lấy game làm trọng tâm."], ["N9", "한류 연관산업에서는 관광이 가장 큰 비중을 차지했고, 화장품은 연평균 21.3%의 성장률로 가장 빠르게 성장한 품목으로 조사됐다.", "관광 = du lịch · 성장률 = tốc độ tăng trưởng · 품목 = mặt hàng · 조사되다 = được khảo sát, điều tra cho thấy", "Trong các ngành liên quan đến Hallyu, du lịch chiếm tỷ trọng lớn nhất, còn mỹ phẩm là mặt hàng tăng trưởng nhanh nhất với tốc độ bình quân 21,3% mỗi năm."]], "V": [[1, "사로잡다", "—", "thu hút, chinh phục (trái tim)"], [2, "관중", "觀衆 quan chúng", "khán giả"], [3, "응원하다", "應援 ứng viện", "cổ vũ, ủng hộ"], [4, "활약", "活躍 hoạt dược", "sự hoạt động sôi nổi, sự tỏa sáng"], [5, "공헌", "貢獻 cống hiến", "sự cống hiến, đóng góp"], [6, "인기몰이", "人氣 nhân khí (+ 몰이)", "sự gây sốt, thu hút sự yêu thích"], [7, "경쾌하다", "輕快 khinh khoái", "vui tươi, nhẹ nhàng, rộn ràng"], [8, "감각적", "感覺的 cảm giác đích", "đầy cảm quan, tinh tế, hợp gu"], [9, "시각적", "視覺的 thị giác đích", "(thuộc) thị giác"], [10, "이어지다", "—", "tiếp nối, dẫn đến"], [11, "파급", "波及 ba cập", "sự lan tỏa, ảnh hưởng lan rộng"], [12, "달하다", "達 đạt", "đạt tới, lên tới"], [13, "추정하다", "推定 suy định", "ước tính, suy đoán"], [14, "증대", "增大 tăng đại", "sự gia tăng, tăng lên"], [15, "한몫", "—", "một phần (đóng góp)"], [16, "달구다", "—", "hâm nóng, làm nóng lên"], [17, "분석되다", "分析 phân tích", "được phân tích"], [18, "휩쓸다", "—", "càn quét, làm mưa làm gió"], [19, "조회", "照會 chiếu hội", "sự tra cứu, lượt xem"], [20, "돌파하다", "突破 đột phá", "vượt qua, vượt mốc"], [21, "영상", "映像 ánh tượng", "video, hình ảnh"], [22, "상승시키다", "上昇 thượng thăng", "nâng cao, làm tăng lên"], [23, "열풍", "熱風 nhiệt phong", "cơn sốt, làn sóng"], [24, "지속시키다", "持續 trì tục", "duy trì, làm cho kéo dài"], [25, "모색", "摸索 mô sách", "sự tìm tòi, tìm kiếm (giải pháp)"]], "AN": {"N1": {"v": "Chủ ngữ: 한류가 … 파급효과가 · Vị ngữ chính: 큰 것으로 나타났다 → câu báo cáo kết quả: 'kết quả cho thấy Hallyu có hiệu ứng lan tỏa lớn…'.", "cut": "2 khúc: ① 한류가 … 경제적 파급효과가 큰 것으로 나타났다 (kết quả cho thấy Hallyu có hiệu ứng lan tỏa kinh tế lớn) ② 화장품·식품·패션 등 연관 산업의 해외 진출을 견인하는 (kéo theo việc ra nước ngoài của các ngành liên quan).", "mod": "화장품·식품·패션 등 연관 산업의 해외 진출을 견인하는 → 경제적 파급효과: dịch 'hiệu ứng lan tỏa kinh tế lớn' trước, 'kéo theo việc vươn ra nước ngoài của các ngành…' sau.", "words": "견인 牽引 khiên dẫn = kéo · 파급 波及 ba cập = lan tới → hiệu ứng lan tỏa · 진출 進出 tiến xuất = vươn ra"}, "N2": {"v": "Chủ ngữ: 연관산업의 수출은 · Vị ngữ chính: 늘어나는 것으로 분석됐다 → 'phân tích cho thấy… tăng'.", "cut": "3 khúc: ① 9일 한국콘텐츠진흥원이 발행한 '코카포커스 214호…'에 따르면 (theo KOCCA Focus số 214 do… phát hành ngày 9) ② 한류산업 수출이 1억 달러 증가할 경우 (khi xuất khẩu Hallyu tăng 100 triệu USD) ③ 화장품, 식품, 패션 등 … 수출은 2억200만 달러 늘어나는 것으로 분석됐다 (thì xuất khẩu ngành liên quan tăng 202 triệu USD).", "mod": "9일 한국콘텐츠진흥원이 발행한 → '코카포커스 214호': tên báo cáo trước, 'do Cơ quan Xúc tiến Nội dung Hàn Quốc phát hành ngày 9' sau.", "words": "진흥원 振興院 chấn hưng viện = cơ quan xúc tiến · 발행 發行 phát hành · 억 億 ức → 1억 달러 = 100 triệu USD"}, "N3": {"v": "Chủ ngữ: 연관산업 수출이 · Vị ngữ chính: 발생하는 셈이다 → 'tính ra là tạo ra…'.", "cut": "3 khúc: ① 다시 말해 K팝과 드라마, 게임 등 한류 콘텐츠 수출이 1억 달러 늘면 (nói cách khác, nếu xuất khẩu nội dung Hallyu tăng 100 triệu USD) ② 해외 소비자들이 … 추가로 구매하면서 (người tiêu dùng nước ngoài mua thêm…) ③ 약 2억200만 달러의 연관산업 수출이 발생하는 셈이다 (tính ra tạo thêm ~202 triệu USD xuất khẩu ngành liên quan).", "mod": "Không có định ngữ dài (chỉ cụm danh từ liệt kê: K팝과 드라마, 게임 등 → 한류 콘텐츠 'nội dung Hallyu như K-pop, phim, game').", "words": "구매 購買 cấu mãi = mua · 발생 發生 phát sinh = phát sinh, tạo ra · ‐는 셈이다 = coi như, tính ra là"}, "N4": {"v": "Chủ ngữ: 파급효과도 · Vị ngữ chính: 상당했다 → 'cũng rất đáng kể'.", "cut": "1 khúc: 국내 경제에 미치는 파급효과도 상당했다.", "mod": "국내 경제에 미치는 → 파급효과: 'hiệu ứng lan tỏa' trước, 'đối với nền kinh tế trong nước' sau.", "words": "상당 相當 tương đương → đáng kể · 미치다 = tác động tới (N에 미치다)"}, "N5": {"v": "Chủ ngữ: 한류산업 수출은 · Vị ngữ chính: 유발하고, 창출하는 것으로 나타났다 → 'được cho là kéo theo… và tạo ra…'.", "cut": "2 khúc tại ‐고: ① 한류산업 수출은 국내에서 7824억원의 생산을 유발하고 (kéo theo 782,4 tỷ won sản xuất trong nước) ② 3389명의 취업을 창출하는 것으로 나타났다 (và tạo ra 3.389 việc làm).", "mod": "Không có định ngữ dài.", "words": "유발 誘發 dụ phát = gây ra, kéo theo · 창출 創出 sáng xuất = tạo ra · 7824억원 = 782,4 tỷ won (1억 = 100 triệu)"}, "N6": {"v": "Chủ ngữ: 이번 보고서는 · Vị ngữ chính: 연계 효과를 분석했다 → 'báo cáo phân tích…'.", "cut": "2 khúc: ① 이번 보고서는 2006년부터 2024년까지 … 6개 권역의 수출 데이터를 바탕으로 (báo cáo dựa trên dữ liệu xuất khẩu 2006–2024 của 6 khu vực) ② 한류산업과 한류 연관산업의 연계 효과를 분석했다 (để phân tích hiệu ứng liên kết giữa…).", "mod": "중화권, 일본, 동남아시아, 북미, 유럽 등 → 6개 권역: '6 khu vực gồm Hoa ngữ, Nhật Bản…' (số lượng trước, liệt kê sau).", "words": "권역 圈域 quyển vực = khu vực · 연계 連繫 liên hệ = liên kết · 중화권 中華圈 = khu vực Hoa ngữ"}, "N7": {"v": "Chủ ngữ: 게임이 · Vị ngữ chính: 가장 높은 비중을 차지했다 → 'chiếm tỷ trọng cao nhất'.", "cut": "1 khúc: 한류산업 수출에서는 (trong xuất khẩu Hallyu) + 게임이 전체의 64.3%로 가장 높은 비중을 차지했다.", "mod": "Không có định ngữ dài.", "words": "비중 比重 tỷ trọng · 차지 = chiếm (비중을 차지하다 = chiếm tỷ trọng)"}, "N8": {"v": "Chủ ngữ: 음악이, 만화는 · Vị ngữ: 성장세를 기록하며 … 보여줬다 → 'tăng…, cho thấy rằng…'.", "cut": "4 khúc: ① 하지만 성장세 기준으로 살펴보면 (tuy nhiên, xét theo đà tăng trưởng) ② K-팝을 중심으로 한 음악이 연평균 29.7% (âm nhạc lấy K-pop làm trung tâm tăng 29,7%/năm) ③ 웹툰 성장에 힘입은 만화는 연평균 26.3%의 성장세를 기록하며 (truyện tranh nhờ webtoon tăng 26,3%/năm) ④ 게임 중심의 수출 구조를 넘어 … 다변화되고 있음을 보여줬다 (cho thấy trục tăng trưởng đang đa dạng hóa, vượt ra ngoài cơ cấu lấy game làm trọng tâm).", "mod": "K-팝을 중심으로 한 → 음악 ('âm nhạc với K-pop làm trung tâm') · 웹툰 성장에 힘입은 → 만화 ('truyện tranh nhờ sự phát triển của webtoon') · 게임 중심의 → 수출 구조 ('cơ cấu xuất khẩu lấy game làm trọng tâm').", "words": "다변화 多變化 đa biến hóa = đa dạng hóa · 성장축 成長軸 thành trưởng trục = trục tăng trưởng · 힘입다 = nhờ vào"}, "N9": {"v": "Vế 1: Chủ ngữ 관광이 · Vị ngữ 비중을 차지했고 · Vế 2: Chủ ngữ 화장품은 · Vị ngữ 품목으로 조사됐다 → 'là mặt hàng… (theo khảo sát)'.", "cut": "2 khúc tại ‐고: ① 한류 연관산업에서는 관광이 가장 큰 비중을 차지했고 (trong các ngành liên quan, du lịch chiếm tỷ trọng lớn nhất) ② 화장품은 연평균 21.3%의 성장률로 가장 빠르게 성장한 품목으로 조사됐다 (còn mỹ phẩm là mặt hàng tăng nhanh nhất, 21,3%/năm).", "mod": "(연평균 21.3%의 성장률로) 가장 빠르게 성장한 → 품목: 'mặt hàng' trước, 'tăng trưởng nhanh nhất' sau.", "words": "품목 品目 phẩm mục = mặt hàng · 관광 觀光 quan quang = du lịch · 조사 調査 điều tra = khảo sát"}}}, "3": {"t": "기업과 경제 성장", "p": "52–53", "A": [["Đoạn 1 · Doanh nghiệp là gì"], ["A1", "<b>기업<sup>1</sup></b>은 생산활동을 <b>전문<sup>3</sup></b>으로 하기 위해서 만들어진 <b>조직<sup>4</sup></b>이다.", "기업 = doanh nghiệp · 전문 = chuyên môn · 조직 = tổ chức · 생산활동 = hoạt động sản xuất · N을 전문으로 하다 = chuyên về N · ‐기 위해서 = để · ‐아/어지다 = được (bị động)", "Doanh nghiệp là một tổ chức được lập ra để chuyên thực hiện hoạt động sản xuất."], ["A2", "기업은 우리가 필요로 하는 재화나 서비스를 생산하여 <b>공급하는<sup>5</sup></b> 동시에 우리에게 일자리를 <b>제공하는<sup>6</sup></b> 역할을 한다.", "공급하다 = cung cấp, cung ứng · 제공하다 = cung cấp, tạo ra · 재화 = hàng hóa · N을 필요로 하다 = cần đến N · ‐는 동시에 = đồng thời · 일자리 = việc làm · 역할을 하다 = đóng vai trò", "Doanh nghiệp sản xuất và cung ứng những hàng hóa, dịch vụ mà chúng ta cần, đồng thời đóng vai trò tạo ra việc làm cho chúng ta."], ["A3", "특히 기업의 끊임없는 <b>혁신<sup>7</sup></b> 노력은 한 나라의 경제 <b>성장<sup>2</sup></b>에 중요한 요인으로 작용한다.", "혁신 = đổi mới · 성장 = tăng trưởng · 끊임없다 = không ngừng · 요인 = yếu tố · N(으)로 작용하다 = đóng vai trò như N, tác động như N", "Đặc biệt, nỗ lực đổi mới không ngừng của doanh nghiệp là một yếu tố quan trọng đối với sự tăng trưởng kinh tế của một quốc gia."], ["Đoạn 2 · Từ xưởng sửa xe đến hãng ô tô toàn cầu"], ["A4", "오늘날 세계적 <b>규모<sup>8</sup></b>를 <b>자랑하는<sup>9</sup></b> 한국의 한 자동차회사도 처음에는 몇 명의 직원을 가진 자동차 수리 <b>업체<sup>10</sup></b>에 불과하였다.", "규모 = quy mô · 자랑하다 = tự hào, phô trương · 업체 = doanh nghiệp, cơ sở kinh doanh · 수리 = sửa chữa · N에 불과하다 = chỉ là N, chẳng qua là N", "Một hãng ô tô Hàn Quốc ngày nay tự hào có quy mô tầm thế giới, thế nhưng thuở ban đầu cũng chỉ là một cơ sở sửa chữa ô tô với vài nhân viên."], ["A5", "그러나 자동차 수리에 대한 <b>수요<sup>11</sup></b>가 증가하고 회사의 규모가 커지자, 자동차를 개조·가공하는 데까지 규모를 <b>확장하였으며<sup>12</sup></b> 마침내 독자적으로 자동차를 만들기에 이르렀다.", "수요 = nhu cầu · 확장하다 = mở rộng · ‐자 = vừa… thì, khi… thì · 개조·가공하다 = cải tạo, gia công · ‐는 데까지 = đến cả việc · 마침내 = cuối cùng · 독자적으로 = một cách độc lập · ‐기에 이르다 = đi đến chỗ", "Nhưng khi nhu cầu sửa xe tăng lên và công ty lớn dần, họ đã mở rộng quy mô sang cả việc cải tạo, gia công ô tô, và cuối cùng tiến tới tự mình chế tạo ô tô."], ["A6", "초기에는 디자인(design)은 물론 엔진(engine)과 중요 부품을 <b>수입하여<sup>13</sup></b> 생산했기 때문에 <b>제조<sup>14</sup></b>라기보다는 조립에 가까웠다.", "수입하다 = nhập khẩu · 제조 = chế tạo · 초기 = giai đoạn đầu · N은 물론 = không chỉ N mà cả · 부품 = linh kiện · ‐기 때문에 = vì · N(이)라기보다는 = hơn là nói N · 조립 = lắp ráp · N에 가깝다 = gần với N", "Ở giai đoạn đầu, họ nhập khẩu không chỉ thiết kế mà cả động cơ và các linh kiện quan trọng để sản xuất, nên nói là lắp ráp thì đúng hơn là chế tạo."], ["A7", "그러나 이 기업은 성장을 거듭하여 현재는 자체 엔진을 <b>개발하고<sup>15</sup></b> 독자적인 디자인을 통해 자동차를 만들 정도의 세계적인 기업이 되었다.", "개발하다 = phát triển, nghiên cứu chế tạo · 거듭하다 = lặp đi lặp lại, liên tục · 자체 = tự mình, riêng · N을 통해 = thông qua N · ‐(으)ㄹ 정도의 N = N đến mức… · N이/가 되다 = trở thành N", "Thế nhưng doanh nghiệp này đã liên tục lớn mạnh, và hiện nay đã trở thành một doanh nghiệp tầm cỡ thế giới, đủ sức tự phát triển động cơ và làm ra ô tô bằng thiết kế riêng của mình."], ["Đoạn 3 · Mục tiêu của doanh nghiệp: lợi nhuận"], ["A8", "이러한 기업의 목표는 <b>이윤<sup>16</sup></b>을 크게 하는 것이다.", "이윤 = lợi nhuận · 목표 = mục tiêu · ‐게 하다 = làm cho", "Mục tiêu của những doanh nghiệp như vậy là làm cho lợi nhuận lớn hơn."], ["A9", "이윤이 커지면 <b>투자<sup>17</sup></b>가 활발해지고 일자리도 더 많이 만들어진다.", "투자 = đầu tư · 활발해지다 = trở nên sôi động · 만들어지다 = được tạo ra · ‐(으)면 = nếu, khi", "Khi lợi nhuận tăng, đầu tư trở nên sôi động hơn và cũng có nhiều việc làm được tạo ra hơn."], ["A10", "기업이 돈을 벌기 위해서는 사람들이 사고 싶은 상품을 만들어 내야 한다.", "돈을 벌다 = kiếm tiền · ‐기 위해서는 = để… thì · 만들어 내다 = làm ra, tạo ra · ‐아/어야 하다 = phải", "Muốn kiếm được tiền, doanh nghiệp phải làm ra những sản phẩm mà mọi người muốn mua."], ["A11", "기업이 무엇을 생산할 것인가를 결정할 때에는 그 물건이 얼마나 잘 팔릴지, 그리고 얼마나 많은 돈을 벌 수 있을지에 대해 먼저 생각한다.", "결정하다 = quyết định · ‐(으)ㄹ 것인가 = sẽ… gì (câu hỏi gián tiếp) · 팔리다 = bán được · ‐(으)ㄹ지 = liệu có… không · N에 대해 = về N", "Khi quyết định sẽ sản xuất cái gì, doanh nghiệp trước hết suy nghĩ xem món hàng đó sẽ bán chạy đến mức nào và có thể kiếm được bao nhiêu tiền."], ["Đoạn 4 · Cách tính và tối đa hóa lợi nhuận"], ["A12", "기업의 이윤은 <b>판매 수입<sup>18</sup></b>에서 생산하는 데 들어간 비용을 뺀 것으로, 이윤을 크게 하려면 판매 수입과 생산 비용의 차이가 가장 크게 되는 수준에서 생산하면 된다.", "판매 수입 = doanh thu bán hàng · ‐는 데 들어가다 = tốn vào việc · 비용 = chi phí · 빼다 = trừ đi · N(으)로 = là N, và (nối câu) · ‐(으)려면 = nếu muốn · 차이 = chênh lệch · 수준 = mức · ‐(으)면 되다 = chỉ cần… là được", "Lợi nhuận của doanh nghiệp là doanh thu bán hàng trừ đi chi phí bỏ ra để sản xuất; muốn lợi nhuận lớn thì chỉ cần sản xuất ở mức mà chênh lệch giữa doanh thu và chi phí sản xuất là lớn nhất."], ["A13", "생산량이 늘어나면 판매 수입이 증가하지만, 생산을 하는 데 드는 비용도 함께 증가하기 때문에 생산량의 무한정 증가가 이윤을 늘리는 데 반드시 유리한 것만은 아니다.", "생산량 = sản lượng · 늘어나다 = tăng lên · 비용이 들다 = tốn chi phí · 무한정 = vô hạn · ‐는 데 유리하다 = có lợi cho việc · 반드시 ~ 것만은 아니다 = không hẳn lúc nào cũng…", "Khi sản lượng tăng thì doanh thu tăng, nhưng chi phí sản xuất cũng tăng theo, nên việc tăng sản lượng vô hạn không hẳn lúc nào cũng có lợi cho việc tăng lợi nhuận."], ["A14", "가능하면 생산비용을 적게 해야 이윤을 크게 할 수 있다.", "가능하면 = nếu có thể · 적게 하다 = làm cho ít đi · ‐아/어야 = phải… thì mới", "Phải giảm chi phí sản xuất hết mức có thể thì mới tăng được lợi nhuận."], ["Đoạn 5 · Doanh nghiệp – trái tim của kinh tế thị trường"], ["A15", "이처럼 기업 활동은 시장경제의 핵심이라 할 수 있다.", "이처럼 = như vậy · 시장경제 = kinh tế thị trường · 핵심 = cốt lõi · N(이)라 할 수 있다 = có thể nói là N", "Như vậy, có thể nói hoạt động của doanh nghiệp là cốt lõi của nền kinh tế thị trường."], ["A16", "왜냐하면 기업가의 <b>창의적<sup>19</sup></b>인 아이디어와 노력을 통해서 소비자들은 과거에 없던 상품을 소비할 수도 있고, 더 값싸고 질 좋은 상품을 구입할 수 있으며, 또한 기업가들의 <b>모험적<sup>20</sup></b>인 <b>시도<sup>21</sup></b>가 경제성장을 <b>주도하기<sup>22</sup></b> 때문이다.", "창의적 = sáng tạo · 모험적 = mạo hiểm, dám liều · 시도 = sự thử nghiệm, nỗ lực thử · 주도하다 = dẫn dắt · 왜냐하면 ~ 때문이다 = bởi vì · ‐던 = (hồi tưởng) đã từng · 값싸다 = rẻ · 질 좋다 = chất lượng tốt · ‐(으)며 = và", "Bởi vì nhờ những ý tưởng sáng tạo và nỗ lực của doanh nhân mà người tiêu dùng có thể dùng những sản phẩm trước đây chưa từng có, mua được hàng rẻ hơn mà chất lượng tốt hơn; hơn nữa, chính những thử nghiệm táo bạo của các doanh nhân đã dẫn dắt tăng trưởng kinh tế."], ["Đoạn 6 · Đóng góp của doanh nghiệp cho kinh tế Hàn Quốc"], ["A17", "한국 경제의 성장에는 현대, 삼성, LG 같은 기업과 기업가들의 창의적인 아이디어가 큰 공헌을 하였다.", "N 같은 = như N · 기업가 = doanh nhân · 공헌을 하다 = đóng góp, cống hiến · N에는 = đối với N", "Những doanh nghiệp như Hyundai, Samsung, LG cùng ý tưởng sáng tạo của các doanh nhân đã đóng góp to lớn vào sự tăng trưởng của kinh tế Hàn Quốc."], ["A18", "기업가들은 자신의 이익을 위해서 기술 개발을 주도하고 위험한 일에 <b>도전하여<sup>23</sup></b> 성공하였고, 그 결과 <b>근로자<sup>24</sup></b>들은 더 높은 <b>임금<sup>25</sup></b>을 받게 되었으며 경제성장을 통하여 국민전체의 생활수준이 높아지게 되었다.", "도전하다 = thử thách, dấn thân · 근로자 = người lao động · 임금 = tiền lương · 이익 = lợi ích · N을 위해서 = vì N · 그 결과 = kết quả là · ‐게 되다 = trở nên, rốt cuộc được · 생활수준 = mức sống", "Vì lợi ích của bản thân, các doanh nhân đã dẫn dắt việc phát triển công nghệ và dám dấn thân vào những việc mạo hiểm để rồi thành công; nhờ đó người lao động được trả lương cao hơn, và nhờ tăng trưởng kinh tế, mức sống của toàn dân cũng được nâng lên."]], "B": [["Bài báo 1 · [Cover Story] 창조와 혁신…기업가정신이 답이다", "<a href=\"https://sgsg.hankyung.com/article/2013112233141\" target=\"_blank\" rel=\"noopener\">생글생글 (한국경제신문), 2013.11.22</a>"], ["N1", "기업가정신(entrepreneurship)은 기업의 본질인 <b>이윤</b>을 추구하고 사회적 책임을 수행하기 위해 기업가가 갖춰야 할 자세나 정신을 일컫는다.", "기업가정신 = tinh thần doanh nhân · 본질 = bản chất · 추구하다 = theo đuổi · 사회적 책임 = trách nhiệm xã hội · 수행하다 = thực hiện · 갖추다 = có được, trang bị · 자세 = thái độ · 일컫다 = gọi là, chỉ", "Tinh thần doanh nhân (entrepreneurship) là thái độ, tinh thần mà người làm kinh doanh cần có để theo đuổi lợi nhuận – bản chất của doanh nghiệp – và thực hiện trách nhiệm xã hội."], ["N2", "창의적 아이디어, 위기를 극복하는 불굴의 정신, 신제품 개발, 신시장 개척, 조직의 효율적 운영, 인재 육성, 공정한 경쟁, 사회적 책임, 미래를 예측하는 통찰력 등은 기업가정신을 이루는 핵심 요소들이다.", "위기를 극복하다 = vượt qua khủng hoảng · 불굴 = bất khuất · 개척 = khai phá · 효율적 운영 = vận hành hiệu quả · 인재 육성 = đào tạo nhân tài · 통찰력 = khả năng nhìn xa trông rộng · 이루다 = tạo nên · 핵심 요소 = yếu tố cốt lõi", "Ý tưởng sáng tạo, tinh thần bất khuất vượt qua khủng hoảng, phát triển sản phẩm mới, khai phá thị trường mới, vận hành tổ chức hiệu quả, đào tạo nhân tài, cạnh tranh công bằng, trách nhiệm xã hội và tầm nhìn dự đoán tương lai là những yếu tố cốt lõi tạo nên tinh thần doanh nhân."], ["N3", "미국의 경제학자 조지프 슘페터(1883~1951)는 기업가정신을 주창한 대표적 인물이다.", "경제학자 = nhà kinh tế học · 주창하다 = khởi xướng · 대표적 인물 = nhân vật tiêu biểu", "Nhà kinh tế học người Mỹ Joseph Schumpeter (1883–1951) là nhân vật tiêu biểu đã khởi xướng khái niệm tinh thần doanh nhân."], ["N4", "그는 새로운 생산 방법과 상품 개발을 기술혁신으로 규정하고, 이러한 기술혁신을 통해 ‘창조적 파괴(creative destruction)’를 선도하는 기업가를 혁신가로 규정했다.", "규정하다 = định nghĩa, xác định · 기술혁신 = đổi mới công nghệ · 창조적 파괴 = sự phá hủy sáng tạo · 선도하다 = đi đầu, dẫn dắt · 혁신가 = nhà đổi mới · A를 B로 규정하다 = định nghĩa A là B", "Ông định nghĩa phương pháp sản xuất mới và việc phát triển sản phẩm mới là đổi mới công nghệ, và coi những doanh nhân dẫn đầu ‘sự phá hủy sáng tạo’ thông qua đổi mới công nghệ ấy là nhà đổi mới."], ["N5", "대한민국이 일제의 억압과 6·25전쟁이라는 역사의 아픔을 딛고 불과 반세기 만에 세계 10대 경제대국으로 부상한 것도 그 바탕엔 기업가정신이 깔려 있다.", "일제 = đế quốc Nhật · 억압 = áp bức · 딛다 = vượt qua (đạp lên) · 불과 = chỉ vỏn vẹn · N 만에 = sau (khoảng thời gian) N · 부상하다 = vươn lên · 바탕 = nền tảng · 깔려 있다 = trải sẵn, nằm bên dưới", "Việc Hàn Quốc vượt qua nỗi đau lịch sử là ách áp bức của đế quốc Nhật và Chiến tranh Triều Tiên để chỉ trong vỏn vẹn nửa thế kỷ vươn lên thành một trong mười nền kinh tế lớn nhất thế giới cũng có nền tảng là tinh thần doanh nhân."], ["N6", "현대그룹의 창업자 고(故) 정주영 회장의 “이봐, 해봤어?’는 도전과 혁신이라는 기업가정신을 한마디로 압축한다.", "창업자 = người sáng lập · 고(故) = cố (người đã mất) · 회장 = chủ tịch · 이봐, 해봤어? = Này, đã thử chưa? · 도전 = thử thách, dấn thân · 한마디로 = trong một câu · 압축하다 = cô đọng", "Câu nói “Này, đã thử làm chưa?” của cố chủ tịch Chung Ju-yung, người sáng lập Tập đoàn Hyundai, đã cô đọng trong một câu tinh thần doanh nhân dám dấn thân và đổi mới."], ["N7", "경제발전의 원동력인 우리나라 기업가정신이 위축되고 있다는 우려가 커지고 있다.", "원동력 = động lực · 위축되다 = bị thu hẹp, co lại · 우려 = lo ngại · ‐다는 우려 = lo ngại rằng · ‐고 있다 = đang", "Ngày càng có nhiều lo ngại rằng tinh thần doanh nhân của Hàn Quốc – động lực của phát triển kinh tế – đang bị thui chột."], ["N8", "한국경제신문이 최근 대한상공회의소와 공동으로 기업 최고경영자(CEO) 204명으로 대상으로 한 설문조사에서 응답자의 81.9%(167명)가 “한국의 기업가정신이 위축됐다”고 답했다.", "대한상공회의소 = Phòng Thương mại và Công nghiệp Hàn Quốc · 공동으로 = cùng phối hợp · 최고경영자 = giám đốc điều hành · N을 대상으로 한 = lấy N làm đối tượng · 설문조사 = khảo sát · 응답자 = người trả lời · ‐다고 답하다 = trả lời rằng", "Trong cuộc khảo sát mà báo Hankyung gần đây phối hợp với Phòng Thương mại và Công nghiệp Hàn Quốc thực hiện với 204 giám đốc điều hành (CEO) doanh nghiệp, 81,9% người trả lời (167 người) cho biết “tinh thần doanh nhân của Hàn Quốc đã bị thui chột”."], ["N9", "대기업의 성공을 보는 불편한 시선, 지나친 규제가 대표적 이유로 지적된다.", "대기업 = doanh nghiệp lớn, tập đoàn · 불편한 시선 = cái nhìn khó chịu · 지나치다 = quá mức · 규제 = quy chế, sự kiểm soát · 지적되다 = được chỉ ra", "Cái nhìn thiếu thiện cảm trước thành công của các tập đoàn lớn và những quy định quá mức được chỉ ra là các nguyên nhân tiêu biểu."]], "V": [[1, "기업", "企業 xí nghiệp", "doanh nghiệp"], [2, "성장", "成長 thành trưởng", "sự tăng trưởng, phát triển"], [3, "전문", "專門 chuyên môn", "chuyên môn, chuyên ngành"], [4, "조직", "組織 tổ chức", "tổ chức"], [5, "공급하다", "供給 cung cấp", "cung cấp, cung ứng"], [6, "제공하다", "提供 đề cung", "cung cấp, đưa ra"], [7, "혁신", "革新 cách tân", "sự đổi mới, cải cách"], [8, "규모", "規模 quy mô", "quy mô"], [9, "자랑하다", "—", "tự hào, khoe"], [10, "업체", "業體 nghiệp thể", "doanh nghiệp, cơ sở kinh doanh"], [11, "수요", "需要 nhu yếu", "nhu cầu"], [12, "확장하다", "擴張 khuếch trương", "mở rộng"], [13, "수입하다", "輸入 thâu nhập", "nhập khẩu"], [14, "제조", "製造 chế tạo", "sự chế tạo, sản xuất"], [15, "개발하다", "開發 khai phát", "phát triển, nghiên cứu chế tạo"], [16, "이윤", "利潤 lợi nhuận", "lợi nhuận"], [17, "투자", "投資 đầu tư", "sự đầu tư"], [18, "판매 수입", "販賣收入 phiến mại thu nhập", "doanh thu bán hàng"], [19, "창의적", "創意的 sáng ý đích", "mang tính sáng tạo"], [20, "모험적", "冒險的 mạo hiểm đích", "mang tính mạo hiểm, táo bạo"], [21, "시도", "試圖 thí đồ", "sự thử, nỗ lực thử nghiệm"], [22, "주도하다", "主導 chủ đạo", "dẫn dắt, chủ đạo"], [23, "도전하다", "挑戰 khiêu chiến", "thử thách, dấn thân"], [24, "근로자", "勤勞者 cần lao giả", "người lao động"], [25, "임금", "賃金 nhẫm kim", "tiền lương, tiền công"]], "AN": {"N1": {"v": "Chủ ngữ: 기업가정신(entrepreneurship)은 · Vị ngữ chính: 자세나 정신을 일컫는다 → câu định nghĩa: 'A là…'.", "cut": "2 khúc: ① 기업가정신은 (tinh thần doanh nhân là) ② 기업의 본질인 이윤을 추구하고 사회적 책임을 수행하기 위해 기업가가 갖춰야 할 자세나 정신을 일컫는다 (thái độ, tinh thần doanh nhân cần có để theo đuổi lợi nhuận và thực hiện trách nhiệm xã hội).", "mod": "기업의 본질인 → 이윤 ('lợi nhuận – bản chất của doanh nghiệp', dịch như chú thích) · (…수행하기 위해) 기업가가 갖춰야 할 → 자세나 정신: 'thái độ, tinh thần' trước, 'mà người làm kinh doanh cần có để…' sau.", "words": "이윤 利潤 lợi nhuận · 본질 本質 bản chất · 일컫다 = gọi là, chỉ (đoán từ câu định nghĩa)"}, "N2": {"v": "Chủ ngữ: 창의적 아이디어, … 통찰력 등은 (chuỗi liệt kê dài) · Vị ngữ chính: 핵심 요소들이다 → 'là những yếu tố cốt lõi'.", "cut": "2 khúc: ① 창의적 아이디어, 위기를 극복하는 불굴의 정신, … 미래를 예측하는 통찰력 등은 (ý tưởng sáng tạo, tinh thần bất khuất…, tầm nhìn dự đoán tương lai) ② 기업가정신을 이루는 핵심 요소들이다 (là những yếu tố cốt lõi tạo nên tinh thần doanh nhân). Khúc ① tách từng mục theo dấu phẩy.", "mod": "위기를 극복하는 → 불굴의 정신 ('tinh thần bất khuất vượt qua khủng hoảng') · 미래를 예측하는 → 통찰력 ('tầm nhìn dự đoán tương lai') · 기업가정신을 이루는 → 핵심 요소들 ('yếu tố cốt lõi tạo nên tinh thần doanh nhân').", "words": "불굴 不屈 bất khuất · 개척 開拓 khai thác = khai phá · 통찰력 洞察力 động sát lực = khả năng thấu suốt, tầm nhìn"}, "N3": {"v": "Chủ ngữ: 조지프 슘페터(1883~1951)는 · Vị ngữ chính: 대표적 인물이다 → 'là nhân vật tiêu biểu'.", "cut": "1 khúc: 미국의 경제학자 조지프 슘페터는 (nhà kinh tế học Mỹ J. Schumpeter) + 기업가정신을 주창한 대표적 인물이다.", "mod": "기업가정신을 주창한 → 대표적 인물: 'nhân vật tiêu biểu' trước, 'đã khởi xướng tinh thần doanh nhân' sau.", "words": "주창 主唱 chủ xướng = khởi xướng · 대표적 代表的 đại biểu đích = tiêu biểu"}, "N4": {"v": "Chủ ngữ: 그는 (ông) · Vị ngữ: 기술혁신으로 규정하고, 혁신가로 규정했다 → 2 lần 'định nghĩa A là B'.", "cut": "2 khúc tại ‐고: ① 그는 새로운 생산 방법과 상품 개발을 기술혁신으로 규정하고 (ông định nghĩa PP sản xuất mới và phát triển SP mới là đổi mới công nghệ) ② 이러한 기술혁신을 통해 '창조적 파괴'를 선도하는 기업가를 혁신가로 규정했다 (và coi doanh nhân dẫn đầu 'phá hủy sáng tạo' là nhà đổi mới).", "mod": "이러한 기술혁신을 통해 '창조적 파괴'를 선도하는 → 기업가: 'những doanh nhân' trước, 'dẫn đầu sự phá hủy sáng tạo thông qua đổi mới công nghệ ấy' sau.", "words": "규정 規定 quy định = định nghĩa, xác định · 선도 先導 tiên đạo = dẫn đầu · 혁신 革新 cách tân = đổi mới"}, "N5": {"v": "Chủ ngữ lớn: 대한민국이 … 부상한 것도 (việc Hàn Quốc vươn lên cũng) · Vị ngữ chính: 바탕엔 기업가정신이 깔려 있다 → 'có nền tảng là tinh thần doanh nhân'.", "cut": "3 khúc: ① 대한민국이 일제의 억압과 6·25전쟁이라는 역사의 아픔을 딛고 (Hàn Quốc vượt qua nỗi đau lịch sử…) ② 불과 반세기 만에 세계 10대 경제대국으로 부상한 것도 (việc chỉ nửa thế kỷ vươn lên top 10 nền kinh tế lớn cũng) ③ 그 바탕엔 기업가정신이 깔려 있다 (có nền tảng là tinh thần doanh nhân).", "mod": "일제의 억압과 6·25전쟁이라는 → 역사의 아픔 ('nỗi đau lịch sử là ách áp bức… và Chiến tranh Triều Tiên') · 대한민국이 … 부상한 → 것 ('việc Hàn Quốc… vươn lên…' – dịch 'việc' trước).", "words": "억압 抑壓 ức áp = áp bức · 부상 浮上 phù thượng = nổi lên, vươn lên · 반세기 半世紀 bán thế kỷ = nửa thế kỷ"}, "N6": {"v": "Chủ ngữ: 정주영 회장의 \"이봐, 해봤어?\"는 · Vị ngữ chính: 한마디로 압축한다 → 'cô đọng trong một câu'.", "cut": "2 khúc: ① 현대그룹의 창업자 고(故) 정주영 회장의 \"이봐, 해봤어?\"는 (câu 'Này, đã thử làm chưa?' của cố chủ tịch Chung Ju-yung, người sáng lập Hyundai) ② 도전과 혁신이라는 기업가정신을 한마디로 압축한다 (cô đọng trong một câu tinh thần doanh nhân dám dấn thân và đổi mới).", "mod": "도전과 혁신이라는 → 기업가정신: 'tinh thần doanh nhân' trước, 'dám dấn thân và đổi mới' sau · 현대그룹의 창업자 → 정주영 회장: dịch như đồng vị ngữ 'cố chủ tịch…, người sáng lập Hyundai'.", "words": "압축 壓縮 áp súc = nén, cô đọng · 창업자 創業者 sáng nghiệp giả = người sáng lập · 고(故) 故 cố = người đã mất"}, "N7": {"v": "Chủ ngữ: 우려가 · Vị ngữ chính: 커지고 있다 → 'ngày càng có nhiều lo ngại'.", "cut": "2 khúc: ① 경제발전의 원동력인 우리나라 기업가정신이 위축되고 있다는 (rằng tinh thần doanh nhân HQ – động lực phát triển – đang bị thui chột) ② 우려가 커지고 있다 (lo ngại ngày càng lớn). Dịch ② trước rồi ①.", "mod": "경제발전의 원동력인 → 우리나라 기업가정신 ('tinh thần doanh nhân của HQ – động lực của phát triển kinh tế') · …위축되고 있다는 → 우려 ('lo ngại rằng…').", "words": "원동력 原動力 nguyên động lực = động lực · 위축 萎縮 ủy súc = co lại, thui chột · 우려 憂慮 ưu lự = lo ngại"}, "N8": {"v": "Chủ ngữ: 응답자의 81.9%(167명)가 · Vị ngữ chính: \"…위축됐다\"고 답했다 → 'cho biết rằng…'.", "cut": "2 khúc: ① 한국경제신문이 최근 대한상공회의소와 공동으로 기업 최고경영자(CEO) 204명으로 대상으로 한 설문조사에서 (trong cuộc khảo sát báo Hankyung phối hợp với KCCI thực hiện với 204 CEO) ② 응답자의 81.9%(167명)가 \"한국의 기업가정신이 위축됐다\"고 답했다 (81,9% người trả lời cho biết '…đã bị thui chột').", "mod": "한국경제신문이 최근 대한상공회의소와 공동으로 기업 최고경영자(CEO) 204명으로 대상으로 한 → 설문조사: 'cuộc khảo sát' trước, 'mà báo Hankyung gần đây phối hợp với… thực hiện với 204 CEO' sau.", "words": "설문조사 設問調査 thiết vấn điều tra = khảo sát · 응답자 應答者 ứng đáp giả = người trả lời · 상공회의소 商工會議所 thương công hội nghị sở = phòng thương mại và công nghiệp"}, "N9": {"v": "Chủ ngữ: 불편한 시선, 지나친 규제가 · Vị ngữ chính: 대표적 이유로 지적된다 → 'được chỉ ra là nguyên nhân tiêu biểu' (bị động).", "cut": "2 khúc: ① 대기업의 성공을 보는 불편한 시선, 지나친 규제가 (cái nhìn thiếu thiện cảm trước thành công của tập đoàn lớn và quy định quá mức) ② 대표적 이유로 지적된다 (được chỉ ra là nguyên nhân tiêu biểu).", "mod": "대기업의 성공을 보는 불편한 → 시선: 'cái nhìn thiếu thiện cảm' trước, 'trước thành công của các tập đoàn lớn' sau · 지나친 → 규제 ('quy định quá mức').", "words": "규제 規制 quy chế = quy định, kiểm soát · 지적 指摘 chỉ trích = chỉ ra · 시선 視線 thị tuyến = ánh nhìn"}}}, "4": {"t": "기업의 나눔 경영", "p": "62–63", "A": [["Đoạn 1 · Triết lý nhân văn và cộng sinh của POSCO"], ["A1", "포스코(POSCO)는 국가경제 발전에 <b>기여한다<sup>3</sup></b>는 본연의 역할에서 한 걸음 더 나아가 인간존중과 <b>상생<sup>4</sup></b>의 철학을 바탕으로 지역사회와 더불어 성장하고 발전하기 위한 다양한 <b>나눔<sup>1</sup></b> <b>경영<sup>2</sup></b> 활동을 <b>펼치고<sup>5</sup></b> 있다.", "기여하다 = đóng góp · 상생 = cùng tồn tại, cùng phát triển · 나눔 = sự sẻ chia · 경영 = kinh doanh, quản trị · 펼치다 = triển khai · 본연의 역할 = vai trò vốn có · 한 걸음 더 나아가 = tiến thêm một bước · N을/를 바탕으로 = dựa trên N · N와/과 더불어 = cùng với N", "Không dừng lại ở vai trò vốn có là đóng góp cho sự phát triển kinh tế quốc gia, POSCO còn tiến thêm một bước: dựa trên triết lý tôn trọng con người và cùng phát triển, tập đoàn đang triển khai nhiều hoạt động kinh doanh sẻ chia đa dạng nhằm lớn mạnh và phát triển cùng cộng đồng địa phương."], ["Đoạn 2 · Hoạt động tình nguyện tự nguyện của nhân viên"], ["A2", "포스코의 나눔 경영 활동에서 가장 <b>두드러진<sup>6</sup></b> 것은 임직원들의 <b>자발적<sup>7</sup></b>인 <b>봉사<sup>8</sup></b> 활동이다.", "두드러지다 = nổi bật · 자발적 = tự nguyện, tự phát · 봉사 = phục vụ, tình nguyện · 임직원 = ban lãnh đạo và nhân viên", "Điều nổi bật nhất trong các hoạt động kinh doanh sẻ chia của POSCO là hoạt động tình nguyện tự giác của toàn thể cán bộ, nhân viên."], ["A3", "이들의 봉사활동 참여율은 92%로, 지난해에만 57여 만 시간을 사회봉사활동에 참여했다.", "참여율 = tỉ lệ tham gia · N(으)로 = (là) N, và… · 지난해에만 = chỉ riêng năm ngoái · ‐여 = hơn (số lượng)", "Tỉ lệ tham gia tình nguyện của họ lên tới 92%; chỉ riêng năm ngoái, họ đã tham gia hơn 570.000 giờ hoạt động phục vụ xã hội."], ["A4", "이는 직원 한 사람당 연간 24시간, 매월 2시간 이상을 봉사활동에 참여했음을 의미한다.", "‐당 = mỗi, tính trên · 연간 = hằng năm · ‐았/었음을 의미하다 = có nghĩa là đã…", "Điều này có nghĩa là mỗi nhân viên đã tham gia tình nguyện 24 giờ mỗi năm, tức hơn 2 giờ mỗi tháng."], ["A5", "전국경제인연합회 회원사들의 연간 봉사활동 참여 시간이 7시간임을 <b>감안하면<sup>9</sup></b> 포스코 임직원의 봉사활동은 국내 최고 수준인 셈이다.", "감안하다 = tính đến, xét đến · 전국경제인연합회 = Liên đoàn các doanh nghiệp Hàn Quốc (FKI) · 회원사 = công ty thành viên · ‐(으)ㄴ 셈이다 = coi như là, xem như", "Nếu xét đến việc thời gian tình nguyện hằng năm của các công ty thành viên Liên đoàn các doanh nghiệp Hàn Quốc chỉ là 7 giờ, thì có thể xem hoạt động tình nguyện của nhân viên POSCO thuộc hàng cao nhất cả nước."], ["Đoạn 3 · ‘Thứ Bảy sẻ chia’ và các chương trình tình nguyện"], ["A6", "특히 매월 셋째 주 토요일을 ‘나눔의 토요일’로 정해 대대적인 봉사활동을 <b>전개하고<sup>10</sup></b> 있다.", "전개하다 = triển khai, tiến hành · N을/를 N(으)로 정하다 = chọn N làm N · 대대적 = quy mô lớn · 셋째 주 = tuần thứ ba", "Đặc biệt, POSCO chọn thứ Bảy của tuần thứ ba hằng tháng làm ‘Thứ Bảy sẻ chia’ và tổ chức các hoạt động tình nguyện quy mô lớn."], ["A7", "서울과 포항·광양 지역별로 나눠 회사 전체 차원에서 지역 사회를 위한 ‘환경정화 활동’을 비롯해 ‘사랑의 <b>헌혈<sup>11</sup></b> 릴레이(relay)’, ‘사랑의 집 고쳐주기’, ‘목욕 봉사’ 등의 봉사활동을 펼치고 있다.", "헌혈 = hiến máu · 지역별로 나누다 = chia theo khu vực · 차원에서 = ở cấp độ · 환경정화 = làm sạch môi trường · N을/를 비롯해 = tiêu biểu là N, bao gồm N · 고쳐주다 = sửa giúp · 목욕 봉사 = tình nguyện tắm giúp", "Chia theo từng khu vực Seoul, Pohang và Gwangyang, ở cấp độ toàn công ty, POSCO triển khai nhiều hoạt động tình nguyện vì cộng đồng địa phương, tiêu biểu như ‘làm sạch môi trường’, ‘tiếp sức hiến máu nhân ái’, ‘sửa nhà tình thương’ và ‘tắm giúp người khó khăn’."], ["A8", "또 포항 1곳과 광양 2곳에서 무료 급식소인 ‘포스코 나눔의 집’도 <b>운영하고<sup>12</sup></b> 있다.", "운영하다 = vận hành, điều hành · 무료 급식소 = bếp ăn miễn phí · ‐곳 = (đơn vị đếm) nơi, địa điểm", "Ngoài ra, POSCO còn vận hành ‘Ngôi nhà sẻ chia POSCO’ – bếp ăn miễn phí – tại một điểm ở Pohang và hai điểm ở Gwangyang."], ["Đoạn 4 · Tạo việc làm cho người khuyết tật"], ["A9", "지난해 1월에는 장애인들의 일자리 <b>창출<sup>13</sup></b>을 위해 국내 최초의 자회사형 표준사업장인 ‘포스위드(poswith)’를 <b>출범시켜<sup>14</sup></b> <b>주목을 받았다<sup>15</sup></b>.", "창출 = sáng tạo ra, tạo ra · 출범시키다 = khai trương, cho ra đời · 주목받다 = được chú ý · 장애인 = người khuyết tật · 일자리 = việc làm · 자회사형 표준사업장 = cơ sở kinh doanh tiêu chuẩn dạng công ty con · N을/를 위해 = vì, để N", "Tháng 1 năm ngoái, POSCO đã gây chú ý khi cho ra đời ‘Poswith’ – cơ sở kinh doanh tiêu chuẩn dạng công ty con đầu tiên trong nước – nhằm tạo việc làm cho người khuyết tật."], ["A10", "포스코의 사무 및 통신지원·세탁서비스 업무 등을 <b>담당하는<sup>16</sup></b> 이 회사에서는 현재 서울과 포항, 광양 3개 사업장에서 전체 직원의 40%인 89명의 장애인이 <b>근무하고<sup>17</sup></b> 있다.", "담당하다 = đảm nhận, phụ trách · 근무하다 = làm việc · 사무 = văn phòng · 통신지원 = hỗ trợ viễn thông · 세탁 = giặt ủi · 사업장 = cơ sở, nơi làm việc", "Hiện nay tại công ty này – đơn vị đảm nhận các công việc văn phòng, hỗ trợ viễn thông và dịch vụ giặt ủi cho POSCO – có 89 người khuyết tật, chiếm 40% tổng số nhân viên, đang làm việc tại ba cơ sở ở Seoul, Pohang và Gwangyang."], ["Đoạn 5 · Hoạt động sẻ chia ở nước ngoài"], ["A11", "포스코의 나눔 경영은 해외에서도 활발하다.", "활발하다 = sôi nổi, tích cực · 해외 = nước ngoài", "Hoạt động kinh doanh sẻ chia của POSCO cũng rất sôi nổi ở nước ngoài."], ["A12", "지난해 5월 발생한 대지진으로 엄청난 피해를 입은 중국 쓰촨성(Sichuan, 四川省)에 중국 <b>현지법인<sup>18</sup></b>과 임직원들이 <b>성금<sup>19</sup></b> 300만 위안(Renminbi, 人民幣)을 전달하고 고아원 설립, 학교 재건립 등 복구 사업을 <b>지원했으며<sup>20</sup></b>, 동남아 지역 안면기형 아동 무료 수술, 베트남(Vietnam) 초등학교 <b>건립<sup>21</sup></b> 지원, 인도 오리사주(India’s Orissa State) 수해지역 긴급 <b>구호<sup>22</sup></b> 활동, 방글라데시(Bangladesh) 컴퓨터센터 건립 등을 진행해 현지의 <b>호평<sup>23</sup></b>을 받았다.", "현지법인 = pháp nhân địa phương · 성금 = tiền quyên góp · 지원하다 = hỗ trợ · 건립 = xây dựng · 구호 = cứu trợ · 호평 = đánh giá tốt · 피해를 입다 = chịu thiệt hại · 복구 = khôi phục · 안면기형 = dị tật vùng mặt · 수해 = lũ lụt · ‐(으)며 = và · 호평을 받다 = được khen ngợi", "Tại tỉnh Tứ Xuyên, Trung Quốc – nơi chịu thiệt hại nặng nề do trận động đất lớn xảy ra vào tháng 5 năm ngoái – pháp nhân của POSCO tại Trung Quốc cùng toàn thể cán bộ nhân viên đã trao 3 triệu nhân dân tệ tiền quyên góp và hỗ trợ các dự án tái thiết như xây trại trẻ mồ côi, xây lại trường học. Bên cạnh đó, POSCO còn phẫu thuật miễn phí cho trẻ em bị dị tật vùng mặt ở khu vực Đông Nam Á, hỗ trợ xây trường tiểu học ở Việt Nam, cứu trợ khẩn cấp vùng lũ lụt ở bang Orissa (Ấn Độ), xây trung tâm máy tính ở Bangladesh, và nhận được sự đánh giá cao của người dân sở tại."], ["Đoạn 6 · Hoạt động Mécénat cho văn hóa nghệ thuật"], ["A13", "문화예술 발전을 위한 메세나(Mecenat) 활동에도 적극적이다.", "메세나 = Mécénat (bảo trợ văn hóa nghệ thuật) · 적극적 = tích cực", "POSCO cũng rất tích cực trong các hoạt động Mécénat nhằm phát triển văn hóa nghệ thuật."], ["A14", "서울의 ‘포스코센터’에서 매월 열리는 ‘포스코센터음악회’는 1999년 문을 연 이후 클래식(classical music)과 한국 전통음악, 대중 가요 등 다양한 장르(genre)의 공연을 펼쳐 매월 2000명 이상이 몰리는 ‘도심 속 음악회’로 <b>자리매김한<sup>24</sup></b> 지 오래다.", "자리매김하다 = định vị, khẳng định chỗ đứng · 문을 열다 = khai mạc, mở cửa · 대중 가요 = nhạc đại chúng · 몰리다 = đổ dồn, kéo đến · ‐(으)ㄴ 지 오래다 = đã từ lâu", "‘Đêm nhạc POSCO Center’ được tổ chức hằng tháng tại tòa nhà POSCO Center ở Seoul, kể từ khi ra mắt năm 1999 đã mang đến những buổi biểu diễn thuộc nhiều thể loại như nhạc cổ điển, âm nhạc truyền thống Hàn Quốc và nhạc đại chúng, và từ lâu đã khẳng định vị thế là ‘buổi hòa nhạc giữa lòng phố thị’ thu hút hơn 2.000 khán giả mỗi tháng."], ["A15", "2004년부터는 전국의 주요대학에서 ‘포스코 캠퍼스 심포니 페스티벌(POSCO Campus Symphony Festival)’을 <b>개최해<sup>25</sup></b> 젊은이들과 지역 주민들의 문화적 욕구를 충족시켜 주고 있다.", "개최하다 = tổ chức · 주요대학 = các trường đại học lớn · 욕구 = nhu cầu · 충족시키다 = đáp ứng, thỏa mãn", "Từ năm 2004, POSCO còn tổ chức ‘Lễ hội giao hưởng học đường POSCO’ tại các trường đại học lớn trên cả nước, đáp ứng nhu cầu văn hóa của giới trẻ và người dân địa phương."]], "B": [["Bài báo 1 · ‘포스코의 사회공헌’ 문화가 되다", "<a href=\"https://magazine.hankyung.com/business/article/201612264151b\" target=\"_blank\" rel=\"noopener\">한경비즈니스, 2016.12.26</a>"], ["N1", "‘1인당 28시간.’", "‐당 = mỗi, tính trên · 1인 = một người", "‘28 giờ mỗi người.’"], ["N2", "포스코 임직원이 지난해 참여한 평균 <b>봉사</b> 시간이다.", "임직원 = cán bộ nhân viên · 참여하다 = tham gia · 평균 = trung bình · 봉사 = tình nguyện", "Đó là số giờ tình nguyện trung bình mà mỗi cán bộ nhân viên POSCO đã tham gia trong năm ngoái."], ["N3", "1988년 지역사회와 함께 성장하기 위해 시작한 포스코의 사회 공헌 활동은 2003년 ‘포스코봉사단’을 공식 창단하면서 더욱 발전했고 이제는 포스코를 대표하는 기업 문화로 자리 잡았다.", "사회 공헌 = đóng góp xã hội · 공식 = chính thức · 창단하다 = thành lập (đoàn, đội) · ‐(으)면서 = cùng với việc · 대표하다 = tiêu biểu, đại diện · 자리 잡다 = bén rễ, trở thành", "Hoạt động đóng góp xã hội của POSCO, khởi đầu từ năm 1988 với mong muốn cùng lớn mạnh với cộng đồng địa phương, đã phát triển mạnh hơn khi ‘Đoàn tình nguyện POSCO’ chính thức được thành lập năm 2003, và nay đã trở thành nét văn hóa doanh nghiệp tiêu biểu của POSCO."], ["N4", "매월 ‘나눔의 토요일’을 정해 복지시설 등에서 봉사 활동을 벌이고 있고 경제 활성화와 사회복지를 위해 사회적 기업을 <b>운영</b>·<b>지원</b>하고 있다.", "나눔 = sẻ chia · 복지시설 = cơ sở phúc lợi · 벌이다 = tiến hành · 활성화 = kích hoạt, làm sôi động · 사회적 기업 = doanh nghiệp xã hội · 운영 = vận hành · 지원 = hỗ trợ", "POSCO chọn ra ‘Thứ Bảy sẻ chia’ mỗi tháng để tiến hành hoạt động tình nguyện tại các cơ sở phúc lợi, đồng thời vận hành và hỗ trợ các doanh nghiệp xã hội nhằm thúc đẩy kinh tế và phúc lợi xã hội."], ["N5", "또한 국내를 넘어 인도네시아·베트남 등 포스코가 진출했거나 진출 예정인 해외 저개발국의 자립 지원에도 앞장서고 있다.", "N을/를 넘어 = vượt ra ngoài N · 진출하다 = thâm nhập, mở rộng sang · 예정 = dự kiến · 저개발국 = nước kém phát triển · 자립 = tự lập · 앞장서다 = đi đầu", "Không chỉ trong nước, POSCO còn đi đầu trong việc hỗ trợ tự lập cho các nước kém phát triển mà POSCO đã hoặc sắp đầu tư vào, như Indonesia và Việt Nam."], ["N6", "특히 최근에는 임직원의 역량과 재능을 활용한 ‘재능기부형’ 봉사를 적극 권장하고 있다.", "역량 = năng lực · 재능 = tài năng · 활용하다 = tận dụng · 재능기부 = quyên góp tài năng · 권장하다 = khuyến khích", "Đặc biệt, gần đây POSCO tích cực khuyến khích hình thức tình nguyện ‘đóng góp tài năng’, tận dụng năng lực và tài năng của cán bộ nhân viên."], ["N7", "임직원이 사회봉사는 물론 삶의 보람을 찾고 자기 계발도 할 수 있도록 지원할 방침이다.", "N은/는 물론 = không chỉ N mà cả · 보람 = ý nghĩa, niềm vui · 자기 계발 = phát triển bản thân · ‐(으)ㄹ 수 있도록 = để có thể · 방침 = phương châm, chủ trương", "Công ty có chủ trương hỗ trợ để cán bộ nhân viên không chỉ phục vụ xã hội mà còn tìm thấy ý nghĩa cuộc sống và phát triển bản thân."], ["N8", "이를 위해 포항·광양·서울·인천 송도 등에서 24개 재능봉사단을 운영 중이다.", "이를 위해 = để làm điều đó · 봉사단 = đoàn tình nguyện · N 중이다 = đang N", "Để làm được điều đó, POSCO đang vận hành 24 đoàn tình nguyện tài năng tại Pohang, Gwangyang, Seoul, Songdo (Incheon)…"]], "V": [[1, "나눔", "—", "sự sẻ chia, chia sẻ"], [2, "경영", "經營 kinh doanh (kinh dinh)", "kinh doanh, quản trị doanh nghiệp"], [3, "기여하다", "寄與 ký dữ", "đóng góp, cống hiến"], [4, "상생", "相生 tương sinh", "cùng tồn tại, cùng phát triển"], [5, "펼치다", "—", "triển khai, mở rộng (hoạt động)"], [6, "두드러지다", "—", "nổi bật, dễ thấy"], [7, "자발적", "自發的 tự phát đích", "tự nguyện, tự giác"], [8, "봉사", "奉仕 phụng sĩ", "phục vụ, tình nguyện"], [9, "감안하다", "勘案 khám án", "xét đến, tính đến"], [10, "전개하다", "展開 triển khai", "triển khai, tiến hành"], [11, "헌혈", "獻血 hiến huyết", "hiến máu"], [12, "운영하다", "運營 vận doanh", "vận hành, điều hành"], [13, "창출", "創出 sáng xuất", "tạo ra, sáng tạo ra"], [14, "출범시키다", "出帆 xuất phàm", "khai trương, cho ra đời"], [15, "주목받다", "注目 chú mục", "được chú ý, được chú mục"], [16, "담당하다", "擔當 đảm đương", "đảm nhận, phụ trách"], [17, "근무하다", "勤務 cần vụ", "làm việc (tại cơ quan)"], [18, "현지법인", "現地法人 hiện địa pháp nhân", "pháp nhân địa phương (công ty con ở nước sở tại)"], [19, "성금", "誠金 thành kim", "tiền quyên góp, tiền ủng hộ"], [20, "지원하다", "支援 chi viện", "hỗ trợ, viện trợ"], [21, "건립", "建立 kiến lập", "xây dựng, thành lập"], [22, "구호", "救護 cứu hộ", "cứu trợ, cứu hộ"], [23, "호평", "好評 hảo bình", "đánh giá tốt, lời khen"], [24, "자리매김하다", "—", "định vị, khẳng định chỗ đứng"], [25, "개최하다", "開催 khai thôi", "tổ chức (sự kiện)"]], "AN": {"N1": {"v": "Câu không có động từ (kiểu tiêu đề): chỉ có cụm danh từ 28시간 → dịch gọn như một dòng tít: '28 giờ mỗi người.'", "cut": "1 khúc: ① 1인당 28시간 (28 giờ mỗi người). Đảo 1인당 ra sau: '28 giờ / mỗi người'.", "mod": "Không có định ngữ dài.", "words": "‐당 (當 đương) = mỗi, tính trên: 1인당 = mỗi người, 1시간당 = mỗi giờ"}, "N2": {"v": "Chủ ngữ ẩn: (그것은 = con số 28 giờ ở câu trước) · Vị ngữ chính: 평균 봉사 시간이다 → 'Đó là số giờ tình nguyện trung bình…'.", "cut": "1 khúc dài, xoay quanh danh từ 시간: ① 포스코 임직원이 지난해 참여한 (mà nhân viên POSCO đã tham gia năm ngoái) + 평균 봉사 시간이다 (là số giờ tình nguyện trung bình).", "mod": "Định ngữ: 포스코 임직원이 지난해 참여한 → danh từ trung tâm: 평균 봉사 시간. Dịch: 'số giờ tình nguyện trung bình' trước, rồi 'mà cán bộ nhân viên POSCO đã tham gia năm ngoái'.", "words": "임직원 (任職員 nhiệm chức viên) = lãnh đạo + nhân viên → cán bộ nhân viên · 봉사 (奉仕 phụng sĩ) = phục vụ không công → tình nguyện"}, "N3": {"v": "Chủ ngữ: 포스코의 사회 공헌 활동은 · Vị ngữ: 더욱 발전했고 + 기업 문화로 자리 잡았다 → 1 chủ ngữ, 2 vị ngữ nối tiếp: 'đã phát triển…, và nay đã trở thành…'.", "cut": "3 khúc: ① 1988년 … 시작한 포스코의 사회 공헌 활동은 (hoạt động đóng góp xã hội của POSCO, khởi đầu năm 1988…) ② 2003년 ‘포스코봉사단’을 공식 창단하면서 더욱 발전했고 (phát triển mạnh hơn khi chính thức thành lập Đoàn tình nguyện năm 2003) ③ 이제는 포스코를 대표하는 기업 문화로 자리 잡았다 (nay đã trở thành văn hóa doanh nghiệp tiêu biểu). Cắt ở ‐고.", "mod": "① 1988년 지역사회와 함께 성장하기 위해 시작한 → 포스코의 사회 공헌 활동: dịch 'hoạt động đóng góp xã hội của POSCO' trước, 'khởi đầu từ năm 1988 với mong muốn cùng lớn mạnh với cộng đồng' sau. ② 포스코를 대표하는 → 기업 문화: 'văn hóa doanh nghiệp tiêu biểu của POSCO'.", "words": "공헌 (貢獻 cống hiến) = đóng góp · 창단 (創團 sáng đoàn) = thành lập đoàn/đội · 자리 잡다 = 'chiếm được chỗ' → bén rễ, trở thành"}, "N4": {"v": "Chủ ngữ ẩn: (포스코는) – lấy từ câu trước, khi dịch nên thêm 'POSCO'. · Vị ngữ: 봉사 활동을 벌이고 있고 + 사회적 기업을 운영·지원하고 있다 → 2 việc POSCO đang làm song song ('…, đồng thời…').", "cut": "2 khúc, cắt ở ‐고: ① 매월 ‘나눔의 토요일’을 정해 복지시설 등에서 봉사 활동을 벌이고 있고 (chọn 'Thứ Bảy sẻ chia' mỗi tháng để làm tình nguyện ở cơ sở phúc lợi) ② 경제 활성화와 사회복지를 위해 사회적 기업을 운영·지원하고 있다 (vận hành và hỗ trợ doanh nghiệp xã hội nhằm thúc đẩy kinh tế, phúc lợi).", "mod": "Không có định ngữ dài.", "words": "복지 (福祉 phúc chỉ) = phúc lợi · 활성화 (活性化 hoạt tính hóa) = làm cho sôi động → thúc đẩy · 운영 (運營 vận doanh) = vận hành, điều hành"}, "N5": {"v": "Chủ ngữ ẩn: (포스코는) · Vị ngữ chính: 자립 지원에도 앞장서고 있다 → 'POSCO còn đi đầu trong việc hỗ trợ tự lập…'. 국내를 넘어 + ‐에도 = 'không chỉ trong nước mà còn…'.", "cut": "2 khúc: ① 또한 국내를 넘어 (không chỉ trong nước) ② 인도네시아·베트남 등 포스코가 진출했거나 진출 예정인 해외 저개발국의 자립 지원에도 앞장서고 있다 (còn đi đầu hỗ trợ tự lập cho các nước kém phát triển mà POSCO đã/sắp đầu tư, như Indonesia, Việt Nam).", "mod": "Định ngữ: 인도네시아·베트남 등 포스코가 진출했거나 진출 예정인 → danh từ: 해외 저개발국. Dịch: 'các nước kém phát triển' trước, rồi 'mà POSCO đã hoặc sắp đầu tư vào', cuối cùng 'như Indonesia và Việt Nam'.", "words": "진출 (進出 tiến xuất) = tiến ra, mở rộng sang (thị trường) · 저개발국 (低開發國 đê khai phát quốc) = nước kém phát triển · 자립 (自立 tự lập)"}, "N6": {"v": "Chủ ngữ ẩn: (포스코는) · Vị ngữ chính: 적극 권장하고 있다 → 'POSCO tích cực khuyến khích…'. Tân ngữ: ‘재능기부형’ 봉사를.", "cut": "2 khúc: ① 특히 최근에는 (đặc biệt, gần đây) ② 임직원의 역량과 재능을 활용한 ‘재능기부형’ 봉사를 적극 권장하고 있다 (tích cực khuyến khích hình thức tình nguyện 'đóng góp tài năng' tận dụng năng lực nhân viên).", "mod": "Định ngữ: 임직원의 역량과 재능을 활용한 → danh từ: ‘재능기부형’ 봉사. Dịch: 'hình thức tình nguyện đóng góp tài năng' trước, 'tận dụng năng lực và tài năng của cán bộ nhân viên' sau.", "words": "역량 (力量 lực lượng) = năng lực, sức làm việc · 기부 (寄附 ký phụ) = quyên góp · 권장 (勸奬 khuyến tưởng) = khuyến khích"}, "N7": {"v": "Chủ ngữ ẩn: (회사/포스코는) · Vị ngữ chính: 지원할 방침이다 → 'Công ty có chủ trương hỗ trợ…'. Bên trong mệnh đề mục đích, chủ ngữ là 임직원이.", "cut": "2 khúc, cắt ở ‐(으)ㄹ 수 있도록: ① 임직원이 사회봉사는 물론 삶의 보람을 찾고 자기 계발도 할 수 있도록 (để nhân viên không chỉ phục vụ xã hội mà còn tìm thấy ý nghĩa cuộc sống và phát triển bản thân) ② 지원할 방침이다 (có chủ trương hỗ trợ). Dịch ② trước rồi mới ①.", "mod": "‐(으)ㄹ 방침: 지원할 → 방침 = 'chủ trương hỗ trợ' (định ngữ ngắn, dịch danh từ trước). Mệnh đề ‐도록 dài đặt sau: 'hỗ trợ để…'.", "words": "방침 (方針 phương châm) = chủ trương, đường lối · 계발 (啓發 khải phát) = khai phá, phát triển (bản thân) · 보람 = cảm giác việc mình làm có ý nghĩa"}, "N8": {"v": "Chủ ngữ ẩn: (포스코는) · Vị ngữ chính: 운영 중이다 → 'POSCO đang vận hành…'. Tân ngữ: 24개 재능봉사단을.", "cut": "3 khúc: ① 이를 위해 (để làm được điều đó) ② 포항·광양·서울·인천 송도 등에서 (tại Pohang, Gwangyang, Seoul, Songdo…) ③ 24개 재능봉사단을 운영 중이다 (đang vận hành 24 đoàn tình nguyện tài năng). Tiếng Việt đưa ③ lên trước ②.", "mod": "Không có định ngữ dài.", "words": "이를 위해 = 이것을 위해 → để làm điều đó (이 = điều vừa nói ở câu trước) · N 중이다 (中 trung) = đang N"}}}, "5": {"t": "화폐의 진화", "p": "84–85", "A": [["Đoạn 1 · Từ tự cung tự cấp đến hàng hóa làm tiền"], ["A1", "<b>화폐<sup>1</sup></b>, 즉 돈의 발달은 매우 긴 역사를 가지고 있다.", "화폐 = tiền tệ · 즉 = tức là · 발달 = sự phát triển · 역사를 가지다 = có lịch sử", "Tiền tệ, tức là tiền, đã có một lịch sử phát triển rất lâu dài."], ["A2", "<b>생산력<sup>3</sup></b>이 발달하지 않은 <b>원시사회<sup>4</sup></b>에서는 스스로 생산한 것으로 생활하는 <b>자급자족<sup>5</sup></b>이 일반적이었다.", "생산력 = sức sản xuất · 원시사회 = xã hội nguyên thủy · 자급자족 = tự cung tự cấp · 스스로 = tự mình · N(으)로 생활하다 = sống bằng N · 일반적이다 = phổ biến", "Trong xã hội ngu
