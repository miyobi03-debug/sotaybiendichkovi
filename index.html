yên thủy, khi sức sản xuất còn chưa phát triển, phổ biến là lối sống tự cung tự cấp – con người sống bằng chính những gì mình làm ra."], ["A3", "그러나 생산력이 발달함에 따라서 소비하고 남는 물건과 생활에 필요한 물품을 다른 사람과 교환할 필요성이 생겼다.", "‐(으)ㅁ에 따라(서) = cùng với việc, khi… thì · 남다 = dư ra · 물품 = đồ dùng · 교환하다 = trao đổi · 필요성이 생기다 = nảy sinh nhu cầu", "Nhưng khi sức sản xuất phát triển, nảy sinh nhu cầu đem những thứ dùng không hết đổi với người khác lấy những đồ dùng cần cho cuộc sống."], ["A4", "<b>물물교환<sup>6</sup></b>이 더욱 늘어남에 따라 교환의 매개물이 필요하게 되었다.", "물물교환 = hàng đổi hàng · 늘어나다 = tăng lên · ‐(으)ㅁ에 따라 = cùng với việc · 매개물 = vật trung gian · ‐게 되다 = trở nên", "Khi việc hàng đổi hàng ngày càng nhiều lên, người ta bắt đầu cần đến một vật trung gian để trao đổi."], ["A5", "교환의 <b>매개물<sup>7</sup></b>로 사용되었던 것들은 조개 껍질, 베, 소금, 가축, 모피, 말린 생선 등이었다.", "매개물 = vật trung gian · ‐었던 = đã từng (hồi tưởng) · 조개 껍질 = vỏ sò · 베 = vải gai · 가축 = gia súc · 모피 = da lông thú · 말리다 = phơi khô", "Những thứ từng được dùng làm vật trung gian trao đổi là vỏ sò, vải gai, muối, gia súc, da lông thú, cá khô, v.v."], ["A6", "위와 같이 교환의 매개물로 사용된 물건을 상품화폐 또는 물품화폐라고 부른다.", "N와/과 같이 = như N · N(이)라고 부르다 = gọi là N · 상품화폐/물품화폐 = tiền hàng hóa", "Những vật được dùng làm trung gian trao đổi như trên được gọi là tiền hàng hóa hay tiền hiện vật."], ["Đoạn 2 · Sự ra đời của tiền kim loại"], ["A7", "그러나 상품화폐의 사용으로 과거의 물물교환보다는 편리해졌지만 <b>보관<sup>8</sup></b>이나 <b>운반<sup>9</sup></b>에 있어서 여전히 불편함이 많았다.", "보관 = bảo quản, cất giữ · 운반 = vận chuyển · N에 있어서 = về mặt N · 여전히 = vẫn · ‐아/어지다 = trở nên", "Việc dùng tiền hàng hóa tuy đã tiện hơn hàng đổi hàng trước kia, nhưng về mặt cất giữ hay vận chuyển thì vẫn còn nhiều bất tiện."], ["A8", "이 불편함을 없애기 위해서 나온 것이 <b>금속<sup>10</sup></b>화폐였다.", "금속 = kim loại · 없애다 = loại bỏ · ‐기 위해서 = để · 나온 것이 N였다 = thứ ra đời là N", "Thứ ra đời để xóa bỏ sự bất tiện này chính là tiền kim loại."], ["A9", "서양에서 동전이 처음 나온 곳은 지금의 터키(Turkey)에서였다고 한다.", "동전 = đồng xu · 서양 = phương Tây · ‐다고 하다 = nghe nói, người ta nói rằng", "Người ta nói rằng ở phương Tây, đồng xu lần đầu xuất hiện ở vùng đất nay là Thổ Nhĩ Kỳ."], ["Đoạn 3 · Kiểm tra tiền kim loại và nguồn gốc đơn vị tiền"], ["A10", "금속화폐는 주로 금이나 은으로 만들어졌는데, 이런 귀금속은 돈으로 사용되지 않더라도 그 자체로서 가치를 가지고 있었다.", "귀금속 = kim loại quý · ‐더라도 = dù cho · 그 자체로서 = tự bản thân nó · 가치 = giá trị", "Tiền kim loại chủ yếu được làm bằng vàng hoặc bạc; những kim loại quý này dù không dùng làm tiền thì tự bản thân chúng vẫn có giá trị."], ["A11", "그렇지만 눈으로 보는 것만으로는 제대로 된 것인지 알 수 없기 때문에 이로 깨물어서 진짜인지 가짜인지 알아본 후 받는 것이 일반적이었다.", "N만으로는 = chỉ bằng N thì · 제대로 되다 = chuẩn, đúng chất · ‐기 때문에 = vì · 이로 깨물다 = cắn bằng răng · 진짜/가짜 = thật/giả · ‐(으)ㄴ 후 = sau khi", "Nhưng vì chỉ nhìn bằng mắt thì không biết được có phải hàng chuẩn hay không, nên người ta thường cắn thử bằng răng để xem thật hay giả rồi mới nhận."], ["A12", "또 다른 방법은 <b>무게<sup>11</sup></b>를 <b>달아서<sup>12</sup></b> <b>순도<sup>13</sup></b>를 알아보는 것이었다.", "무게 = trọng lượng · 달다 = cân · 순도 = độ tinh khiết · 알아보다 = tìm hiểu, kiểm tra", "Một cách khác là cân trọng lượng để kiểm tra độ tinh khiết."], ["A13", "영국의 파운드(pound)나 독일의 마르크(mark)는 모두 무게를 <b>재는<sup>14</sup></b> <b>단위<sup>15</sup></b>인데, 무게를 달아서 가짜와 진짜를 구별하던 옛날의 관습에서 이 화폐 단위가 <b>유래되었다<sup>16</sup></b>.", "재다 = đo · 단위 = đơn vị · 유래되다 = bắt nguồn · 구별하다 = phân biệt · ‐던 = (thói quen) từng · 관습 = tập quán · ‐는데 = (bối cảnh)", "Đồng bảng (pound) của Anh hay đồng mác (mark) của Đức đều vốn là đơn vị đo trọng lượng; các đơn vị tiền tệ này bắt nguồn từ tập quán ngày xưa cân trọng lượng để phân biệt tiền thật với tiền giả."], ["A14", "그러나 금화나 은화도 역시 보관이나 관리에 불편함이 있었다.", "금화/은화 = tiền vàng/tiền bạc · 역시 = cũng vẫn · 관리 = quản lý", "Tuy nhiên, tiền vàng hay tiền bạc cũng vẫn bất tiện trong việc cất giữ và quản lý."], ["Đoạn 4 · Tiền giấy ra đời từ giấy biên nhận"], ["A15", "최초에 <b>지폐<sup>17</sup></b>가 나오게 된 아이디어(idea)는 매우 간단하다.", "지폐 = tiền giấy · 최초 = đầu tiên · ‐게 되다 = (dẫn đến) được", "Ý tưởng khiến tiền giấy ra đời lần đầu tiên thật ra rất đơn giản."], ["A16", "옛날에 금화나 은화를 가진 사람들은 <b>도난<sup>18</sup></b>이나 <b>분실<sup>19</sup></b>을 염려하여 자주 귀금속 세공업자에게 <b>맡기고<sup>20</sup></b> 영수증을 받았다.", "도난 = mất trộm · 분실 = đánh mất · 맡기다 = gửi, ký gửi · 염려하다 = lo ngại · 세공업자 = thợ kim hoàn · 영수증 = biên nhận", "Ngày xưa, những người có tiền vàng, tiền bạc vì sợ bị trộm hoặc đánh mất nên thường gửi chúng cho thợ kim hoàn và nhận lại giấy biên nhận."], ["A17", "이 영수증이 상품의 <b>거래<sup>21</sup></b>에 이용되고 사람들 사이에 유통되기 시작하였다.", "거래 = giao dịch · 유통되다 = lưu thông · ‐기 시작하다 = bắt đầu", "Những tờ biên nhận này bắt đầu được dùng trong mua bán hàng hóa và lưu thông giữa mọi người."], ["A18", "보관 영수증은 그만한 가치의 귀금속이 있다는 것을 증명하기 때문에 사람들은 이 영수증을 믿고 거래에 사용하였고, 결국 이것이 계기가 되어 지폐가 나오게 되었다.", "증명하다 = chứng minh · 그만한 = tương ứng chừng ấy · ‐다는 것 = việc rằng · 믿다 = tin · 결국 = rốt cuộc · 계기가 되다 = trở thành bước ngoặt, khởi điểm", "Vì giấy biên nhận gửi giữ chứng minh rằng có một lượng kim loại quý trị giá tương ứng, nên người ta tin vào nó và dùng nó để giao dịch; rốt cuộc chính điều này đã trở thành khởi điểm cho sự ra đời của tiền giấy."], ["Đoạn 5 · Ngày nay: séc và thẻ"], ["A19", "그러나 이제는 지폐마저도 불편해 하는 사람들이 많이 있다.", "마저(도) = ngay cả (đến cả) · 불편해 하다 = thấy bất tiện · 이제는 = giờ đây", "Thế nhưng giờ đây, có nhiều người thấy ngay cả tiền giấy cũng bất tiện."], ["A20", "큰 거래에는 많은 양의 지폐를 운반해야 하고, 반대로 버스를 타거나 음료수를 마실 때에는 <b>잔돈<sup>22</sup></b>이 자주 생겨서 불편하다.", "잔돈 = tiền lẻ · 양 = lượng · ‐아/어야 하다 = phải · 반대로 = ngược lại · ‐거나 = hoặc", "Giao dịch lớn thì phải mang theo một lượng lớn tiền giấy, ngược lại khi đi xe buýt hay mua nước uống thì hay phải cầm tiền lẻ thừa ra, rất bất tiện."], ["A21", "따라서 사람들은 은행에 돈을 맡겨 두고 그 대신 <b>수표<sup>23</sup></b>나 <b>신용카드<sup>24</sup></b>, <b>현금카드<sup>25</sup></b> 등을 이용하여 거래하고 있다.", "수표 = séc · 신용카드 = thẻ tín dụng · 현금카드 = thẻ rút tiền mặt · ‐아/어 두다 = (làm) sẵn, để đó · 그 대신 = thay vào đó", "Vì vậy, người ta gửi tiền vào ngân hàng và thay vào đó dùng séc, thẻ tín dụng, thẻ rút tiền mặt… để giao dịch."]], "B": [["Bài báo 1 · 돌·소금·금화에서 전자화폐로…화폐는 변신한다", "<a href=\"https://sgsg.hankyung.com/article/2020112777911\" target=\"_blank\" rel=\"noopener\">생글생글(한국경제), 2020.11.30</a>"], ["N1", "인류가 수렵채집 생활을 했을 때는 거의 모든 것을 자신이 만들어 해결하는 <b>자급자족</b> 형태였다.", "인류 = loài người · 수렵채집 = săn bắt hái lượm · 해결하다 = giải quyết · 자급자족 = tự cung tự cấp · 형태 = hình thái", "Khi loài người còn sống bằng săn bắt hái lượm, họ tự cung tự cấp – gần như mọi thứ đều tự làm ra để dùng."], ["N2", "이후 농사를 짓고 여러 다양한 분업이 발생하면서 필요한 물품을 주고받을 필요가 생겼다.", "농사를 짓다 = làm nông · 분업 = phân công lao động · ‐(으)면서 = cùng với việc · 주고받다 = trao đổi qua lại", "Về sau, khi con người làm nông và xuất hiện nhiều hình thức phân công lao động khác nhau, nảy sinh nhu cầu trao đổi những đồ dùng cần thiết với nhau."], ["N3", "상품과 상품을 맞바꾸는 <b>물물교환</b>이 이뤄졌지만 각자가 원하는 수량이나 가치가 달라 공정하게 교환할 수 있는 매개체가 필요했다.", "맞바꾸다 = đổi ngang · 물물교환 = hàng đổi hàng · 이뤄지다 = được thực hiện · 수량 = số lượng · 공정하다 = công bằng · 매개체 = vật trung gian", "Người ta đã đổi hàng lấy hàng, nhưng vì số lượng và giá trị mỗi bên mong muốn khác nhau nên cần một vật trung gian giúp trao đổi công bằng."], ["N4", "그래서 등장한 것이 ‘<b>화폐</b>’로 기원전(BC) 4000년 즈음부터 사용된 것으로 추정된다.", "등장하다 = xuất hiện · 기원전 = trước Công nguyên · 즈음 = khoảng · ‐(으)ㄴ 것으로 추정되다 = được ước đoán là", "Thứ ra đời từ đó chính là ‘tiền tệ’, được cho là đã được sử dụng từ khoảng năm 4000 trước Công nguyên."], ["N5", "종이로 만들어진 <b>지폐</b>는 중세시대부터 발행됐다.", "지폐 = tiền giấy · 중세시대 = thời Trung cổ · 발행되다 = được phát hành", "Tiền giấy làm bằng giấy được phát hành từ thời Trung cổ."], ["N6", "<b>순도</b>를 조작할 수 있는 <b>금속</b>화폐와 달리 지폐는 발행자가 그 신용을 보장해야 했다.", "순도 = độ tinh khiết · 조작하다 = gian lận, làm giả · N와/과 달리 = khác với N · 발행자 = người phát hành · 신용 = tín dụng, uy tín · 보장하다 = bảo đảm", "Khác với tiền kim loại – vốn có thể bị gian lận về độ tinh khiết – tiền giấy đòi hỏi người phát hành phải bảo đảm uy tín của nó."], ["N7", "현대에 지폐나 종이를 대체하는 것으로 ‘전자화폐’가 있다.", "현대 = thời hiện đại · 대체하다 = thay thế · 전자화폐 = tiền điện tử", "Ở thời hiện đại, thứ thay thế cho tiền giấy hay giấy tờ là ‘tiền điện tử’."], ["N8", "1990년대 유럽중앙은행(ECB) 등에서 사용되기 시작한 용어로 전자적 방법으로 저장된 화폐를 결제수단으로 쓴다는 의미다.", "유럽중앙은행 = Ngân hàng Trung ương châu Âu · 용어 = thuật ngữ · 저장되다 = được lưu trữ · 결제수단 = phương tiện thanh toán · ‐는다는 의미다 = có nghĩa là", "Đây là thuật ngữ bắt đầu được dùng từ những năm 1990 ở Ngân hàng Trung ương châu Âu (ECB) và các nơi khác, có nghĩa là dùng tiền được lưu trữ bằng phương thức điện tử làm phương tiện thanh toán."], ["N9", "요즘에는 휴대폰 등 모바일 기기를 통해 각종 ‘~페이’도 사용된다.", "휴대폰 = điện thoại di động · 기기 = thiết bị · N을/를 통해 = thông qua N · 각종 = các loại · 페이 = ví điện tử (‘pay’)", "Ngày nay, các loại ví điện tử ‘~Pay’ cũng được sử dụng qua thiết bị di động như điện thoại."]], "V": [[1, "화폐", "貨幣 hóa tệ", "tiền tệ"], [2, "진화", "進化 tiến hóa", "sự tiến hóa"], [3, "생산력", "生產力 sinh sản lực", "sức sản xuất"], [4, "원시사회", "原始社會 nguyên thủy xã hội", "xã hội nguyên thủy"], [5, "자급자족", "自給自足 tự cấp tự túc", "tự cung tự cấp"], [6, "물물교환", "物物交換 vật vật giao hoán", "hàng đổi hàng"], [7, "매개물", "媒介物 môi giới vật", "vật trung gian"], [8, "보관", "保管 bảo quản", "sự bảo quản, cất giữ"], [9, "운반", "運搬 vận ban", "sự vận chuyển"], [10, "금속", "金屬 kim thuộc", "kim loại"], [11, "무게", "—", "trọng lượng, sức nặng"], [12, "달다", "—", "cân (đo trọng lượng)"], [13, "순도", "純度 thuần độ", "độ tinh khiết"], [14, "재다", "—", "đo"], [15, "단위", "單位 đơn vị", "đơn vị"], [16, "유래되다", "由來 do lai", "bắt nguồn, có nguồn gốc"], [17, "지폐", "紙幣 chỉ tệ", "tiền giấy"], [18, "도난", "盜難 đạo nạn", "sự mất trộm"], [19, "분실", "紛失 phân thất", "sự đánh mất, thất lạc"], [20, "맡기다", "—", "gửi, giao cho giữ"], [21, "거래", "去來 khứ lai", "giao dịch, mua bán"], [22, "잔돈", "—", "tiền lẻ, tiền thối lại"], [23, "수표", "手票 thủ phiếu", "séc, ngân phiếu"], [24, "신용카드", "信用 tín dụng + card", "thẻ tín dụng"], [25, "현금카드", "現金 hiện kim + card", "thẻ rút tiền mặt (thẻ ATM)"]], "AN": {"N1": {"v": "Chủ ngữ ẩn (그때의 생활은 = cuộc sống khi đó) · Vị ngữ chính: 자급자족 형태였다 → 'là hình thái tự cung tự cấp'; bản dịch đổi thành 'họ tự cung tự cấp'.", "cut": "2 khúc, cắt ở ‐었을 때는: ① 인류가 수렵채집 생활을 했을 때는 (khi loài người sống bằng săn bắt hái lượm) ② 거의 모든 것을 자신이 만들어 해결하는 자급자족 형태였다 (là kiểu tự cung tự cấp – gần như mọi thứ đều tự làm ra).", "mod": "Định ngữ: 거의 모든 것을 자신이 만들어 해결하는 → danh từ: 자급자족 형태. Dịch 'tự cung tự cấp' trước, rồi giải thích 'gần như mọi thứ đều tự làm ra để dùng' sau (dùng gạch ngang).", "words": "수렵채집 (狩獵採集 thú liệp thải tập) = săn bắt + hái lượm · 자급자족 (自給自足 tự cấp tự túc) = tự cung tự cấp"}, "N2": {"v": "Chủ ngữ: 필요가 · Vị ngữ chính: 생겼다 → 'nảy sinh nhu cầu…'. Chủ ngữ phụ: 분업이 발생하면서.", "cut": "2 khúc, cắt ở ‐(으)면서: ① 이후 농사를 짓고 여러 다양한 분업이 발생하면서 (về sau, khi con người làm nông và xuất hiện nhiều kiểu phân công lao động) ② 필요한 물품을 주고받을 필요가 생겼다 (nảy sinh nhu cầu trao đổi đồ dùng cần thiết).", "mod": "Định ngữ: 필요한 물품을 주고받을 → danh từ: 필요. Dịch: 'nhu cầu' trước, 'trao đổi những đồ dùng cần thiết' sau.", "words": "분업 (分業 phân nghiệp) = chia việc → phân công lao động · 물품 (物品 vật phẩm) = đồ dùng, hàng hóa"}, "N3": {"v": "2 cặp chủ–vị: 물물교환이 이뤄졌지만 ('đã đổi hàng lấy hàng nhưng') · 매개체가 필요했다 ('cần một vật trung gian') → câu chính ở vế sau.", "cut": "3 khúc: ① 상품과 상품을 맞바꾸는 물물교환이 이뤄졌지만 (người ta đổi hàng lấy hàng, nhưng) ② 각자가 원하는 수량이나 가치가 달라 (vì số lượng, giá trị mỗi bên muốn khác nhau) ③ 공정하게 교환할 수 있는 매개체가 필요했다 (nên cần vật trung gian giúp trao đổi công bằng). Cắt ở ‐지만 và ‐아(서).", "mod": "① 상품과 상품을 맞바꾸는 → 물물교환 (định ngữ chỉ để giải thích, có thể gộp: 'đổi hàng lấy hàng'). ② 각자가 원하는 → 수량이나 가치: 'số lượng và giá trị mỗi bên mong muốn'. ③ 공정하게 교환할 수 있는 → 매개체: 'vật trung gian giúp trao đổi công bằng'.", "words": "물물교환 (物物交換 vật vật giao hoán) = hàng đổi hàng · 매개체 (媒介體 môi giới thể) = vật trung gian · 공정 (公正 công chính) = công bằng"}, "N4": {"v": "Chủ ngữ: 그래서 등장한 것이 · Vị ngữ 1: ‘화폐’(이)고 → 'thứ ra đời là tiền tệ'; Vị ngữ 2: 사용된 것으로 추정된다 → 'được cho là đã được dùng…'.", "cut": "2 khúc, cắt ở ‐(으)로: ① 그래서 등장한 것이 ‘화폐’로 (thứ ra đời từ đó chính là 'tiền tệ') ② 기원전(BC) 4000년 즈음부터 사용된 것으로 추정된다 (được cho là đã dùng từ khoảng năm 4000 TCN).", "mod": "Định ngữ ngắn: 그래서 등장한 → 것: 'thứ ra đời từ đó'. Không có định ngữ dài khác.", "words": "화폐 (貨幣 hóa tệ) = tiền tệ · 추정 (推定 suy định) = suy đoán, ước đoán → 'được cho là' · 기원전 (紀元前 kỷ nguyên tiền) = trước Công nguyên"}, "N5": {"v": "Chủ ngữ: 지폐는 · Vị ngữ chính: 발행됐다 → 'Tiền giấy được phát hành…'.", "cut": "1 khúc: ① 종이로 만들어진 지폐는 / 중세시대부터 발행됐다 (tiền giấy làm bằng giấy / được phát hành từ thời Trung cổ).", "mod": "Định ngữ ngắn: 종이로 만들어진 → 지폐: 'tiền giấy làm bằng giấy' (danh từ trước, định ngữ sau).", "words": "지폐 (紙幣 chỉ tệ) = tiền giấy · 발행 (發行 phát hành) · 중세 (中世 trung thế) = Trung cổ"}, "N6": {"v": "Chủ ngữ: 발행자가 (trong chủ đề 지폐는) · Vị ngữ chính: 보장해야 했다 → 'tiền giấy đòi hỏi người phát hành phải bảo đảm…'.", "cut": "2 khúc, cắt ở ‐와 달리: ① 순도를 조작할 수 있는 금속화폐와 달리 (khác với tiền kim loại – vốn có thể bị gian lận độ tinh khiết) ② 지폐는 발행자가 그 신용을 보장해야 했다 (tiền giấy thì người phát hành phải bảo đảm uy tín).", "mod": "Định ngữ: 순도를 조작할 수 있는 → danh từ: 금속화폐. Dịch: 'tiền kim loại' trước, 'vốn có thể bị gian lận về độ tinh khiết' sau.", "words": "순도 (純度 thuần độ) = độ tinh khiết · 조작 (操作 thao tác) = can thiệp, làm giả · 신용 (信用 tín dụng) = uy tín, độ tin cậy"}, "N7": {"v": "Chủ ngữ: ‘전자화폐’가 · Vị ngữ chính: 있다 → 'thứ thay thế… là tiền điện tử' (biến 'có' thành 'là' cho tự nhiên).", "cut": "2 khúc: ① 현대에 (ở thời hiện đại) ② 지폐나 종이를 대체하는 것으로 ‘전자화폐’가 있다 (thứ thay thế tiền giấy hay giấy tờ là 'tiền điện tử').", "mod": "Định ngữ: 지폐나 종이를 대체하는 → 것: 'thứ thay thế cho tiền giấy hay giấy tờ'.", "words": "대체 (代替 đại thế) = thay thế · 전자 (電子 điện tử)"}, "N8": {"v": "Chủ ngữ ẩn: (전자화폐는 = đây) · Vị ngữ 1: 용어(이)고 → 'Đây là thuật ngữ…'; Vị ngữ 2: 쓴다는 의미다 → 'có nghĩa là dùng…'.", "cut": "2 khúc, cắt ở ‐(으)로: ① 1990년대 유럽중앙은행(ECB) 등에서 사용되기 시작한 용어로 (là thuật ngữ bắt đầu được dùng từ thập niên 1990 ở ECB…) ② 전자적 방법으로 저장된 화폐를 결제수단으로 쓴다는 의미다 (có nghĩa là dùng tiền lưu trữ điện tử làm phương tiện thanh toán).", "mod": "① 1990년대 유럽중앙은행(ECB) 등에서 사용되기 시작한 → 용어: 'thuật ngữ' trước, 'bắt đầu được dùng từ những năm 1990 ở ECB…' sau. ② 전자적 방법으로 저장된 → 화폐: 'tiền được lưu trữ bằng phương thức điện tử'.", "words": "결제 (決濟 quyết tế) = thanh toán · 수단 (手段 thủ đoạn) = phương tiện, cách thức · 저장 (貯藏 trữ tàng) = lưu trữ"}, "N9": {"v": "Chủ ngữ: 각종 ‘~페이’도 · Vị ngữ chính: 사용된다 (bị động) → 'các loại ~Pay cũng được sử dụng'.", "cut": "2 khúc: ① 요즘에는 휴대폰 등 모바일 기기를 통해 (ngày nay, qua thiết bị di động như điện thoại) ② 각종 ‘~페이’도 사용된다 (các loại ví điện tử ~Pay cũng được dùng). Tiếng Việt đưa ② lên trước ①.", "mod": "Không có định ngữ dài.", "words": "기기 (機器 cơ khí) = thiết bị, máy móc · 각종 (各種 các chủng) = các loại · 페이 = 'pay' → ví/thanh toán điện tử"}}}, "6": {"t": "합리적 소비자", "p": "102–103", "A": [["Đoạn 1 · Người tiêu dùng chọn mua thế nào"], ["A1", "소비자들은 물건을 <b>구매할<sup>2</sup></b> 때 높은 만족을 얻기 위해 노력한다.", "구매하다 = mua · 만족을 얻다 = đạt được sự hài lòng · ‐기 위해 = để", "Người tiêu dùng khi mua hàng luôn cố gắng để đạt được sự hài lòng cao."], ["A2", "예를 들어 어머니가 저녁상에 올릴 생선을 고등어로 할 것인지 아니면 오징어로 할 것인지를 <b>고민한다<sup>3</sup></b>고 하자.", "고민하다 = đắn đo · 저녁상에 올리다 = dọn lên mâm cơm tối · 고등어 = cá thu · 오징어 = mực · N(으)로 하다 = chọn N · ‐ㄴ/는다고 하자 = giả sử… · A로 할 것인지 아니면 B로 할 것인지(를) 고민하다 = đắn đo nên chọn A hay B (‐(으)ㄹ 것인지 = liệu có (sẽ)… không; 아니면 = hay là; lặp 2 lần → “A hay B”)", "Ví dụ, giả sử người mẹ đang đắn đo không biết nên chọn cá thu hay mực để dọn lên mâm cơm tối."], ["A3", "고등어를 선택할 경우 고등어의 <b>가격<sup>4</sup></b>과 고등어 소비로부터 가족들이 얻을 수 있는 만족감을 계산하고, 오징어를 선택했을 경우 오징어의 가격과 거기서 얻는 만족감을 계산하여 어느 것을 <b>구입할지<sup>5</sup></b> <b>결정하게<sup>6</sup></b> 된다.", "가격 = giá · 구입하다 = mua vào · 결정하다 = quyết định · ‐(으)ㄹ 경우 = trong trường hợp · N(으)로부터 = từ N · ‐게 되다 = (rốt cuộc) sẽ…", "Nếu chọn cá thu thì bà tính giá cá thu và mức hài lòng cả nhà có được khi ăn cá thu; nếu chọn mực thì tính giá mực và mức hài lòng từ món mực, rồi quyết định mua cái nào."], ["A4", "구입한 상품의 소비로부터 얻은 만족감과 상품의 가격을 비교하여 제한된 <b>범위<sup>7</sup></b> 내에서 만족이 가장 커지도록, 즉 <b>지출하는<sup>8</sup></b> 돈의 가치가 가장 크도록 결정을 하는 것이다.", "범위 = phạm vi · 지출하다 = chi tiêu · ‐도록 = sao cho · N 내에서 = trong N · 즉 = tức là", "Tức là so sánh mức hài lòng có được từ việc dùng món hàng đã mua với giá của nó, rồi quyết định sao cho trong phạm vi có hạn, sự hài lòng là lớn nhất, nói cách khác là giá trị của đồng tiền bỏ ra là lớn nhất."], ["Đoạn 2 · Cân nhắc trước khi mua"], ["A5", "이처럼 소비자들이 <b>합리적인<sup>1</sup></b> 소비를 하기 위해서는 선택에 앞서 여러 가지를 <b>고려할<sup>9</sup></b> 필요가 있다.", "합리적 = hợp lý · 고려하다 = cân nhắc · N에 앞서 = trước khi N · ‐(으)ㄹ 필요가 있다 = cần phải", "Như vậy, để tiêu dùng hợp lý, người tiêu dùng cần cân nhắc nhiều điều trước khi lựa chọn."], ["A6", "우선 상품을 구매하려고 할 때, 구매하려는 상품이 꼭 필요한지를 <b>신중히<sup>10</sup></b> 생각해 보아야 한다.", "신중히 = thận trọng · 우선 = trước hết · ‐(으)려고 하다 = định · ‐는지 = liệu có… không", "Trước hết, khi định mua một món hàng, phải thận trọng suy nghĩ xem món đó có thật sự cần không."], ["A7", "혹시 다른 사람이 가지고 있는 것이 좋아 보여서 구매를 하는 것은 아닌지, 내가 이것을 사면 얼마나 많이 이용할 것인지, 또 어떤 <b>이익<sup>11</sup></b>을 얻을 수 있는지 생각해야 한다.", "이익 = lợi ích · 혹시 ~ 아닌지 = liệu có phải là… không · 좋아 보이다 = trông có vẻ tốt · 이용하다 = sử dụng", "Phải nghĩ xem liệu mình có đang mua chỉ vì thấy đồ người khác có trông hay không, nếu mua thì mình sẽ dùng nhiều đến mức nào, và sẽ được lợi ích gì."], ["Đoạn 3 · Hiểu chất lượng, tính năng"], ["A8", "또한 합리적인 소비를 하기 위해서는 상품의 <b>품질<sup>12</sup></b>이나 <b>성능<sup>13</sup></b>을 잘 알아야 한다.", "품질 = chất lượng · 성능 = tính năng, hiệu năng", "Ngoài ra, để tiêu dùng hợp lý thì phải hiểu rõ chất lượng hay tính năng của sản phẩm."], ["A9", "자주 구입하는 볼펜, 식료품의 경우는 대부분 품질을 잘 알고 있다.", "볼펜 = bút bi · 식료품 = thực phẩm · N의 경우(는) = với trường hợp N", "Với những thứ hay mua như bút bi hay thực phẩm thì phần lớn chúng ta đều biết rõ chất lượng."], ["A10", "그러나 자주 구입하지 않는 상품을 구입할 때는 구입하기 전에 그 상품의 품질이나 성능을 잘 알 수 없다.", "‐기 전에 = trước khi · ‐(으)ㄹ 수 없다 = không thể", "Nhưng khi mua món hàng không thường mua thì trước khi mua ta không thể biết rõ chất lượng hay tính năng của nó."], ["A11", "따라서 자동차, 가전제품과 같이 자주 구입하지 않는 상품들은 어떤 <b>기능<sup>14</sup></b>을 가지고 있는지 <b>꼼꼼히<sup>15</sup></b> <b>살펴야<sup>16</sup></b> 한다.", "기능 = chức năng · 꼼꼼히 = kỹ lưỡng · 살피다 = xem xét · 가전제품 = đồ điện gia dụng · N과 같이 = như N", "Vì vậy, với những món ít khi mua như ô tô hay đồ điện gia dụng, phải xem xét kỹ lưỡng xem chúng có những chức năng gì."], ["Đoạn 4 · Thu thập thông tin"], ["A12", "상품에 대한 <b>정보<sup>17</sup></b>를 얻기 위해서는 상품 <b>설명서<sup>18</sup></b>를 읽어 보는 것 외에 이미 사용해 본 사람의 의견을 들어 보는 방법이 있다.", "정보 = thông tin · 설명서 = sách hướng dẫn · N 외에 = ngoài N ra · 의견 = ý kiến", "Để có thông tin về sản phẩm, ngoài việc đọc sách hướng dẫn, còn có cách hỏi ý kiến người đã dùng thử."], ["A13", "품질을 <b>제대로<sup>19</sup></b> <b>비교하<sup>20</sup></b>기 위해서는 많은 정보가 필요하며, 이용 가능한 정보가 많을수록 더 나은 선택을 할 수 있다.", "제대로 = đúng cách, cho ra hồn · 비교하다 = so sánh · ‐(으)며 = và · ‐(으)ㄹ수록 = càng… càng", "Để so sánh chất lượng cho đúng cần nhiều thông tin, và thông tin có thể dùng càng nhiều thì càng lựa chọn tốt hơn."], ["A14", "그러나 정보를 얻는 것도 비용이 들기 때문에 무한정 찾아 다닐 수는 없다.", "비용이 들다 = tốn chi phí · 무한정 = vô hạn định · 찾아 다니다 = đi tìm khắp nơi", "Nhưng thu thập thông tin cũng tốn chi phí nên không thể đi tìm mãi được."], ["Đoạn 5 · Giá cả cũng là thông tin"], ["A15", "소비자들은 <b>동일한<sup>21</sup></b> 상품은 어디에서나 동일한 가격에 팔릴 것으로 생각하기 쉽다.", "동일하다 = giống hệt · 팔리다 = được bán · ‐기 쉽다 = dễ…", "Người tiêu dùng dễ nghĩ rằng cùng một sản phẩm thì ở đâu cũng bán cùng một giá."], ["A16", "그러나 실제로는 동일한 상품이라도 지역, 판매 방법, 판매자에 따라 가격이 다른 경우가 많다.", "N(이)라도 = dù là N · N에 따라 = tùy theo N · 판매 = bán hàng", "Nhưng thực tế, dù cùng một sản phẩm, giá cả vẫn thường khác nhau tùy theo khu vực, cách bán và người bán."], ["A17", "반면 가격이 <b>저렴하다<sup>22</sup></b>고 해서 반드시 좋은 것은 아니다.", "저렴하다 = rẻ · ‐다고 해서 ~는 것은 아니다 = không phải cứ… là… · 반드시 = nhất định", "Mặt khác, không phải cứ rẻ là nhất định tốt."], ["A18", "상품의 가격은 그 안에 상품에 대한 정보를 <b>담고<sup>23</sup></b> 있는 경우가 많다.", "담다 = chứa đựng", "Giá của sản phẩm thường chứa đựng trong đó thông tin về sản phẩm."], ["A19", "일반적으로 30만원에 파는 휴대폰보다는 50만원에 파는 휴대폰이 기능이나 디자인 면에서 <b>앞서는<sup>24</sup></b> 것과 같이 가격은 상품의 성능을 알려주는 정보가 되기도 한다.", "앞서다 = vượt trội · N 면에서 = về mặt N · ‐는 것과 같이 = giống như việc… · ‐기도 하다 = cũng có khi", "Giống như điện thoại giá 500 nghìn won thường vượt trội hơn điện thoại 300 nghìn won về chức năng hay thiết kế, giá cả cũng có thể là thông tin cho biết tính năng của sản phẩm."], ["A20", "따라서 소비자는 주어진 <b>예산<sup>25</sup></b> 범위 내에서 자신에게 필요한 기능의 상품을 구입하려고 노력해야 한다.", "예산 = ngân sách · 주어진 = có sẵn, được cho · 범위 내에서 = trong phạm vi", "Vì vậy, người tiêu dùng phải cố gắng mua sản phẩm có chức năng mình cần trong phạm vi ngân sách có sẵn."]], "B": [["Bài báo 1 · 명절 선물세트 할인 한다더니…\"완전 속았다\" 분통", "<a href=\"https://www.hankyung.com/article/202510023611i\" target=\"_blank\" rel=\"noopener\">한국경제, 2025.10.07</a>"], ["N1", "추석을 앞두고 온라인몰과 대형마트가 '최대 72% <b>할인</b>', '역대급 특가' 문구를 내걸며 소비자 유혹에 나섰다.", "N을 앞두고 = sắp tới N · 대형마트 = siêu thị lớn · 역대급 특가 = giá sốc chưa từng có · 문구를 내걸다 = treo khẩu hiệu · 유혹에 나서다 = ra sức dụ dỗ", "Trước dịp Trung thu, các trang mua sắm trực tuyến và siêu thị lớn treo khẩu hiệu “giảm đến 72%”, “giá sốc chưa từng có” để lôi kéo người tiêu dùng."], ["N2", "그러나 실제로는 정가를 부풀려 할인율만 크게 보이게 한 '위장 세일'이 여전히 적발되고 있어 주의가 필요하다.", "정가 = giá niêm yết · 부풀리다 = thổi phồng · 할인율 = tỉ lệ giảm giá · 위장 = ngụy trang · 적발되다 = bị phát hiện · 주의가 필요하다 = cần cảnh giác", "Nhưng thực tế vẫn liên tục phát hiện những đợt “giảm giá giả”, nâng giá niêm yết lên để tỉ lệ giảm trông lớn, nên cần cảnh giác."], ["N3", "대표적인 사례는 정가 인상 후 할인율을 적용하는 방식이다.", "대표적 = điển hình · 사례 = trường hợp · 인상 = tăng giá · 적용하다 = áp dụng · 방식 = cách thức", "Trường hợp điển hình là cách tăng giá niêm yết rồi mới áp dụng tỉ lệ giảm giá."], ["N4", "한 온라인몰은 한우 선물세트 정가를 18만5000원에서 20만5000원으로 올린 뒤 20% 할인 행사를 진행했다.", "한우 = bò Hàn · ‐(으)ㄴ 뒤 = sau khi · 행사를 진행하다 = tổ chức chương trình", "Một trang mua sắm trực tuyến đã nâng giá niêm yết của hộp quà thịt bò Hàn từ 185.000 won lên 205.000 won rồi mới tổ chức chương trình giảm 20%."], ["N5", "소비자가 실제 지불하는 가격은 변함이 없는데 할인율만 커 보이도록 한 것이다.", "지불하다 = thanh toán · 변함이 없다 = không thay đổi · ‐아/어 보이다 = trông có vẻ · ‐도록 하다 = làm cho", "Giá người tiêu dùng thực trả không đổi, chỉ có tỉ lệ giảm giá là được làm cho trông lớn hơn."], ["N6", "세트 상품이 낱개 구매보다 더 비싼 경우도 적지 않았다.", "낱개 = từng món lẻ · 적지 않다 = không ít", "Cũng không ít trường hợp mua cả hộp còn đắt hơn mua lẻ từng món."], ["N7", "행사 가격만 보지 말고 평소 판매가와 비교하거나, 세트·낱개 가격 차이를 반드시 따져봐야 피해를 막을 수 있다는 것이다.", "평소 = thường ngày · 판매가 = giá bán · 따지다 = tính toán kỹ · 피해를 막다 = tránh thiệt hại · ‐아/어야 = phải… thì mới", "Tức là đừng chỉ nhìn giá khuyến mãi mà phải so với giá bán thường ngày, hoặc tính kỹ chênh lệch giữa mua hộp và mua lẻ thì mới tránh bị thiệt."], ["N8", "유통업계 관계자는 \"단기간 이벤트성 광고는 <b>충동구매</b>를 유도해 소비자 피해로 이어진다\"며 \"소비자가 가격을 직접 기록하고 비교하는 노력이 필요하다\"고 말했다.", "유통업계 = ngành phân phối · 관계자 = người trong ngành · 충동구매 = mua sắm bốc đồng · 유도하다 = dẫn dắt, kích thích · N(으)로 이어지다 = dẫn đến N", "Một người trong ngành phân phối cho biết: “Quảng cáo kiểu sự kiện ngắn hạn kích thích mua sắm bốc đồng, dẫn đến thiệt hại cho người tiêu dùng; người tiêu dùng cần tự ghi lại giá và so sánh.”"], ["Bài báo 2 · 소비는 미덕인가?", "<a href=\"https://jjan.kr/article/20161230600216\" target=\"_blank\" rel=\"noopener\">전북일보, 2016.12.30</a>"], ["N9", "충동구매나 과소비에 대조되는 의미로, 계획적이며 분수에 맞는 소비를 일컫는다.", "과소비 = tiêu xài quá mức · N에 대조되다 = trái ngược với N · 분수에 맞다 = đúng với khả năng của mình · 일컫다 = gọi là, chỉ", "(Tiêu dùng hợp lý) là khái niệm đối lập với mua sắm bốc đồng hay tiêu xài quá mức, chỉ cách tiêu dùng có kế hoạch và phù hợp với khả năng của mình."]], "V": [[1, "합리적", "合理的 hợp lý", "hợp lý, thông minh"], [2, "구매하다", "購買 cấu mãi", "mua"], [3, "고민하다", "苦悶 khổ muộn", "trăn trở, đắn đo"], [4, "가격", "價格 giá cách", "giá cả"], [5, "구입하다", "購入 cấu nhập", "mua vào"], [6, "결정하다", "決定 quyết định", "quyết định"], [7, "범위", "範圍 phạm vi", "phạm vi"], [8, "지출", "支出 chi xuất", "chi tiêu"], [9, "고려하다", "考慮 khảo lự", "cân nhắc"], [10, "신중하다", "愼重 thận trọng", "thận trọng"], [11, "이익", "利益 lợi ích", "lợi ích, lợi nhuận"], [12, "품질", "品質 phẩm chất", "chất lượng"], [13, "성능", "性能 tính năng", "hiệu năng, tính năng"], [14, "기능", "機能 cơ năng", "chức năng"], [15, "꼼꼼히", "—", "kỹ lưỡng"], [16, "살피다", "—", "xem xét kỹ"], [17, "정보", "情報 tình báo", "thông tin"], [18, "설명서", "說明書 thuyết minh thư", "sách hướng dẫn"], [19, "제대로", "—", "đúng cách, ra hồn"], [20, "비교하다", "比較 tỉ giảo", "so sánh"], [21, "동일하다", "同一 đồng nhất", "giống hệt"], [22, "저렴하다", "低廉 đê liêm", "rẻ"], [23, "담다", "—", "chứa, đựng"], [24, "앞서다", "—", "đi trước, dẫn đầu"], [25, "예산", "豫算 dự toán", "ngân sách"]], "AN": {"N1": {"v": "Chủ ngữ: 온라인몰과 대형마트가 · Vị ngữ chính: 소비자 유혹에 나섰다 → 'ra sức lôi kéo người tiêu dùng'. Vị ngữ phụ: 문구를 내걸며.", "cut": "3 khúc: ① 추석을 앞두고 (trước dịp Trung thu) ② 온라인몰과 대형마트가 '최대 72% 할인', '역대급 특가' 문구를 내걸며 (các trang mua sắm, siêu thị lớn treo khẩu hiệu 'giảm đến 72%'…) ③ 소비자 유혹에 나섰다 (để lôi kéo người tiêu dùng). Cắt ở ‐며.", "mod": "Không có định ngữ dài.", "words": "할인 (割引 cát dẫn) = cắt bớt giá → giảm giá · 특가 (特價 đặc giá) = giá đặc biệt · 유혹 (誘惑 dụ hoặc) = dụ dỗ, lôi kéo"}, "N2": {"v": "Chủ ngữ 1: '위장 세일'이 · Vị ngữ 1: 여전히 적발되고 있어 → 'vẫn liên tục bị phát hiện'; Chủ ngữ 2: 주의가 · Vị ngữ 2: 필요하다 → 'nên cần cảnh giác'.", "cut": "3 khúc: ① 그러나 실제로는 (nhưng thực tế) ② 정가를 부풀려 할인율만 크게 보이게 한 '위장 세일'이 여전히 적발되고 있어 (vẫn phát hiện 'giảm giá giả' – nâng giá niêm yết để tỉ lệ giảm trông lớn) ③ 주의가 필요하다 (nên cần cảnh giác). Cắt ở ‐아/어(서) chỉ lý do.", "mod": "Định ngữ: 정가를 부풀려 할인율만 크게 보이게 한 → danh từ: '위장 세일'. Dịch: 'giảm giá giả' trước, 'nâng giá niêm yết lên để tỉ lệ giảm trông lớn' sau.", "words": "정가 (定價 định giá) = giá niêm yết · 위장 (僞裝 ngụy trang) = giả dạng · 적발 (摘發 trích phát) = phát hiện, bắt quả tang (vi phạm)"}, "N3": {"v": "Chủ ngữ: 대표적인 사례는 · Vị ngữ chính: 방식이다 → 'Trường hợp điển hình là cách…'.", "cut": "2 khúc: ① 대표적인 사례는 (trường hợp điển hình) ② 정가 인상 후 할인율을 적용하는 방식이다 (là cách tăng giá niêm yết rồi mới áp dụng tỉ lệ giảm).", "mod": "Định ngữ: 정가 인상 후 할인율을 적용하는 → danh từ: 방식. Dịch: 'cách' trước, 'tăng giá niêm yết rồi mới áp dụng tỉ lệ giảm giá' sau.", "words": "사례 (事例 sự lệ) = trường hợp, ví dụ · 인상 (引上 dẫn thượng) = kéo lên → tăng giá · 적용 (適用 thích dụng) = áp dụng"}, "N4": {"v": "Chủ ngữ: 한 온라인몰은 · Vị ngữ chính: 할인 행사를 진행했다 → 'đã tổ chức chương trình giảm 20%'. Hành động trước: 정가를 … 올린 뒤.", "cut": "2 khúc, cắt ở ‐(으)ㄴ 뒤: ① 한 온라인몰은 한우 선물세트 정가를 18만5000원에서 20만5000원으로 올린 뒤 (một trang mua sắm nâng giá niêm yết hộp quà bò Hàn từ 185.000 lên 205.000 won) ② 20% 할인 행사를 진행했다 (rồi mới tổ chức chương trình giảm 20%).", "mod": "Không có định ngữ dài.", "words": "한우 (韓牛 Hàn ngưu) = bò Hàn Quốc · 진행 (進行 tiến hành) = tổ chức, tiến hành · 18만5000원 = 185.000 won (만 = 10.000)"}, "N5": {"v": "Chủ ngữ ẩn (그것은 = việc đó) · Vị ngữ chính: 커 보이도록 한 것이다 → câu giải thích: 'tức là làm cho… trông lớn hơn'. Chủ ngữ phụ: 가격은 변함이 없는데.", "cut": "2 khúc, cắt ở ‐는데: ① 소비자가 실제 지불하는 가격은 변함이 없는데 (giá người tiêu dùng thực trả không đổi) ② 할인율만 커 보이도록 한 것이다 (chỉ có tỉ lệ giảm là được làm cho trông lớn hơn).", "mod": "Định ngữ: 소비자가 실제 지불하는 → danh từ: 가격. Dịch: 'giá' trước, 'người tiêu dùng thực trả' sau.", "words": "지불 (支拂 chi phất) = trả tiền, thanh toán · 변함 = 변하다 (變 biến) → thay đổi; 변함이 없다 = không đổi"}, "N6": {"v": "Chủ ngữ: …경우도 · Vị ngữ chính: 적지 않았다 → 'cũng không ít trường hợp…'.", "cut": "1 khúc: ① 세트 상품이 낱개 구매보다 더 비싼 경우도 / 적지 않았다 (trường hợp mua cả hộp đắt hơn mua lẻ / cũng không ít). Tiếng Việt đưa 'không ít' lên đầu.", "mod": "Định ngữ: 세트 상품이 낱개 구매보다 더 비싼 → danh từ: 경우. Dịch: 'trường hợp' trước, 'mua cả hộp còn đắt hơn mua lẻ từng món' sau.", "words": "낱개 = từng cái riêng lẻ (낱 = lẻ, 개 = cái) · 구매 (購買 cấu mãi) = mua"}, "N7": {"v": "Chủ ngữ ẩn (소비자 / 전문가의 말) · Vị ngữ chính: 막을 수 있다는 것이다 → câu giải thích/trích lời gián tiếp: 'Tức là… thì mới tránh được thiệt hại'.", "cut": "3 khúc: ① 행사 가격만 보지 말고 (đừng chỉ nhìn giá khuyến mãi) ② 평소 판매가와 비교하거나, 세트·낱개 가격 차이를 반드시 따져봐야 (mà phải so với giá thường ngày, hoặc tính kỹ chênh lệch hộp/lẻ thì mới) ③ 피해를 막을 수 있다는 것이다 (tránh được thiệt hại). Cắt ở ‐지 말고, ‐거나, ‐아/어야.", "mod": "Không có định ngữ dài.", "words": "평소 (平素 bình tố) = thường ngày · 판매가 (販賣價 phiến mại giá) = giá bán · 피해 (被害 bị hại) = thiệt hại"}, "N8": {"v": "Chủ ngữ: 유통업계 관계자는 · Vị ngữ chính: 말했다 → 'Một người trong ngành phân phối cho biết: \"…\"'. Trong ngoặc 1: 광고는 … 이어진다; ngoặc 2: 노력이 필요하다.", "cut": "3 khúc, cắt ở ‐며 và dấu ngoặc: ① 유통업계 관계자는 (một người trong ngành phân phối) ② \"단기간 이벤트성 광고는 충동구매를 유도해 소비자 피해로 이어진다\"며 (quảng cáo sự kiện ngắn hạn kích thích mua bốc đồng, dẫn tới thiệt hại) ③ \"소비자가 가격을 직접 기록하고 비교하는 노력이 필요하다\"고 말했다 (người tiêu dùng cần tự ghi lại và so sánh giá).", "mod": "Định ngữ: 소비자가 가격을 직접 기록하고 비교하는 → danh từ: 노력. Bản dịch bỏ 'nỗ lực', chuyển thành động từ: 'người tiêu dùng cần tự ghi lại giá và so sánh'.", "words": "유통 (流通 lưu thông) = phân phối hàng hóa · 충동 (衝動 xung động) = bốc đồng · 유도 (誘導 dụ đạo) = dẫn dắt, kích thích"}, "N9": {"v": "Chủ ngữ ẩn: (합리적 소비는 = tiêu dùng hợp lý) – bản dịch thêm trong ngoặc. · Vị ngữ chính: 소비를 일컫는다 → 'chỉ cách tiêu dùng…'.", "cut": "2 khúc, cắt ở ‐(으)로: ① 충동구매나 과소비에 대조되는 의미로 (là khái niệm đối lập với mua bốc đồng hay tiêu xài quá mức) ② 계획적이며 분수에 맞는 소비를 일컫는다 (chỉ cách tiêu dùng có kế hoạch và phù hợp khả năng).", "mod": "① 충동구매나 과소비에 대조되는 → 의미: 'khái niệm đối lập với…'. ② 계획적이며 분수에 맞는 → 소비: 'cách tiêu dùng' trước, 'có kế hoạch và phù hợp với khả năng của mình' sau.", "words": "과소비 (過消費 quá tiêu phí) = tiêu xài quá mức · 대조 (對照 đối chiếu) = đối lập · 분수 (分數 phận số) = phận, khả năng của mình"}}}, "7": {"t": "동대문 패션 타운", "p": "", "A": [["Đoạn 1 · Dongdaemun – điểm du lịch và khu mua sắm khổng lồ"], ["A1", "동대문은 연간 250만 명이 넘는 관광객이 찾는 대한민국의 대표적인 관광지다.", "연간 = hằng năm · 관광객 = khách du lịch · ‐는 (định ngữ) = mà · 대표적이다 = tiêu biểu · 관광지 = điểm du lịch", "Dongdaemun là điểm du lịch tiêu biểu của Hàn Quốc, nơi mỗi năm có hơn 2,5 triệu lượt khách du lịch tìm đến."], ["A2", "연간 <b>매출액<sup>1</sup></b>은 10조 원이 넘으며, 외국인 <b>의류<sup>2</sup></b> 구매 규모는 연간 30억 달러나 된다고 한다.", "매출액 = doanh thu · 의류 = quần áo, hàng may mặc · 구매 규모 = quy mô mua sắm · ‐(으)며 = và · N(이)나 되다 = lên tới N (nhấn mạnh nhiều) · ‐다고 하다 = nghe nói, được biết", "Doanh thu hằng năm vượt 10 nghìn tỷ won, và nghe nói quy mô mua quần áo của người nước ngoài lên tới 3 tỷ đô la mỗi năm."], ["A3", "세계에서 가장 큰 대단위 의류 쇼핑(shopping) 단지가 <b>형성된<sup>3</sup></b> 것도 놀랍지만, 3만여 개나 되는 소규모 <b>점포<sup>4</sup></b>들이 독자적으로 <b>기획<sup>5</sup></b>·생산·판매까지 담당한다는 점은 정말로 놀라운 일이다.", "형성되다 = được hình thành · 점포 = cửa hàng · 기획 = lên kế hoạch, thiết kế ý tưởng · 대단위 = quy mô lớn · 단지 = khu (tổ hợp) · ‐지만 = nhưng · ‐여 = hơn (số lượng) · 독자적으로 = một cách độc lập · 담당하다 = đảm nhận · ‐는다는 점 = việc (rằng)", "Việc hình thành khu mua sắm quần áo quy mô lớn nhất thế giới ở đây đã đáng ngạc nhiên, nhưng điều thật sự kinh ngạc là hơn 30.000 cửa hàng nhỏ tự mình đảm nhận từ lên ý tưởng, sản xuất cho đến bán hàng."], ["A4", "옷뿐 아니라 패션(fashion) 잡화, 신발, 장신구 등 몸에 <b>걸칠<sup>6</sup></b> 수 있는 모든 것이 있다고 한다.", "걸치다 = khoác, mặc lên người · N뿐(만) 아니라 = không chỉ N mà còn · 잡화 = đồ tạp hóa, phụ kiện · 장신구 = đồ trang sức · ‐(으)ㄹ 수 있다 = có thể", "Nghe nói ở đây không chỉ có quần áo mà có tất cả mọi thứ có thể khoác lên người, như phụ kiện thời trang, giày dép, đồ trang sức…"], ["Đoạn 2 · Từ chợ truyền thống đến tổ hợp thời trang lớn nhất thế giới"], ["A5", "2002년 정부에서 관광 특구로 지정한 뒤 ‘동대문패션타운(town)’은 전통 <b>재래시장<sup>7</sup></b>과 현대식 쇼핑몰(shopping mall)이 <b>한데<sup>8</sup></b> <b>섞인<sup>9</sup></b> 세계에서 가장 큰 패션산업 종합단지로 <b>발돋움했다<sup>10</sup></b>.", "재래시장 = chợ truyền thống · 한데 = cùng một chỗ · 섞이다 = được trộn lẫn · 발돋움하다 = vươn lên · 관광 특구 = đặc khu du lịch · 지정하다 = chỉ định · ‐(으)ㄴ 뒤 = sau khi · 종합단지 = khu tổng hợp · N(으)로 = thành N", "Sau khi được chính phủ chỉ định là đặc khu du lịch vào năm 2002, ‘Dongdaemun Fashion Town’ đã vươn lên thành tổ hợp công nghiệp thời trang lớn nhất thế giới, nơi chợ truyền thống và trung tâm mua sắm hiện đại hòa lẫn vào nhau."], ["A6", "‘동대문’이 세계적으로 이름을 얻게 된 <b>경쟁력<sup>11</sup></b>은 무엇일까?", "경쟁력 = sức cạnh tranh · 이름을 얻다 = nổi danh · ‐게 되다 = trở nên · ‐(으)ㄹ까? = liệu là…?", "Sức cạnh tranh giúp ‘Dongdaemun’ nổi danh khắp thế giới là gì?"], ["A7", "스피드(speed)! 그렇다.", "스피드 = tốc độ · 그렇다 = đúng vậy", "Tốc độ! Đúng vậy."], ["A8", "패션산업은 무엇보다 스피드가 중요하다.", "무엇보다 = hơn hết · 패션산업 = ngành thời trang", "Trong ngành thời trang, tốc độ là quan trọng hơn hết."], ["Đoạn 3 · Ngành thời trang luôn đi trước mùa"], ["A9", "지금 막 나오기 시작하는 봄 옷은 언제부터 만들기 시작할까?", "막 = vừa mới · ‐기 시작하다 = bắt đầu · ‐(으)ㄹ까? = (tự hỏi) liệu", "Quần áo mùa xuân vừa mới bắt đầu bày bán bây giờ được bắt đầu sản xuất từ khi nào?"], ["A10", "두 계절이 앞선 지난 가을에 디자인을 하기 시작한다고 한다.", "계절 = mùa · 앞서다 = đi trước · ‐(으)ㄴ (định ngữ quá khứ) · ‐ㄴ다고 하다 = nghe nói", "Nghe nói người ta bắt đầu thiết kế từ mùa thu năm trước, tức là đi trước hai mùa."], ["A11", "미리 계절을 한참 앞서 나가는 것이다.", "미리 = trước · 한참 = khá lâu, rất xa · 앞서 나가다 = đi trước · ‐는 것이다 = (giải thích) tức là", "Tức là luôn đi trước mùa một khoảng rất xa."], ["A12", "<b>원단<sup>12</sup></b>도 <b>확보해야<sup>13</sup></b> 하고, 생산도 해야 하고, 무엇보다 소비자의 <b>취향<sup>14</sup></b>을 꼼꼼히 살펴야 하기 때문에.", "원단 = vải (nguyên liệu) · 확보하다 = đảm bảo có, thu xếp đủ · 취향 = sở thích, gu · ‐아/어야 하다 = phải · 꼼꼼히 = tỉ mỉ · 살피다 = xem xét · ‐기 때문에 = vì (câu bỏ lửng)", "Bởi vì còn phải lo đủ vải, phải sản xuất, và hơn hết là phải tìm hiểu kỹ gu của người tiêu dùng."], ["Đoạn 4 · Dongdaemun: may xong trong một tuần"], ["A13", "그런데 이곳 동대문의 옷들은 단 일주일 만에 만든다.", "그런데 = thế nhưng · 단 = chỉ · N 만에 = trong vòng (sau) N", "Thế nhưng quần áo ở Dongdaemun này được làm ra chỉ trong vòng một tuần."], ["A14", "디자이너(designer)가 옷의 색깔과 디자인을 결정하면 주변에서 금방 원단을 <b>구하고<sup>15</sup></b>, 바로 옆 동네인 창신동 <b>봉제<sup>16</sup></b> 골목에서 순식간에 만들어 다시 매장까지 배달되는 것이다.", "구하다 = tìm mua, kiếm · 봉제 = may (công nghiệp) · ‐(으)면 = hễ… thì · 금방 = ngay · N인 N = N là N · 골목 = hẻm, con phố nhỏ · 순식간에 = trong chớp mắt · 매장 = cửa hàng · 배달되다 = được giao", "Hễ nhà thiết kế quyết định màu sắc và kiểu dáng là vải được tìm mua ngay quanh đó, quần áo được may trong chớp mắt ở các con hẻm may mặc Changsin-dong – khu phố ngay bên cạnh – rồi được giao trở lại tận cửa hàng."], ["A15", "어떤 스타일(style)이 유행하면 그와 비슷한, 또 조금 다른 디자인의 옷들이 엄청나게 <b>쏟아져<sup>17</sup></b> 나온다.", "쏟아지다 = tuôn ra, ồ ạt · 유행하다 = thịnh hành · N와/과 비슷하다 = giống N · 엄청나게 = cực kỳ", "Hễ một kiểu nào đó thịnh hành là hàng loạt quần áo có thiết kế tương tự, hoặc hơi khác một chút, tuôn ra ồ ạt."], ["A16", "소규모 점포들이 조금씩 생산하므로 실패하더라도 큰 손실을 입지 않을 수 있고, 제품의 <b>반응<sup>18</sup></b>이 좋으면 금방 생산량을 크게 늘릴 수도 있다.", "반응 = phản ứng (của thị trường) · ‐(으)므로 = vì · ‐더라도 = dù cho · 손실을 입다 = chịu thiệt hại · 생산량 = sản lượng · 늘리다 = tăng · ‐(으)ㄹ 수도 있다 = cũng có thể", "Vì các cửa hàng nhỏ chỉ sản xuất từng ít một, nên dù có thất bại cũng không chịu thiệt hại lớn; còn nếu sản phẩm được thị trường đón nhận thì có thể nhanh chóng tăng mạnh sản lượng."], ["Đoạn 5 · Hiệu quả kinh tế của phân công và tập trung"], ["A17", "동대문 일대에는 대형 쇼핑몰만 해도 30여 개나 되고, <b>종사자<sup>19</sup></b> 수는 15만 명이나 된다고 한다.", "종사자 = người làm việc (trong ngành) · 일대 = cả vùng · N만 해도 = chỉ riêng N thôi đã · ‐여 = hơn · N(이)나 되다 = lên tới N", "Nghe nói chỉ riêng trung tâm mua sắm lớn ở khu vực Dongdaemun đã có hơn 30 cái, và số người làm việc lên tới 150.000 người."], ["A18", "이들은 하루 유동인구 100만 명을 불러 모으고, 하루 매출 500억 원이라는 경제효과를 <b>유발시키고<sup>20</sup></b> 있다.", "유발시키다 = gây ra, tạo ra · 유동인구 = lượng người qua lại · 불러 모으다 = thu hút · N(이)라는 = gọi là N, (con số) N · ‐고 있다 = đang", "Họ thu hút lượng người qua lại 1 triệu người mỗi ngày và đang tạo ra hiệu quả kinh tế với doanh thu 50 tỷ won mỗi ngày."], ["A19", "경제학에서 경쟁력을 갖추기 위해 ‘<b>분업<sup>21</sup></b>’과 ‘<b>집적<sup>22</sup></b>’의 효과를 유감없이 발휘하고 있는 곳이 바로 동대문이다.", "분업 = phân công lao động · 집적 = tập trung, tích tụ · 갖추다 = trang bị, có đủ · ‐기 위해 = để · 유감없이 = trọn vẹn · 발휘하다 = phát huy · 바로 = chính là", "Nơi đang phát huy trọn vẹn hiệu quả của ‘phân công lao động’ và ‘tập trung (sản xuất)’ – những điều mà kinh tế học nói là cần để có sức cạnh tranh – chính là Dongdaemun."], ["A20", "한국을 찾은 외국인들은 세계 어디에서도 찾을 수 없는 <b>독특한<sup>23</sup></b> 디자인과 수많은 상품을 만나고 눈이 <b>휘둥그래질<sup>24</sup></b> 수밖에 없다.", "독특하다 = độc đáo · 휘둥그래지다 = tròn mắt (kinh ngạc) · 어디에서도 + phủ định = không ở đâu cả · 수많다 = vô số · ‐(으)ㄹ 수밖에 없다 = không thể không, đành phải", "Người nước ngoài đến Hàn Quốc, khi bắt gặp những thiết kế độc đáo không thể tìm thấy ở bất cứ đâu trên thế giới cùng vô số sản phẩm, không thể không tròn mắt kinh ngạc."], ["Đoạn 6 · Tương lai tươi sáng"], ["A21", "수많은 점포가 <b>치열한<sup>25</sup></b> 경쟁을 벌이면서 제품의 품질을 높이고, 빠르게 경쟁력을 쌓아가는 동대문패션의류타운.", "치열하다 = khốc liệt · 경쟁을 벌이다 = cạnh tranh · ‐(으)면서 = vừa… vừa, trong khi · 품질 = chất lượng · 쌓아가다 = tích lũy dần · câu kết bằng danh từ (không có vị ngữ)", "Dongdaemun Fashion Town – nơi vô số cửa hàng vừa cạnh tranh khốc liệt vừa nâng cao chất lượng sản phẩm, nhanh chóng tích lũy sức cạnh tranh."], ["A22", "이들의 앞날은 더욱 밝아 보인다.", "앞날 = tương lai · 밝다 = sáng · ‐아/어 보이다 = trông có vẻ", "Tương lai của họ trông càng thêm tươi sáng."]], "B": [["Bài báo 1 · ‘1인 마켓·데이터’ 입고 진화하는 동대문 패션시장", "<a href=\"https://magazine.hankyung.com/business/article/201903190180b\" target=\"_blank\" rel=\"noopener\">한경비즈니스, 2019.03.22</a>"], ["N1", "도매업자들은 디자이너를 통해 옷을 디자인하고 이를 생산 공장에 맡긴다.", "도매업자 = người bán buôn · N을/를 통해 = thông qua N · 이를 = việc/cái đó · 맡기다 = giao cho, đặt (làm)", "Các nhà bán buôn thiết kế quần áo thông qua nhà thiết kế rồi giao cho xưởng sản xuất."], ["N2", "생산 공장은 <b>원단</b>부터 <b>봉제</b>에 이르기까지 옷을 만들어 도매 업체에 다시 납품한다.", "원단 = vải · 봉제 = may · N부터 N에 이르기까지 = từ N đến tận N · 납품하다 = giao hàng (theo đơn)", "Xưởng sản xuất làm quần áo, từ khâu vải đến khâu may, rồi giao lại cho doanh nghiệp bán buôn."], ["N3", "소매 업체는 도매시장을 둘러보며 쇼핑몰 콘셉트에 맞는 샘플을 구매하고 이를 촬영해 온라인에 등록한다.", "소매 업체 = doanh nghiệp bán lẻ · 둘러보다 = đi xem một vòng · ‐(으)며 = vừa… vừa · N에 맞다 = hợp với N · 촬영하다 = chụp ảnh · 등록하다 = đăng", "Doanh nghiệp bán lẻ đi một vòng chợ đầu mối, mua những mẫu hợp với concept cửa hàng online của mình, chụp ảnh rồi đăng lên mạng."], ["N4", "소비자가 온라인에 등록된 상품을 보고 구매하면 소매업체가 당일 내역을 확인해 사입삼촌에게 전달한다.", "등록되다 = được đăng · ‐(으)면 = hễ… thì · 당일 = trong ngày · 내역 = chi tiết (đơn hàng) · 사입삼촌 = ‘chú lấy hàng’ (người mua hộ ở chợ sỉ) · 전달하다 = chuyển", "Khi người tiêu dùng xem sản phẩm đăng trên mạng và đặt mua, doanh nghiệp bán lẻ kiểm tra chi tiết đơn trong ngày rồi chuyển cho ‘chú lấy hàng’."], ["N5", "사입삼촌은 소매 업체별 구매 내역을 확인한 뒤 도매 매장을 들러 주문하고 물량에 맞춰 물건을 전달 받아 다시 소매 업체에 배송하는 방식이다.", "N별 = theo từng N · ‐(으)ㄴ 뒤 = sau khi · 들르다 = ghé · 물량 = số lượng hàng · N에 맞추다 = theo đúng N · 배송하다 = giao hàng · ‐는 방식이다 = theo cách là", "Cách làm là: ‘chú lấy hàng’ kiểm tra đơn mua của từng nhà bán lẻ, ghé các cửa hàng sỉ để đặt, nhận hàng đúng số lượng rồi giao lại cho các nhà bán lẻ."], ["N6", "이처럼 사입삼촌들이 물량을 매일 공급 받을 수 있는 이유는 동대문이 패션 클러스터를 이루고 있기 때문이다.", "이처럼 = như thế này · 공급 받다 = được cung cấp · 클러스터 = cụm (cluster) · 이루다 = tạo thành · N 이유는 ‐기 때문이다 = lý do N là vì", "Lý do ‘chú lấy hàng’ có thể được cung cấp đủ hàng mỗi ngày như vậy là vì Dongdaemun đã hình thành một cụm công nghiệp thời trang."], ["N7", "섬유산업이 발달한 1960년대부터 동대문에는 원단 수급에서부터 디자인·소량생산에 이르기까지 원스톱으로 <b>의류</b> 제조가 이뤄질 수 있는 클러스터가 갖춰져 있다.", "섬유산업 = ngành dệt · 수급 = cung ứng · 소량생산 = sản xuất số lượng nhỏ · 원스톱 = trọn gói (one-stop) · 의류 = may mặc · 이뤄지다 = được thực hiện · 갖춰져 있다 = đã được trang bị sẵn", "Từ những năm 1960, khi ngành dệt phát triển, Dongdaemun đã có sẵn một cụm công nghiệp nơi việc sản xuất quần áo có thể diễn ra trọn gói, từ cung ứng vải cho đến thiết kế và sản xuất số lượng nhỏ."], ["N8", "중국 베트남 등이 빠르게 따라잡고 있다고는 하지만 반경 10km 이내에서 모든 것을 한 번에 처리할 수 있는 패션 산업 <b>집적</b>지는 동대문이 최초다.", "따라잡다 = đuổi kịp · ‐다고는 하지만 = tuy nói là… nhưng · 반경 = bán kính · 이내 = trong vòng · 처리하다 = xử lý · 집적지 = khu tập trung · 최초 = đầu tiên", "Tuy nói là Trung Quốc, Việt Nam… đang nhanh chóng đuổi kịp, nhưng Dongdaemun là khu tập trung công nghiệp thời trang đầu tiên có thể xử lý mọi thứ một lần trong bán kính 10 km."], ["N9", "동대문에는 원부자재 최대 공급처인 동대문종합시장을 비롯해 평화시장·통일시장·동화상가에서는 부자재·라벨·자수 등 세부 작업이 가능하다.", "원부자재 = nguyên phụ liệu · 공급처 = nơi cung cấp · N인 N = N là N · N을/를 비롯해 = bắt đầu từ N, kể cả N · 부자재 = phụ liệu · 자수 = thêu · 세부 작업 = công đoạn chi tiết", "Ở Dongdaemun, có chợ tổng hợp Dongdaemun – nơi cung cấp nguyên phụ liệu lớn nhất – và ở các chợ Pyeonghwa, Tongil, Donghwa có thể làm các công đoạn chi tiết như phụ liệu, nhãn mác, thêu…"]], "V": [[1, "매출액", "賣出額 mại xuất ngạch", "doanh thu"], [2, "의류", "衣類 y loại", "quần áo, hàng may mặc"], [3, "형성되다", "形成 hình thành", "được hình thành"], [4, "점포", "店鋪 điếm phố", "cửa hàng, cửa hiệu"], [5, "기획", "企劃 xí hoạch", "sự lên kế hoạch, hoạch định"], [6, "걸치다", "—", "khoác, mặc lên người"], [7, "재래시장", "在來市場 tại lai thị trường", "chợ truyền thống"], [8, "한데", "—", "cùng một chỗ, chung một nơi"], [9, "섞이다", "—", "bị trộn lẫn, hòa lẫn"], [10, "발돋움하다", "—", "kiễng chân; vươn lên"], [11, "경쟁력", "競爭力 cạnh tranh lực", "sức cạnh tranh"], [12, "원단", "原緞 nguyên đoạn", "vải (nguyên liệu may)"], [13, "확보하다", "確保 xác bảo", "đảm bảo có được, thu xếp đủ"], [14, "취향", "趣向 thú hướng", "sở thích, gu"], [15, "구하다", "求 cầu", "tìm, kiếm mua"], [16, "봉제", "縫製 phùng chế", "sự may (may mặc)"], [17, "쏟아지다", "—", "tuôn ra, đổ ra ồ ạt"], [18, "반응", "反應 phản ứng", "phản ứng, sự hưởng ứng"], [19, "종사자", "從事者 tòng sự giả", "người làm việc (trong ngành)"], [20, "유발시키다", "誘發 dụ phát", "gây ra, kích phát"], [21, "분업", "分業 phân nghiệp", "sự phân công lao động"], [22, "집적", "集積 tập tích", "sự tập trung, tích tụ"], [23, "독특하다", "獨特 độc đặc", "độc đáo, đặc biệt"], [24, "휘둥그래지다", "—", "tròn xoe mắt (vì ngạc nhiên)"], [25, "치열하다", "熾烈 xí liệt", "khốc liệt, gay gắt"]], "AN": {"N1": {"v": "Chủ ngữ: 도매업자들은 (các nhà bán buôn) · 2 vị ngữ nối tiếp: 디자인하고 … 맡긴다 → 'thiết kế … rồi giao cho xưởng'.", "cut": "2 khúc, cắt ở ‐고: ① 도매업자들은 디자이너를 통해 옷을 디자인하고 (nhà bán buôn thiết kế quần áo qua nhà thiết kế) ② 이를 생산 공장에 맡긴다 (rồi giao việc đó cho xưởng sản xuất).", "mod": "Không có định ngữ dài.", "words": "도매업자 (都賣業者 đô mại nghiệp giả) = người bán buôn · 맡기다 = giao cho làm (đã học ở bài 5: gửi, giao)"}, "N2": {"v": "Chủ ngữ: 생산 공장은 · Vị ngữ chính: 납품한다 → 'giao hàng cho doanh nghiệp bán buôn'.", "cut": "2 khúc, cắt ở ‐어 (만들어): ① 생산 공장은 원단부터 봉제에 이르기까지 옷을 만들어 (xưởng làm quần áo từ khâu vải đến khâu may) ② 도매 업체에 다시 납품한다 (rồi giao lại cho bên bán buôn).", "mod": "Không có định ngữ dài (cụm 원단부터 봉제에 이르기까지 là trạng ngữ phạm vi 'từ… đến…').", "words": "납품하다 (納品 nạp phẩm) = giao hàng theo đơn · 봉제 (縫製 phùng chế) = may"}, "N3": {"v": "Chủ ngữ: 소매 업체는 · 3 vị ngữ liên tiếp: 구매하고 … 촬영해 … 등록한다 → 'mua, chụp ảnh, đăng lên mạng'.", "cut": "3 khúc: ① 소매 업체는 도매시장을 둘러보며 (bên bán lẻ đi một vòng chợ sỉ) ‐며 ② 쇼핑몰 콘셉트에 맞는 샘플을 구매하고 (mua mẫu hợp concept) ‐고 ③ 이를 촬영해 온라인에 등록한다 (chụp ảnh rồi đăng online).", "mod": "쇼핑몰 콘셉트에 맞는 → 샘플: dịch 'những mẫu' trước, 'hợp với concept cửa hàng online' sau.", "words": "소매 (小賣 tiểu mại) = bán lẻ, đối lập 도매 = bán buôn · 콘셉트 = concept (từ mượn tiếng Anh)"}, "N4": {"v": "Vế điều kiện: 소비자가 … 구매하면 · Câu chính: 소매업체가 … 전달한다 → 'bên bán lẻ chuyển cho chú lấy hàng'.", "cut": "3 khúc: ① 소비자가 온라인에 등록된 상품을 보고 구매하면 (khi khách xem hàng đăng online và đặt mua) ‐(으)면 ② 소매업체가 당일 내역을 확인해 (bên bán lẻ kiểm tra đơn trong ngày) ‐아/어 ③ 사입삼촌에게 전달한다 (chuyển cho 'chú lấy hàng').", "mod": "온라인에 등록된 → 상품: 'sản phẩm' trước, 'được đăng trên mạng' sau.", "words": "사입삼촌 = 사입 (仕入 mua hàng về bán) + 삼촌 (chú) → người chuyên đi lấy hàng hộ ở chợ sỉ · 내역 (內譯 nội dịch) = chi tiết, danh sách"}, "N5": {"v": "Chủ ngữ: 사입삼촌은 · Vị ngữ chính: (…배송하는) 방식이다 → 'cách làm là…'; bản dịch đưa 'cách làm là' lên đầu.", "cut": "4 khúc: ① 사입삼촌은 소매 업체별 구매 내역을 확인한 뒤 (sau khi kiểm tra đơn từng nhà bán lẻ) ‐(으)ㄴ 뒤 ② 도매 매장을 들러 주문하고 (ghé cửa hàng sỉ đặt hàng) ‐고 ③ 물량에 맞춰 물건을 전달 받아 (nhận hàng đủ số lượng) ‐아 ④ 다시 소매 업체에 배송하는 방식이다 (rồi giao lại cho bên bán lẻ – đó là cách làm).", "mod": "Cả chuỗi ①–④ là định ngữ (kết thúc ‐는) → 방식: dịch 'cách làm là:' trước, rồi kể các bước sau.", "words": "물량 (物量 vật lượng) = số lượng hàng · 배송 (配送 phối tống) = giao hàng"}, "N6": {"v": "Chủ ngữ: 이유는 (lý do) · Vị ngữ: ‐기 때문이다 → 'là vì Dongdaemun tạo thành cụm thời trang'.", "cut": "2 khúc, cắt ở 이유는: ① 이처럼 사입삼촌들이 물량을 매일 공급 받을 수 있는 이유는 (lý do 'chú lấy hàng' có hàng mỗi ngày như vậy) ② 동대문이 패션 클러스터를 이루고 있기 때문이다 (là vì Dongdaemun đã hình thành cụm thời trang).", "mod": "사입삼촌들이 물량을 매일 공급 받을 수 있는 → 이유: 'lý do' trước, 'chú lấy hàng có thể được cung cấp hàng mỗi ngày' sau.", "words": "공급 (供給 cung cấp) · 클러스터 = cluster, cụm công nghiệp (đoán từ tiếng Anh)"}, "N7": {"v": "Chủ ngữ: 클러스터가 · Vị ngữ: 갖춰져 있다 → 'đã có sẵn một cụm…'. Trạng ngữ: 1960년대부터 동대문에는.", "cut": "2 khúc lớn: ① 섬유산업이 발달한 1960년대부터 동대문에는 (từ thập niên 1960 – khi ngành dệt phát triển – ở Dongdaemun) ② 원단 수급에서부터 … 의류 제조가 이뤄질 수 있는 클러스터가 갖춰져 있다 (đã có sẵn cụm nơi may mặc trọn gói được).", "mod": "① 섬유산업이 발달한 → 1960년대: 'những năm 1960' trước, 'khi ngành dệt phát triển' sau. ② 원단 수급에서부터 디자인·소량생산에 이르기까지 원스톱으로 의류 제조가 이뤄질 수 있는 → 클러스터: 'một cụm công nghiệp' trước, 'nơi việc sản xuất quần áo diễn ra trọn gói từ cung ứng vải đến thiết kế, sản xuất nhỏ' sau.", "words": "섬유 (纖維 tiêm duy) = sợi, dệt · 수급 (需給 nhu cấp) = cung ứng · 원스톱 = one-stop, trọn gói"}, "N8": {"v": "Chủ ngữ: 패션 산업 집적지는 · Vị ngữ: 동대문이 최초다 → 'Dongdaemun là nơi đầu tiên'. Vế nhượng bộ có chủ ngữ riêng: 중국 베트남 등이.", "cut": "2 khúc, cắt ở ‐다고는 하지만: ① 중국 베트남 등이 빠르게 따라잡고 있다고는 하지만 (tuy nói là TQ, VN đang đuổi kịp nhanh, nhưng) ② 반경 10km 이내에서 모든 것을 한 번에 처리할 수 있는 패션 산업 집적지는 동대문이 최초다 (khu tập trung… thì Dongdaemun là đầu tiên).", "mod": "반경 10km 이내에서 모든 것을 한 번에 처리할 수 있는 → 패션 산업 집적지: 'khu tập trung công nghiệp thời trang' trước, 'có thể xử lý mọi thứ một lần trong bán kính 10 km' sau.", "words": "집적지 (集積地 tập tích địa) = khu tập trung (bài 7 từ 22) · 반경 (半徑 bán kính) · 최초 (最初 tối sơ) = đầu tiên"}, "N9": {"v": "Chủ ngữ: 세부 작업이 · Vị ngữ: 가능하다 → 'có thể làm các công đoạn chi tiết'. Địa điểm: 동대문에는 / …동화상가에서는 (câu gốc ghép hơi lỏng).", "cut": "2 khúc, cắt ở N을/를 비롯해: ① 동대문에는 원부자재 최대 공급처인 동대문종합시장을 비롯해 (ở Dongdaemun, có chợ tổng hợp Dongdaemun – nơi cung cấp nguyên phụ liệu lớn nhất – và) ② 평화시장·통일시장·동화상가에서는 부자재·라벨·자수 등 세부 작업이 가능하다 (ở các chợ Pyeonghwa, Tongil, Donghwa có thể làm phụ liệu, nhãn, thêu…).", "mod": "원부자재 최대 공급처인 → 동대문종합시장 (định ngữ ‐인 = 'là'): dịch tên chợ trước, chèn 'nơi cung cấp nguyên phụ liệu lớn nhất' sau, giữa hai gạch ngang.", "words": "원부자재 (原副資材 nguyên phó tư tài) = nguyên phụ liệu · 자수 (刺繡 thích tú) = thêu"}}}, "8": {"t": "토종 브랜드 대 글로벌 브랜드", "p": "", "A": [["Đoạn 1 · Thương hiệu nội địa vượt mặt thương hiệu toàn cầu"], ["A1", "이마트(E-mart), 롯데리아(Lotteria), 카페베네(Caffe Bene)– 이들 <b>토종<sup>1</sup></b> 브랜드(brand)의 <b>공통점<sup>2</sup></b>은 무엇일까?", "토종 = (giống) bản địa, nội địa · 공통점 = điểm chung · 이들 = những… này · ‐(으)ㄹ까? = …nhỉ? (tự hỏi)", "E-mart, Lotteria, Caffe Bene – điểm chung của những thương hiệu nội địa này là gì?"], ["A2", "이들은 모두 글로벌 넘버원(global no.1)을 자랑하는 업체들을 <b>제쳤다<sup>3</sup></b>.", "제치다 = vượt mặt, gạt sang một bên · 자랑하다 = tự hào, khoe · 업체 = doanh nghiệp, hãng · 넘버원 = số 1", "Tất cả bọn họ đều đã vượt mặt những hãng tự hào là số 1 toàn cầu."], ["A3", "이처럼 한국 국내 시장에선 토종 브랜드가 <b>튼실하게<sup>4</sup></b> 성장하고 있다.", "튼실하다 = vững chắc, khỏe khoắn · 이처럼 = như thế này · 국내 시장 = thị trường trong nước · ‐에선 = ‐에서는 · 성장하다 = tăng trưởng", "Như vậy, trên thị trường trong nước Hàn Quốc, các thương hiệu nội địa đang tăng trưởng vững chắc."], ["A4", "대표적으로 국내 유통시장에서는 단연 '이마트'가 독보적인 위치를 <b>차지하고<sup>5</sup></b> 있다.", "차지하다 = chiếm giữ · 대표적으로 = tiêu biểu là · 유통시장 = thị trường bán lẻ/phân phối · 단연 = rõ ràng, hẳn · 독보적 = độc tôn, có một không hai · 위치 = vị trí", "Tiêu biểu là trên thị trường bán lẻ trong nước, ‘E-mart’ rõ ràng đang chiếm giữ vị trí độc tôn."], ["A5", "세계적인 <b>유통<sup>6</sup></b> 업체인 '월마트(Walmart)'와 '까르푸(Carrefour)'와 같은 글로벌 브랜드조차 '이마트'라는 토종 브랜드에 <b>밀려<sup>7</sup></b> <b>맥없이<sup>8</sup></b> <b>철수했던<sup>9</sup></b> <b>사례<sup>10</sup></b>가 있다.", "유통 = lưu thông, phân phối · 밀리다 = bị đẩy lùi, bị lấn át · 맥없이 = một cách yếu ớt, dễ dàng · 철수하다 = rút lui · 사례 = trường hợp, ví dụ thực tế · N조차 = ngay cả N · N(이)라는 = (có tên) là N · ‐았/었던 = đã từng", "Đã có trường hợp ngay cả những thương hiệu toàn cầu như các hãng bán lẻ hàng đầu thế giới ‘Walmart’ và ‘Carrefour’ cũng bị thương hiệu nội địa ‘E-mart’ lấn át và phải rút lui một cách chóng vánh."], ["A6", "그렇다면 왜 작은 토종 브랜드가 글로벌 브랜드를 제치는 현상이 자주 생길까?", "그렇다면 = nếu vậy thì · 현상 = hiện tượng · 제치다 = vượt mặt · 생기다 = xảy ra", "Nếu vậy thì tại sao hiện tượng thương hiệu nội địa nhỏ bé vượt mặt thương hiệu toàn cầu lại hay xảy ra như vậy?"], ["Đoạn 2 · Hiểu người tiêu dùng trong nước: trường hợp Caffe Bene"], ["A7", "우선 토종 브랜드는 자국민의 문화와 소비 <b>습성<sup>11</sup></b>, 국내 시장 환경 등을 글로벌 브랜드보다 더 잘 이해하고 있다.", "습성 = thói quen, tập tính · 우선 = trước hết · 자국민 = người dân nước mình · 소비 = tiêu dùng · 환경 = môi trường", "Trước hết, thương hiệu nội địa hiểu rõ văn hóa và thói quen tiêu dùng của người dân nước mình, môi trường thị trường trong nước… hơn thương hiệu toàn cầu."], ["A8", "유통업계에 따르면, 지난해 말 토종 브랜드인 '카페베네'는 글로벌 커피 브랜드 '스타벅스(Starbucks)'를 경쟁에서 이기고 1위에 올라섰다.", "N에 따르면 = theo N · 유통업계 = giới bán lẻ, ngành phân phối · 지난해 말 = cuối năm ngoái · 경쟁 = cạnh tranh · 올라서다 = vươn lên", "Theo giới bán lẻ, cuối năm ngoái thương hiệu nội địa ‘Caffe Bene’ đã đánh bại thương hiệu cà phê toàn cầu ‘Starbucks’ trong cạnh tranh và vươn lên vị trí số 1."], ["A9", "그 이유는 가격이 싸다는 점과 대화와 휴식을 즐길 수 있는 복합문화공간이라는 이미지(image) 때문이다.", "‐다는 점 = điểm (rằng)… · 휴식 = nghỉ ngơi · 복합문화공간 = không gian văn hóa đa năng · N(이)라는 이미지 = hình ảnh là N · N 때문이다 = là vì N", "Lý do là vì giá rẻ và vì hình ảnh một không gian văn hóa đa năng, nơi có thể thoải mái trò chuyện và nghỉ ngơi."], ["A10", "'카페베네'는 한국 소비자가 커피를 살 때 실제로 무엇을 원하는지 연구했고, 그 결과를 브랜드 이미지에 잘 <b>적용해<sup>12</sup></b> 소비자의 입맛에 <b>맞춘<sup>13</sup></b> 것이다.", "적용하다 = áp dụng · 맞추다 = làm cho khớp, chiều theo · 입맛 = khẩu vị, sở thích · ‐는지 = (việc) có… hay không/gì · ‐(으)ㄴ 것이다 = (giải thích) chính là đã…", "‘Caffe Bene’ đã nghiên cứu xem người tiêu dùng Hàn Quốc thực sự muốn gì khi mua cà phê, rồi áp dụng khéo léo kết quả đó vào hình ảnh thương hiệu, nhờ vậy đã chiều đúng khẩu vị người tiêu dùng."], ["Đoạn 3 · Nghiên cứu người tiêu dùng lâu dài"], ["A11", "기업이라면 어느 곳이든 먼저 시장 환경을 조사한다.", "N(이)라면 = nếu là N · N(이)든 = bất kể N nào · 조사하다 = khảo sát, điều tra", "Đã là doanh nghiệp thì bất kể nơi nào cũng đều khảo sát môi trường thị trường trước tiên."], ["A12", "흔히 시장조사를 할 때 소비자가 무엇을 원하고 그것을 어떤 방식으로 사는지도 확인한다.", "흔히 = thông thường · 시장조사 = nghiên cứu thị trường · 방식 = cách thức · ‐는지도 = cả việc … hay không · 확인하다 = xác nhận, kiểm tra", "Thông thường, khi nghiên cứu thị trường, doanh nghiệp còn xem xét cả việc người tiêu dùng muốn gì và mua thứ đó theo cách nào."], ["A13", "그런데 토종 브랜드 업체들은 오랫동안 자국 소비자를 연구해왔다.", "그런데 = thế nhưng · 오랫동안 = trong thời gian dài · 자국 = nước mình · ‐아/어 오다 = (đã) … suốt đến nay", "Thế nhưng các doanh nghiệp thương hiệu nội địa thì đã nghiên cứu người tiêu dùng nước mình suốt một thời gian dài."], ["A14", "따라서 전체적인 <b>흐름<sup>14</sup></b>을 <b>꿰뚫고<sup>15</sup></b> 소비자의 <b>변화<sup>16</sup></b>에 <b>대처할<sup>17</sup></b> 수 있는 것이다.", "흐름 = dòng chảy, xu hướng · 꿰뚫다 = xuyên thấu, nắm rõ · 변화 = sự thay đổi · 대처하다 = đối phó, ứng phó · 전체적 = tổng thể · ‐(으)ㄹ 수 있는 것이다 = (vì thế) mới có thể", "Vì vậy, họ mới có thể nắm rõ xu hướng tổng thể và ứng phó với những thay đổi của người tiêu dùng."], ["Đoạn 4 · Sự tự tin thái quá và thất bại bản địa hóa"], ["A15", "물론 글로벌 브랜드 역시 이런 연구를 한다.", "물론 = tất nhiên · 역시 = cũng · 연구 = nghiên cứu", "Tất nhiên thương hiệu toàn cầu cũng làm những nghiên cứu như vậy."], ["A16", "그러나 세계적으로 성공하면 그 자신감이 <b>과해<sup>18</sup></b> 모든 곳에서 판매자 중심으로 <b>전략<sup>19</sup></b>을 세운다.", "과하다 = quá mức, thái quá · 전략 = chiến lược · 전략을 세우다 = lập chiến lược · 자신감 = sự tự tin · 판매자 중심 = lấy người bán làm trung tâm", "Nhưng một khi đã thành công trên toàn thế giới, sự tự tin ấy trở nên thái quá, khiến họ lập chiến lược lấy người bán làm trung tâm ở mọi nơi."], ["A17", "심지어 소비자의 습관을 자신들의 입맛에 맞게 바꾸려고 한다.", "심지어 = thậm chí · 습관 = thói quen · ‐게 = sao cho · ‐(으)려고 하다 = định, muốn", "Thậm chí họ còn muốn thay đổi thói quen của người tiêu dùng cho hợp với ý mình."], ["A18", "예를 들어 '월마트'는 한국에 처음 <b>진출할 때<sup>20</sup></b> 세계 표준에 맞춰 <b>창고형<sup>21</sup></b> 매장을 <b>고집했다가<sup>22</sup></b> <b>현지화<sup>23</sup></b>에 실패했다.", "진출하다 = thâm nhập, tiến vào (thị trường) · 창고형 = dạng nhà kho · 고집하다 = khăng khăng giữ · 현지화 = bản địa hóa · 표준 = tiêu chuẩn · 매장 = cửa hàng · ‐았/었다가 = (làm…) rồi (kết quả xấu)", "Chẳng hạn, khi mới thâm nhập Hàn Quốc, ‘Walmart’ đã khăng khăng giữ mô hình cửa hàng dạng nhà kho theo tiêu chuẩn toàn cầu, rồi thất bại trong việc bản địa hóa."], ["A19", "그러나 기본적으로 제품과 서비스가 좋지 않으면 아무리 현지화 노력을 하더라도 소비자에게 외면을 받는다.", "기본적으로 = về cơ bản · 아무리 ‐더라도 = dù … đến đâu đi nữa · 노력 = nỗ lực · 외면을 받다 = bị quay lưng, bị ngó lơ", "Tuy nhiên, về cơ bản nếu sản phẩm và dịch vụ không tốt thì dù nỗ lực bản địa hóa đến đâu cũng sẽ bị người tiêu dùng quay lưng."], ["A20", "이는 토종 브랜드라고 해도 마찬가지이다.", "N(이)라고 해도 = dù là N đi nữa · 마찬가지 = cũng như vậy", "Điều này với thương hiệu nội địa cũng vậy."], ["A21", "'카페베네'는 커피의 질을 높이기 위해 원두의 수입처를 여럿 확보하고 원두를 볶는 <b>공정<sup>24</sup></b>을 연구해 개선했다.", "공정 = công đoạn, quy trình (sản xuất) · 질 = chất lượng · ‐기 위해 = để · 원두 = hạt cà phê · 수입처 = nguồn nhập khẩu · 확보하다 = đảm bảo có được · 볶다 = rang · 개선하다 = cải thiện", "Để nâng cao chất lượng cà phê, ‘Caffe Bene’ đã đảm bảo nhiều nguồn nhập khẩu hạt cà phê, đồng thời nghiên cứu và cải tiến công đoạn rang hạt."], ["Đoạn 5 · E-mart và lý do dẫn đầu"], ["A22", "'이마트' 역시 안정적이면서도 질 높은 제품을 들여오기 위해 고정적으로 거래처를 확보했다.", "‐(으)면서도 = vừa … mà lại · 안정적 = ổn định · 들여오다 = nhập về · 고정적으로 = cố định · 거래처 = đối tác, nhà cung cấp", "‘E-mart’ cũng vậy, để nhập về những sản phẩm vừa ổn định vừa chất lượng cao, họ đã đảm bảo có các nhà cung cấp cố định."], ["A23", "또한 그들을 꾸준히 지원하면서 동시에 원료의 생산 공정에 <b>관여하기도<sup>25</sup></b> 한다.", "관여하다 = can dự, tham gia vào · ‐기도 하다 = còn … nữa · ‐(으)면서 = trong khi, vừa… vừa · 꾸준히 = đều đặn, bền bỉ · 지원하다 = hỗ trợ · 원료 = nguyên liệu", "Ngoài ra, họ vừa hỗ trợ bền bỉ các nhà cung cấp đó, đồng thời còn tham gia vào cả quy trình sản xuất nguyên liệu."], ["A24", "토종 브랜드들이 경쟁에서 앞서고 있는 이유들이 바로 여기에 있다.", "앞서다 = dẫn trước · 바로 = chính · 이유 = lý do", "Lý do các thương hiệu nội địa đang dẫn trước trong cạnh tranh nằm chính ở đây."]], "B": [["Bài báo 1 · 까르푸 결국 철수 … 세계 1등업체 왜 한국에선 힘 못쓰나", "<a href=\"https://sgsg.hankyung.com/article/2006041969641\" target=\"_blank\" rel=\"noopener\">생글생글(한국경제), 2006.04.24</a>"], ["N1", "월마트에 이어 세계 2위 소매업체인 까르푸가 한국 시장에서 떠날 준비를 하고 있다.", "N에 이어 = tiếp sau N · 소매업체 = hãng bán lẻ · 떠나다 = rời đi · 준비를 하다 = chuẩn bị", "Tiếp sau Walmart, Carrefour – hãng bán lẻ lớn thứ hai thế giới – đang chuẩn bị rời khỏi thị trường Hàn Quốc."], ["N2", "까르푸는 1996년 국내 <b>유통</b>시장이 개방되면서 그 해 7월 부천에 1호점을 열었다.", "유통시장 = thị trường phân phối · 개방되다 = được mở cửa · ‐(으)면서 = khi, cùng với việc · 1호점 = cửa hàng số 1", "Carrefour mở cửa hàng đầu tiên tại Bucheon vào tháng 7/1996, năm thị trường phân phối trong nước được mở cửa."], ["N3", "국내에 <b>진출한</b> 지 10년 만에 <b>철수하는</b> 셈.", "진출하다 = thâm nhập · ‐(으)ㄴ 지 N 만에 = sau N kể từ khi · 철수하다 = rút lui · ‐는 셈(이다) = coi như là", "Coi như hãng rút lui sau 10 năm kể từ khi vào thị trường trong nước."], ["N4", "까르푸에 이어 한국에 들어온 세계 최대 패스트푸드 업체 맥도날드와 KFC 등도 국내 업체에 <b>밀려</b> 떠날 날만 기다리는 상황이다.", "들어오다 = vào · 최대 = lớn nhất · 밀리다 = bị lấn át · ‐(으)ㄹ 날만 기다리다 = chỉ còn chờ ngày… · 상황 = tình hình", "Các hãng đồ ăn nhanh lớn nhất thế giới vào Hàn Quốc sau Carrefour như McDonald’s, KFC… cũng đang bị doanh nghiệp trong nước lấn át, chỉ còn chờ ngày rời đi."], ["N5", "외국 업체들이 유독 한국시장에서 고전하는 原因은 무엇일까.", "유독 = riêng, đặc biệt · 고전하다 = chật vật (khổ chiến) · 原因 = 원인 nguyên nhân", "Nguyên nhân khiến các hãng nước ngoài chật vật riêng ở thị trường Hàn Quốc là gì?"], ["N6", "여러 원인을 들 수 있지만 한마디로 現地化의 실패로 요약할 수 있다.", "원인을 들다 = nêu nguyên nhân · 한마디로 = nói một lời · 現地化 = 현지화 bản địa hóa · 요약하다 = tóm tắt", "Có thể nêu ra nhiều nguyên nhân, nhưng tóm lại trong một câu là thất bại trong bản địa hóa."], ["N7", "진출한 나라의 市場과 소비자를 속속들이 이해하는 데 너무 많은 시간이 걸렸다는 얘기다.", "市場 = 시장 thị trường · 속속들이 = tường tận · ‐는 데 시간이 걸리다 = mất thời gian để · ‐다는 얘기다 = có nghĩa là", "Nghĩa là họ đã mất quá nhiều thời gian để hiểu tường tận thị trường và người tiêu dùng ở nước mà mình thâm nhập."], ["N8", "우선 까르푸의 일본 철수 <b>사례</b>부터 알아보자.", "우선 = trước hết · 사례 = trường hợp · N부터 = bắt đầu từ N · ‐아/어 보자 = hãy thử", "Trước hết, hãy xem xét trường hợp Carrefour rút khỏi Nhật Bản."], ["N9", "월마트와 달리 까르푸는 일찌감치 아시아 각국 시장 <b>진출</b>을 서둘렀다.", "N와/과 달리 = khác với N · 일찌감치 = từ sớm · 각국 = các nước · 서두르다 = gấp rút", "Khác với Walmart, Carrefour đã sớm gấp rút thâm nhập thị trường các nước châu Á."]], "V": [[1, "토종", "土種 thổ chủng", "giống bản địa; (thương hiệu) nội địa"], [2, "공통점", "共通點 cộng thông điểm", "điểm chung"], [3, "제치다", "—", "vượt mặt, gạt sang một bên"], [4, "튼실하다", "—", "vững chắc, khỏe khoắn"], [5, "차지하다", "—", "chiếm, chiếm giữ"], [6, "유통", "流通 lưu thông", "lưu thông, phân phối (bán lẻ)"], [7, "밀리다", "—", "bị đẩy lùi, bị lấn át"], [8, "맥없다", "—", "yếu ớt, mất sức (맥없이 = một cách yếu ớt)"], [9, "철수하다", "撤收 triệt thu", "rút lui, rút khỏi"], [10, "사례", "事例 sự lệ", "trường hợp, ví dụ thực tế"], [11, "습성", "習性 tập tính", "tập tính, thói quen"], [12, "적용하다", "適用 thích dụng", "áp dụng"], [13, "맞추다", "—", "làm cho khớp, chiều theo"], [14, "흐름", "—", "dòng chảy, xu hướng"], [15, "꿰뚫다", "—", "xuyên thấu, nắm rõ"], [16, "변화", "變化 biến hóa", "sự thay đổi"], [17, "대처하다", "對處 đối xử", "đối phó, ứng phó"], [18, "과하다", "過 quá", "quá mức, thái quá"], [19, "전략", "戰略 chiến lược", "chiến lược"], [20, "진출하다", "進出 tiến xuất", "thâm nhập, tiến vào (thị trường)"], [21, "창고형", "倉庫形 thương khố hình", "dạng nhà kho (mô hình kho bãi)"], [22, "고집하다", "固執 cố chấp", "khăng khăng, cố giữ"], [23, "현지화", "現地化 hiện địa hóa", "bản địa hóa"], [24, "공정", "工程 công trình", "công đoạn, quy trình sản xuất"], [25, "관여하다", "關與 quan dự", "can dự, tham gia vào"]], "AN": {"N1": {"v": "Chủ ngữ: 까르푸가 · Vị ngữ chính: 떠날 준비를 하고 있다 → 'đang chuẩn bị rời đi'.", "cut": "2 khúc, cắt ở N에 이어: ① 월마트에 이어 (tiếp sau Walmart) ② 세계 2위 소매업체인 까르푸가 한국 시장에서 떠날 준비를 하고 있다 (Carrefour – hãng bán lẻ thứ 2 thế giới – đang chuẩn bị rời thị trường Hàn Quốc).", "mod": "Định ngữ: 세계 2위 소매업체인 → danh từ: 까르푸. Dịch 'Carrefour' trước, rồi chèn '– hãng bán lẻ lớn thứ hai thế giới –' sau (đồng vị ngữ).", "words": "소매업체 (小賣業體 tiểu mại nghiệp thể) = hãng bán lẻ · 2위 (位 vị) = hạng 2"}, "N2": {"v": "Chủ ngữ: 까르푸는 · Vị ngữ chính: 1호점을 열었다 → 'mở cửa hàng số 1'. Chủ ngữ phụ: 유통시장이 개방되면서.", "cut": "2 khúc, cắt ở ‐(으)면서: ① 1996년 국내 유통시장이 개방되면서 (năm 1996, khi thị trường phân phối trong nước mở cửa) ② 그 해 7월 부천에 1호점을 열었다 (tháng 7 năm đó mở cửa hàng đầu tiên ở Bucheon).", "mod": "Không có định ngữ dài.", "words": "개방 (開放 khai phóng) = mở cửa · 1호점 (號店 hiệu điếm) = cửa hàng số 1"}, "N3": {"v": "Câu rút gọn, chủ ngữ ẩn (까르푸가) · Vị ngữ: 철수하는 셈 (bỏ 이다) → 'coi như rút lui'.", "cut": "2 khúc, cắt ở ‐(으)ㄴ 지 … 만에: ① 국내에 진출한 지 10년 만에 (sau 10 năm kể từ khi vào trong nước) ② 철수하는 셈 (coi như rút lui).", "mod": "Không có định ngữ dài.", "words": "진출 (進出 tiến xuất) = thâm nhập thị trường · 셈 = phép tính → '‐는 셈' = tính ra là, coi như"}, "N4": {"v": "Chủ ngữ: 맥도날드와 KFC 등도 · Vị ngữ chính: 떠날 날만 기다리는 상황이다 → 'đang ở tình thế chỉ chờ ngày rời đi'.", "cut": "3 khúc: ① 까르푸에 이어 한국에 들어온 세계 최대 패스트푸드 업체 맥도날드와 KFC 등도(cả McDonald’s, KFC – hãng đồ ăn nhanh lớn nhất thế giới vào HQ sau Carrefour) ② 국내 업체에 밀려 (bị doanh nghiệp trong nước lấn át) ③ 떠날 날만 기다리는 상황이다 (chỉ còn chờ ngày rời đi). Cắt ở ‐아/어(서) của 밀려.", "mod": "① 까르푸에 이어 한국에 들어온 세계 최대 패스트푸드 업체 → danh từ: 맥도날드와 KFC: dịch 'McDonald’s, KFC…' trước, rồi 'các hãng đồ ăn nhanh lớn nhất thế giới vào HQ sau Carrefour'. ② 떠날 날만 기다리는 → 상황: 'tình thế' + 'chỉ chờ ngày rời đi' (có thể bỏ 'tình thế' khi dịch).", "words": "최대 (最大 tối đại) = lớn nhất · 밀리다 = bị đẩy → bị lấn át (đoán theo ngữ cảnh 'bị đẩy ra')"}, "N5": {"v": "Chủ ngữ: 原因은 · Vị ngữ: 무엇일까 → 'là gì?'.", "cut": "1 câu, ngắt trước 原因은: ① 외국 업체들이 유독 한국시장에서 고전하는 (các hãng nước ngoài riêng ở thị trường HQ lại chật vật) ② 原因은 무엇일까 (nguyên nhân là gì).", "mod": "Định ngữ: 외국 업체들이 유독 한국시장에서 고전하는 → danh từ: 原因. Dịch 'nguyên nhân' trước, 'khiến các hãng nước ngoài chật vật riêng ở thị trường HQ' sau.", "words": "原因 = 원인 (nguyên nhân, báo cũ viết Hán tự) · 고전 (苦戰 khổ chiến) = đánh vất vả → chật vật · 유독 (唯獨 duy độc) = riêng mỗi"}, "N6": {"v": "Chủ ngữ ẩn (người viết/우리는) · Vị ngữ: 들 수 있지만 … 요약할 수 있다 → 'có thể nêu… nhưng có thể tóm tắt là…'.", "cut": "2 khúc, cắt ở ‐지만: ① 여러 원인을 들 수 있지만 (có thể nêu nhiều nguyên nhân, nhưng) ② 한마디로 現地化의 실패로 요약할 수 있다 (nói gọn là thất bại trong bản địa hóa).", "mod": "Không có định ngữ dài.", "words": "現地化 = 현지화 (hiện địa hóa) = bản địa hóa · 요약 (要約 yếu ước) = tóm tắt"}, "N7": {"v": "Chủ ngữ ẩn (이는 = điều đó) · Vị ngữ: ‐다는 얘기다 → 'có nghĩa là…'. Chủ–vị bên trong: 시간이 걸렸다.", "cut": "2 khúc, cắt ở ‐는 데: ① 진출한 나라의 市場과 소비자를 속속들이 이해하는 데 (để hiểu tường tận thị trường và người tiêu dùng nước đã thâm nhập) ② 너무 많은 시간이 걸렸다는 얘기다 (nghĩa là đã mất quá nhiều thời gian). Dịch đảo: 'Nghĩa là… mất quá nhiều thời gian để…'.", "mod": "Định ngữ ngắn: 진출한 → 나라: 'nước (mà mình) thâm nhập'.", "words": "市場 = 시장 (thị trường) · 속속들이 = tận bên trong (속 = bên trong) → tường tận"}, "N8": {"v": "Chủ ngữ ẩn (우리) · Vị ngữ: 알아보자 → 'hãy tìm hiểu'.", "cut": "1 khúc ngắn, không cần cắt: 우선 까르푸의 일본 철수 사례부터 알아보자 (trước hết hãy xem trường hợp Carrefour rút khỏi Nhật).", "mod": "Không có định ngữ dài (chuỗi danh từ 까르푸의 일본 철수 사례 → dịch ngược: 'trường hợp Carrefour rút khỏi Nhật Bản').", "words": "철수 (撤收 triệt thu) = rút lui · 사례 (事例 sự lệ) = trường hợp"}, "N9": {"v": "Chủ ngữ: 까르푸는 · Vị ngữ chính: 서둘렀다 → 'đã gấp rút'.", "cut": "2 khúc, cắt ở N와/과 달리: ① 월마트와 달리 (khác với Walmart) ② 까르푸는 일찌감치 아시아 각국 시장 진출을 서둘렀다 (Carrefour sớm gấp rút vào thị trường các nước châu Á).", "mod": "Không có định ngữ dài (chuỗi danh từ 아시아 각국 시장 진출 → 'việc thâm nhập thị trường các nước châu Á').", "words": "각국 (各國 các quốc) = các nước · 일찌감치 = từ sớm (gốc 이르다 = sớm)"}}}, "9": {"t": "직업 선택의 어려움", "p": "150–151", "A": [["Đoạn 1 · Chọn nghề bắt đầu từ chọn chuyên ngành"], ["A1", "인생에서 수많은 선택이 있지만, <b>일생<sup>1</sup></b>을 두고 가장 큰 영향을 미치는 선택 가운데 하나가 직업 선택이다.", "일생 = cả đời · 수많다 = vô số · ‐지만 = nhưng · N을/를 두고 = xét về N · 영향을 미치다 = gây ảnh hưởng · N 가운데 하나 = một trong những N", "Trong đời người có vô số lựa chọn, nhưng một trong những lựa chọn có ảnh hưởng lớn nhất đến cả cuộc đời chính là chọn nghề."], ["A2", "직업 선택은 어떤 학교와 <b>전공<sup>2</sup></b>을 택할 것인가와 관련되어 있다.", "전공 = chuyên ngành · 택하다 = chọn · ‐(으)ㄹ 것인가 = sẽ… hay không/thế nào · N와/과 관련되다 = liên quan đến N", "Việc chọn nghề gắn liền với việc sẽ chọn trường nào và chuyên ngành gì."], ["A3", "과거에는 대학의 이름만 보고 학교를 선택하기도 하였지만, 점차 자신이 원하는 전공을 보고 학교를 선택하는 경우가 늘고 있다.", "‐기도 하다 = cũng có khi · 점차 = dần dần · ‐는 경우가 늘다 = trường hợp… ngày càng tăng · 자신이 원하는 = mà bản thân mong muốn", "Trước đây có khi người ta chọn trường chỉ dựa vào tên tuổi của trường đại học, nhưng dần dần, trường hợp chọn trường dựa trên chuyên ngành mình mong muốn đang ngày càng tăng."], ["A4", "이는 명문대학을 졸업하였지만 <b>취직<sup>3</sup></b>이 잘 되지 않거나 취직이 되었더라도 <b>적성<sup>4</sup></b>에 <b>맞지<sup>5</sup></b> 않아서 도중에 직장을 <b>옮기는<sup>6</sup></b> 경우가 많아지면서 생긴 현상이다.", "취직 = xin được việc · 적성 = năng khiếu, sở trường · 맞다 = hợp · 옮기다 = chuyển · 명문대학 = đại học danh tiếng · ‐거나 = hoặc · ‐더라도 = dù · 도중에 = giữa chừng · ‐(으)면서 = cùng với việc · 현상 = hiện tượng", "Đây là hiện tượng nảy sinh khi ngày càng nhiều trường hợp tốt nghiệp đại học danh tiếng mà vẫn khó xin việc, hoặc dù có việc nhưng không hợp sở trường nên giữa chừng phải chuyển chỗ làm."], ["Đoạn 2 · Câu chuyện anh H bỏ lương cao đi học nấu ăn"], ["A5", "명문대학교를 졸업하고 유명한 정보통신회사 과장으로서 <b>남부럽지<sup>7</sup></b> 않게 생활하던 H씨는 뒤늦게 요리학교에 입학했다.", "남부럽지 않다 = chẳng phải ghen tị với ai, sung túc · 정보통신회사 = công ty công nghệ thông tin – viễn thông · 과장 = trưởng phòng · N(으)로서 = với tư cách N · ‐던 = (vốn) từng · 뒤늦게 = muộn màng", "Anh H – người tốt nghiệp đại học danh tiếng và từng sống sung túc chẳng kém ai với tư cách trưởng phòng ở một công ty công nghệ thông tin – viễn thông nổi tiếng – đã muộn màng nhập học một trường dạy nấu ăn."], ["A6", "일찍부터 요리에 관심이 많았던 H씨는 외국에 <b>출장<sup>8</sup></b>을 갈 때에도 꼭 유명한 식당에 들르곤 하였는데, 뒤늦게 자신이 원하는 일을 하기 위해 높은 <b>연봉<sup>9</sup></b>도 포기하고 새 출발을 한 것이다.", "출장 = công tác · 연봉 = lương năm · ‐았/었던 = đã từng · 들르다 = ghé · ‐곤 하다 = thường hay · ‐는데 = (dẫn bối cảnh) · ‐기 위해 = để · 포기하다 = từ bỏ · 새 출발 = khởi đầu mới", "Anh H vốn từ sớm đã rất quan tâm đến nấu ăn, mỗi lần đi công tác nước ngoài đều nhất định ghé các quán ăn nổi tiếng; rồi muộn màng, để được làm công việc mình mong muốn, anh đã từ bỏ cả mức lương năm cao để làm lại từ đầu."], ["A7", "H씨는 자기가 하고 싶었던 일을 하게 되어 만족하고 있으며, 자신이 처음부터 전공을 신중하게 선택했더라면 이렇게 먼 길을 돌아서 오지는 않았을 것이라고 말했다.", "‐게 되다 = được (trở nên) · ‐(으)며 = và · 신중하게 = thận trọng · ‐았/었더라면 = giá mà đã… · 먼 길을 돌아오다 = đi đường vòng xa · ‐았/었을 것이다 = hẳn đã · ‐(이)라고 말하다 = nói rằng", "Anh H cho biết anh hài lòng vì được làm công việc mình hằng muốn, và nói rằng giá mà ngay từ đầu anh chọn chuyên ngành một cách thận trọng thì đã không phải đi một vòng xa như thế này."], ["Đoạn 3 · Sở trường và thu nhập"], ["A8", "사람은 자신의 적성에 맞아야 즐겁게 일을 할 수 있다.", "‐아/어야 = phải… thì mới · 적성에 맞다 = hợp sở trường · 즐겁게 = vui vẻ", "Con người phải làm việc hợp với sở trường của mình thì mới có thể làm việc vui vẻ."], ["A9", "<b>보수<sup>10</sup></b>가 많아도 적성에 맞지 않은 일을 계속 하는 것은 매우 힘들다.", "보수 = thù lao, tiền công · ‐아/어도 = dù · 계속 = liên tục, tiếp tục", "Dù thù lao cao đến đâu, việc cứ tiếp tục làm một công việc không hợp sở trường cũng rất vất vả."], ["A10", "반대로 자신이 좋아하지만 생활에 필요한 <b>소득<sup>11</sup></b>이 <b>보장되지<sup>12</sup></b> 않는 경우에도 일을 계속하기 어렵다.", "소득 = thu nhập · 보장되다 = được bảo đảm · 반대로 = ngược lại · ‐는 경우에도 = cả trong trường hợp · ‐기 어렵다 = khó mà", "Ngược lại, trường hợp công việc mình thích nhưng không bảo đảm được thu nhập cần cho cuộc sống thì cũng khó mà tiếp tục làm lâu dài."], ["Đoạn 4 · Khó khăn lớn nhất: thiếu thông tin"], ["A11", "또한 직업을 선택하거나 <b>진로<sup>13</sup></b>를 선택할 때 겪는 가장 큰 어려움 중의 하나는 정보가 충분하지 않다는 것이다.", "진로 = con đường tương lai, hướng nghiệp · 겪다 = trải qua, gặp phải · ‐다는 것이다 = (chính) là việc… · 충분하다 = đầy đủ", "Ngoài ra, một trong những khó khăn lớn nhất khi chọn nghề hay chọn hướng đi tương lai là không có đủ thông tin."], ["A12", "직업의 종류와 구체적으로 하는 일의 내용, 소득, 그리고 앞으로의 발전 가능성 등에 대해 많이 알면 알수록 선택을 잘 할 수 있다.", "종류 = loại · 구체적으로 = cụ thể · 발전 가능성 = khả năng phát triển · N에 대해 = về N · ‐(으)면 ‐(으)ㄹ수록 = càng… càng", "Càng biết nhiều về các loại nghề, nội dung công việc cụ thể, thu nhập và khả năng phát triển sau này thì càng có thể lựa chọn đúng đắn."], ["Đoạn 5 · Kết quả khảo sát"], ["A13", "직장인들을 대상으로 한 최근의 <b>여론 조사<sup>14</sup></b>에서 직업 선택에 영향을 미친 요인으로 본인의 적성, 대학의 전공, 선후배나 친구의 <b>조언<sup>15</sup></b> 등을 들고 있음을 보면 직업 선택 과정에서 정보의 중요성이 얼마나 큰 것인지 알 수 있다.", "여론 조사 = thăm dò dư luận · 조언 = lời khuyên · N을/를 대상으로 하다 = lấy N làm đối tượng · 요인 = yếu tố · 선후배 = tiền bối và hậu bối · 들다 = nêu ra · ‐(으)ㅁ을 보면 = nhìn vào việc… thì · 얼마나 ‐(으)ㄴ지 = … đến mức nào", "Trong một cuộc thăm dò dư luận gần đây với đối tượng là người đi làm, các yếu tố được nêu là đã ảnh hưởng đến việc chọn nghề gồm sở trường của bản thân, chuyên ngành đại học, lời khuyên của đàn anh đàn chị hay bạn bè…; nhìn vào đó có thể thấy thông tin quan trọng đến mức nào trong quá trình chọn nghề."], ["Đoạn 6 · Chọn nghề cũng là chọn thời gian làm việc và nghỉ ngơi"], ["A14", "한편 <b>공무원<sup>16</sup></b>이나 회사원과 같이 어느 조직에 <b>고용되어<sup>17</sup></b> 월급을 받는 사람은 자신이 <b>노동<sup>18</sup></b> 시간을 선택할 수 있는 <b>권리<sup>19</sup></b>가 거의 없지만, <b>자유직<sup>20</sup></b>이나 전문직의 경우에는 스스로 근로시간을 선택하기도 한다.", "공무원 = công chức · 고용되다 = được tuyển dụng, làm thuê · 노동 = lao động · 권리 = quyền · 자유직 = nghề tự do · 한편 = mặt khác · 조직 = tổ chức · 월급 = lương tháng · 전문직 = nghề chuyên môn · 근로시간 = thời gian làm việc", "Mặt khác, những người làm thuê cho một tổ chức và nhận lương tháng như công chức hay nhân viên công ty hầu như không có quyền tự chọn thời gian lao động của mình, còn với người làm nghề tự do hay nghề chuyên môn thì có khi tự mình chọn được thời gian làm việc."], ["A15", "직업 선택은 자신이 일생 동안 얼마나 일을 하고 얼마나 <b>여가<sup>21</sup></b>를 <b>즐길<sup>22</sup></b> 것인지를 선택하는 것과도 연결된다.", "여가 = thời gian rảnh · 즐기다 = tận hưởng · 일생 동안 = suốt đời · 얼마나 ‐(으)ㄹ 것인지 = sẽ… bao nhiêu · N와/과도 연결되다 = cũng gắn với N", "Chọn nghề còn gắn với việc lựa chọn suốt đời mình sẽ làm việc bao nhiêu và tận hưởng thời gian rảnh bao nhiêu."], ["Đoạn 7 · Kết luận"], ["A16", "직업 선택은 우리의 일생에서 매우 중요한 결정 가운데 하나이다.", "결정 = quyết định · N 가운데 하나 = một trong những N", "Chọn nghề là một trong những quyết định rất quan trọng trong cuộc đời chúng ta."], ["A17", "직업 선택을 올바르게 하기 위해서는 무엇보다 자신의 적성과 목표를 고려해야 하고, 원하는 직업이 요구하는 <b>자질<sup>23</sup></b>이나 능력을 <b>갖추기<sup>24</sup></b> 위해 많은 노력을 계속 <b>기울여야<sup>25</sup></b> 한다.", "자질 = tư chất · 갖추다 = trang bị, có đủ · 기울이다 = dồn (nỗ lực) · 올바르게 = đúng đắn · 무엇보다 = trước hết · 고려하다 = cân nhắc · ‐아/어야 하다 = phải · 요구하다 = đòi hỏi", "Để chọn nghề đúng đắn, trước hết phải cân nhắc sở trường và mục tiêu của bản thân, đồng thời phải không ngừng dồn nhiều nỗ lực để trang bị tư chất và năng lực mà nghề mình mong muốn đòi hỏi."], ["A18", "아울러 근로와 여가 시간을 고려하여 선택하는 것도 중요하다.", "아울러 = đồng thời, thêm vào đó · 근로 = làm việc · ‐아/어 = (cách thức) bằng việc", "Đồng thời, việc lựa chọn có cân nhắc đến thời gian làm việc và thời gian nghỉ ngơi cũng rất quan trọng."]], "B": [["Bài báo 1 · \"신입은 어쩌라고\"…경력직에 밀리고 AI에 치인 청년들 '한숨'", "<a href=\"https://www.hankyung.com/article/202609291175g\" target=\"_blank\" rel=\"noopener\">한국경제, 2026.09.29</a>"], ["N1", "회사를 고를 때 가장 중요하게 보는 조건은 급여였다.", "고르다 = chọn · 중요하게 보다 = coi trọng · 조건 = điều kiện · 급여 = tiền lương", "Điều kiện được coi trọng nhất khi chọn công ty là tiền lương."], ["N2", "'급여 수준'을 꼽은 비율이 66.6%로 절반을 넘었다.", "급여 수준 = mức lương · 꼽다 = chọn ra, nêu ra · 비율 = tỉ lệ · N(으)로 = (ở mức) N · 절반 = một nửa", "Tỉ lệ chọn ‘mức lương’ là 66,6%, vượt quá một nửa."], ["N3", "<b>고용</b> 안정성은 46%, 직무 적합성·<b>전공</b> 관련성은 34.7%로 뒤를 이었다.", "고용 안정성 = tính ổn định việc làm · 직무 적합성 = mức phù hợp với công việc · 전공 관련성 = mức liên quan đến chuyên ngành · 뒤를 잇다 = xếp tiếp sau", "Theo sau là tính ổn định việc làm với 46%, và mức phù hợp với công việc – liên quan đến chuyên ngành với 34,7%."], ["N4", "이어 기업 규모·인지도 23%, 일과 삶의 균형 16.7%, 개인의 발전·성장 가능성 15.8% 순이었다.", "이어 = tiếp theo · 규모 = quy mô · 인지도 = độ nhận diện · 일과 삶의 균형 = cân bằng công việc – cuộc sống · 성장 = trưởng thành · N 순이다 = theo thứ tự N", "Tiếp theo lần lượt là quy mô – độ nổi tiếng của doanh nghiệp 23%, cân bằng công việc – cuộc sống 16,7%, khả năng phát triển – trưởng thành của cá nhân 15,8%."], ["N5", "선호하는 일자리 형태는 거주 지역에 따라 차이를 보였다.", "선호하다 = ưa thích · 일자리 = chỗ làm, việc làm · 형태 = hình thức · 거주 지역 = khu vực sinh sống · N에 따라 = tùy theo N · 차이를 보이다 = cho thấy sự khác biệt", "Hình thức việc làm được ưa thích cho thấy có sự khác biệt tùy theo khu vực sinh sống."], ["N6", "수도권 청년은 대기업·중견기업을 선호한다는 응답이 32.5%로 공무원·공공기관(28.4%)보다 높았다.", "수도권 = vùng thủ đô · 중견기업 = doanh nghiệp vừa (quy mô trung kiên) · ‐는다는 응답 = câu trả lời rằng · 공공기관 = cơ quan công · N보다 높다 = cao hơn N", "Ở thanh niên vùng thủ đô, tỉ lệ trả lời rằng thích doanh nghiệp lớn và vừa là 32,5%, cao hơn công chức – cơ quan công (28,4%)."], ["N7", "비수도권에서는 <b>공무원</b>·공공기관 선호도가 33.3%로 대기업·중견기업(24.1%)을 9.2%포인트 앞섰다.", "비수도권 = ngoài vùng thủ đô · 선호도 = mức độ ưa thích · 앞서다 = vượt, dẫn trước · %포인트 = điểm phần trăm", "Ở các địa phương ngoài vùng thủ đô, mức độ ưa thích công chức – cơ quan công là 33,3%, vượt doanh nghiệp lớn và vừa (24,1%) 9,2 điểm phần trăm."], ["N8", "경총은 비수도권의 대기업·중견기업 일자리 인프라 부족이 이 같은 차이에 영향을 미친 것으로 해석했다.", "경총 = Tổng hội Doanh nghiệp Hàn Quốc (KEF) · 인프라 = hạ tầng · 부족 = thiếu hụt · 이 같은 = như thế này · 영향을 미치다 = ảnh hưởng · ‐(으)ㄴ 것으로 해석하다 = lý giải rằng", "Tổng hội Doanh nghiệp Hàn Quốc (KEF) lý giải rằng việc thiếu hạ tầng việc làm của doanh nghiệp lớn và vừa ở ngoài vùng thủ đô đã ảnh hưởng đến sự khác biệt này."]], "V": [[1, "일생", "一生 nhất sinh", "cả đời, một đời người"], [2, "전공", "專攻 chuyên công", "chuyên ngành"], [3, "취직", "就職 tựu chức", "sự xin được việc, có việc làm"], [4, "적성", "適性 thích tính", "năng khiếu, sở trường, sự phù hợp"], [5, "맞다", "—", "hợp, phù hợp"], [6, "옮기다", "—", "chuyển, di chuyển (chỗ làm)"], [7, "남부럽다", "—", "ghen tị với người khác (남부럽지 않다 = chẳng kém ai)"], [8, "출장", "出張 xuất trương", "chuyến công tác"], [9, "연봉", "年俸 niên bổng", "lương năm"], [10, "보수", "報酬 báo thù", "thù lao, tiền công"], [11, "소득", "所得 sở đắc", "thu nhập"], [12, "보장되다", "保障 bảo chướng", "được bảo đảm"], [13, "진로", "進路 tiến lộ", "con đường tương lai, hướng nghiệp"], [14, "여론 조사", "輿論調査 dư luận điều tra", "thăm dò dư luận"], [15, "조언", "助言 trợ ngôn", "lời khuyên"], [16, "공무원", "公務員 công vụ viên", "công chức"], [17, "고용되다", "雇用 cố dụng", "được tuyển dụng, được thuê làm"], [18, "노동", "勞動 lao động", "lao động"], [19, "권리", "權利 quyền lợi", "quyền, quyền lợi"], [20, "자유직", "自由職 tự do chức", "nghề tự do"], [21, "여가", "餘暇 dư hạ", "thời gian rảnh, giải trí"], [22, "즐기다", "—", "tận hưởng, thưởng thức"], [23, "자질", "資質 tư chất", "tư chất, phẩm chất"], [24, "갖추다", "—", "trang bị, có đủ"], [25, "기울이다", "—", "dồn (sức, nỗ lực), chú tâm"]], "AN": {"N1": {"v": "Chủ ngữ: 조건은 (điều kiện) · Vị ngữ chính: 급여였다 → 'là tiền lương'. Chủ thể chọn công ty (청년들) bị ẩn.", "cut": "2 khúc, cắt trước 조건은: ① 회사를 고를 때 가장 중요하게 보는 (khi chọn công ty, coi trọng nhất) ② 조건은 급여였다 (điều kiện là tiền lương).", "mod": "Định ngữ: 회사를 고를 때 가장 중요하게 보는 → danh từ: 조건. Dịch 'điều kiện' trước, 'được coi trọng nhất khi chọn công ty' sau.", "words": "급여 (給與 cấp dữ) = tiền lương · 고르다 = chọn (từ thuần Hàn, đồng nghĩa 선택하다)"}, "N2": {"v": "Chủ ngữ: 비율이 (tỉ lệ) · Vị ngữ chính: 넘었다 → 'vượt quá (một nửa)'.", "cut": "2 khúc, cắt ở ‐(으)로: ① '급여 수준'을 꼽은 비율이 66.6%로 (tỉ lệ chọn ‘mức lương’ là 66,6%) ② 절반을 넘었다 (vượt quá một nửa).", "mod": "Định ngữ ngắn: '급여 수준'을 꼽은 → danh từ: 비율. Dịch 'tỉ lệ' trước, 'chọn mức lương' sau.", "words": "꼽다 = đếm, nêu ra (trong khảo sát: chọn là đáp án) · 절반 (折半 chiết bán) = một nửa"}, "N3": {"v": "Chủ ngữ: 고용 안정성은 / 직무 적합성·전공 관련성은 (hai hạng mục) · Vị ngữ chính: 뒤를 이었다 → 'xếp tiếp theo'.", "cut": "2 khúc, cắt ở dấu phẩy: ① 고용 안정성은 46% (ổn định việc làm 46%) ② 직무 적합성·전공 관련성은 34.7%로 뒤를 이었다 (phù hợp công việc – liên quan chuyên ngành 34,7%, xếp tiếp sau). Khi dịch đưa 'theo sau là' lên đầu.", "mod": "Không có định ngữ dài.", "words": "안정성 (安定性 an định tính) = tính ổn định · 적합성 (適合性 thích hợp tính) = mức phù hợp · 뒤를 잇다 = nối tiếp phía sau"}, "N4": {"v": "Chủ ngữ ẩn (các hạng mục tiếp theo) · Vị ngữ chính: 순이었다 → 'theo thứ tự (là)…'.", "cut": "3 khúc theo dấu phẩy: ① 이어 기업 규모·인지도 23% (tiếp theo, quy mô – độ nổi tiếng DN 23%) ② 일과 삶의 균형 16.7% (cân bằng công việc – cuộc sống 16,7%) ③ 개인의 발전·성장 가능성 15.8% 순이었다 (khả năng phát triển – trưởng thành cá nhân 15,8%).", "mod": "Không có định ngữ dài.", "words": "인지도 (認知度 nhận tri độ) = độ nhận biết, độ nổi tiếng · 균형 (均衡 quân hành) = cân bằng · 순 (順 thuận) = thứ tự"}, "N5": {"v": "Chủ ngữ: 일자리 형태는 (hình thức việc làm) · Vị ngữ chính: 차이를 보였다 → 'cho thấy sự khác biệt'.", "cut": "2 khúc, cắt ở N에 따라: ① 선호하는 일자리 형태는 (hình thức việc làm được ưa thích) ② 거주 지역에 따라 차이를 보였다 (khác nhau tùy khu vực sinh sống).", "mod": "Định ngữ ngắn: 선호하는 → danh từ: 일자리 형태. Dịch 'hình thức việc làm' trước, 'được ưa thích' sau.", "words": "선호하다 (選好 tuyển hảo) = ưa chuộng hơn · 거주 (居住 cư trú) = sinh sống"}, "N6": {"v": "Chủ ngữ: 응답이 (câu trả lời / tỉ lệ trả lời) · Vị ngữ chính: 높았다 → 'cao hơn'. Chủ đề: 수도권 청년은.", "cut": "3 khúc: ① 수도권 청년은 (thanh niên vùng thủ đô) ② 대기업·중견기업을 선호한다는 응답이 32.5%로 (câu trả lời thích DN lớn và vừa là 32,5%) ③ 공무원·공공기관(28.4%)보다 높았다 (cao hơn công chức – cơ quan công 28,4%).", "mod": "Định ngữ trích dẫn: 대기업·중견기업을 선호한다는 → danh từ: 응답. Dịch 'câu trả lời / tỉ lệ trả lời' trước, 'rằng thích DN lớn và vừa' sau.", "words": "수도권 (首都圈 thủ đô quyển) = vùng thủ đô (Seoul, Gyeonggi, Incheon) · 중견기업 (中堅企業 trung kiên xí nghiệp) = doanh nghiệp tầm trung"}, "N7": {"v": "Chủ ngữ: 선호도가 (mức độ ưa thích) · Vị ngữ chính: 앞섰다 → 'vượt, dẫn trước'.", "cut": "3 khúc: ① 비수도권에서는 (ở ngoài vùng thủ đô) ② 공무원·공공기관 선호도가 33.3%로 (mức ưa thích công chức – cơ quan công là 33,3%) ③ 대기업·중견기업(24.1%)을 9.2%포인트 앞섰다 (vượt DN lớn và vừa 24,1% là 9,2 điểm %).", "mod": "Không có định ngữ dài.", "words": "비수도권 (非首都圈 phi thủ đô quyển) = ngoài vùng thủ đô · 앞서다 = đi trước → vượt, dẫn trước · %포인트 = điểm phần trăm (hiệu hai tỉ lệ)"}, "N8": {"v": "Chủ ngữ: 경총은 (KEF) · Vị ngữ chính: 해석했다 → 'lý giải'. Mệnh đề được lý giải: 인프라 부족이 … 영향을 미친 것으로.", "cut": "2 khúc, cắt ở ‐(으)ㄴ 것으로: ① 경총은 … 해석했다 (KEF lý giải rằng) ② 비수도권의 대기업·중견기업 일자리 인프라 부족이 이 같은 차이에 영향을 미친 것으로 (việc thiếu hạ tầng việc làm của DN lớn và vừa ở ngoài vùng thủ đô đã ảnh hưởng đến khác biệt này). Dịch 'KEF lý giải rằng' lên đầu.", "mod": "Cụm danh từ dài: 비수도권의 대기업·중견기업 일자리 인프라 부족 → danh từ chính: 부족. Dịch 'sự thiếu' trước, rồi 'hạ tầng việc làm' → 'của DN lớn và vừa' → 'ở ngoài vùng thủ đô' (đảo ngược thứ tự).", "words": "경총 = 한국경영자총협회 (Tổng hội Doanh nghiệp Hàn Quốc) · 인프라 = infrastructure, hạ tầng · 해석하다 (解釋 giải thích) = lý giải"}}}, "10": {"t": "에너지 절약과 녹색 습관", "p": "166–167", "A": [["Đoạn 1 · Điện năng, CO₂ và lý do phải tiết kiệm"], ["A1", "한국의 1인당 전기 소비량은 일본보다 많은 편이다.", "1인당 = bình quân đầu người · 전기 소비량 = lượng tiêu thụ điện · ‐(으)ㄴ/는 편이다 = thuộc loại, khá là", "Lượng tiêu thụ điện bình quân đầu người của Hàn Quốc thuộc loại cao hơn Nhật Bản."], ["A2", "일본은 7천372kw, 한국은 7천607kw이다.", "N은/는 … N은/는 … = (so sánh song song) · 7천 = 7 nghìn", "Nhật Bản là 7.372 kW, còn Hàn Quốc là 7.607 kW."], ["A3", "전기는 1차 에너지를 <b>변환해<sup>2</sup></b> 만든 2차 에너지이다.", "변환하다 = chuyển đổi · 1차/2차 에너지 = năng lượng sơ cấp/thứ cấp · V‐아/어 만든 N = N được làm ra bằng cách V", "Điện là năng lượng thứ cấp, được tạo ra bằng cách chuyển đổi năng lượng sơ cấp."], ["A4", "석탄, 석유 등 1차 에너지를 전기로 바꿀 때, <b>지구온난화<sup>3</sup></b>의 <b>주범<sup>4</sup></b>인 이산화탄소가 나온다.", "지구온난화 = sự nóng lên toàn cầu · 주범 = thủ phạm chính · 석탄 = than đá · 석유 = dầu mỏ · N인 N = N là N · 이산화탄소 = khí CO₂ · ‐(으)ㄹ 때 = khi", "Khi chuyển các nguồn năng lượng sơ cấp như than đá, dầu mỏ thành điện, khí CO₂ – thủ phạm chính gây ra hiện tượng nóng lên toàn cầu – sẽ thải ra."], ["A5", "에너지 <b>절약<sup>1</sup></b>은 지구온난화를 <b>막고<sup>5</sup></b> 에너지의 수입을 줄이는 <b>일석이조<sup>6</sup></b>의 방법이다.", "절약 = tiết kiệm · 막다 = ngăn chặn · 수입 = nhập khẩu · 줄이다 = giảm · 일석이조 = một công đôi việc · ‐고 = và", "Tiết kiệm năng lượng là cách làm một công đôi việc: vừa ngăn chặn sự nóng lên toàn cầu, vừa giảm nhập khẩu năng lượng."], ["Đoạn 2 · Tiết kiệm khi dùng đồ điện gia dụng"], ["A6", "가전제품을 쓸 때에도 에너지를 절약할 수 있다.", "가전제품 = đồ điện gia dụng · ‐(으)ㄹ 때에도 = cả khi · ‐(으)ㄹ 수 있다 = có thể", "Ngay cả khi dùng đồ điện gia dụng, ta cũng có thể tiết kiệm năng lượng."], ["A7", "외출할 때에는 전등을 끄고, 세탁과 다림질은 <b>모아서<sup>7</sup></b> 하며, 가전제품을 쓰지 않을 때는 플러그(plug)를 <b>뽑는다<sup>8</sup></b>.", "모으다 = gom lại · 뽑다 = rút ra · 외출하다 = ra ngoài · 전등을 끄다 = tắt đèn · 세탁 = giặt giũ · 다림질 = là (ủi) quần áo · ‐며 = và", "Khi ra ngoài thì tắt đèn, giặt và là quần áo thì dồn lại làm một lần, còn khi không dùng đồ điện thì rút phích cắm ra."], ["A8", "이를 <b>활용하고<sup>9</sup></b> <b>실천<sup>10</sup></b>만 해도 <b>전기요금<sup>11</sup></b>을 크게 줄일 수 있다.", "활용하다 = vận dụng · 실천 = thực hành · 요금 = cước phí · N만 해도 = chỉ cần N thôi cũng · 크게 = đáng kể", "Chỉ cần vận dụng và thực hành những điều này thôi cũng có thể giảm đáng kể tiền điện."], ["Đoạn 3 · Kiểm tra điện năng và chọn thiết bị hiệu suất cao"], ["A9", "전기제품의 전력소비량은 쓰기 전에 꼭 <b>점검하고<sup>12</sup></b> 가전기기를 살 때는 에너지효율 등급이 높은 제품을 고르도록 한다.", "점검하다 = kiểm tra · 전력소비량 = lượng điện tiêu thụ · ‐기 전에 = trước khi · 에너지효율 등급 = cấp hiệu suất năng lượng · ‐도록 하다 = hãy, nên (khuyên)", "Hãy nhất định kiểm tra lượng điện tiêu thụ của đồ điện trước khi dùng, và khi mua thiết bị gia dụng thì nên chọn sản phẩm có cấp hiệu suất năng lượng cao."], ["A10", "백열등은 에너지 효율 등급이
