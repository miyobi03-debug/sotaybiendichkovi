 높은 형광등으로 <b>교체하고<sup>13</sup></b>, TV나 컴퓨터를 켜 놓고 다른 일을 하지 않는다.", "교체하다 = thay thế · 백열등 = đèn sợi đốt · 형광등 = đèn huỳnh quang · ‐아/어 놓다 = (để) sẵn · ‐지 않다 = không", "Thay đèn sợi đốt bằng đèn huỳnh quang có cấp hiệu suất năng lượng cao, và không bật sẵn TV hay máy tính rồi đi làm việc khác."], ["Đoạn 4 · Điều chỉnh nhiệt độ, giảm rác thực phẩm"], ["A11", "또한 전기요금을 예상해 이용량을 <b>조절하는<sup>14</sup></b> <b>지혜<sup>15</sup></b>가 필요하다.", "조절하다 = điều chỉnh · 지혜 = sự khôn ngoan · 예상하다 = dự tính · 이용량 = lượng sử dụng", "Ngoài ra, cần có sự khôn ngoan trong việc dự tính tiền điện để điều chỉnh lượng sử dụng."], ["A12", "온도 조절은 중요한 녹색 습관이다.", "온도 조절 = điều chỉnh nhiệt độ · 녹색 습관 = thói quen xanh", "Điều chỉnh nhiệt độ là một thói quen xanh quan trọng."], ["A13", "여름엔 28도, 겨울엔 20도를 유지하는 것이 좋다.", "엔 = 에는 (rút gọn) · 유지하다 = duy trì · ‐는 것이 좋다 = nên", "Mùa hè nên giữ ở 28 độ, mùa đông ở 20 độ."], ["A14", "냉난방 온도를 1도 올리고 내리는 데 따라서 연간 이산화탄소 110kg을 줄일 수 있다.", "냉난방 = làm mát và sưởi ấm · 올리다/내리다 = tăng/giảm · ‐는 데 따라서 = tùy theo việc · 연간 = mỗi năm", "Chỉ cần tăng hay giảm nhiệt độ điều hòa/sưởi 1 độ là mỗi năm có thể giảm được 110 kg CO₂."], ["A15", "장바구니를 애용하고 음식은 적다고 할 만큼 요리한다.", "장바구니 = giỏ đi chợ · 애용하다 = ưa dùng, thường xuyên dùng · ‐다고 할 만큼 = đến mức có thể nói là", "Hãy thường xuyên dùng giỏ đi chợ, và nấu ăn ở mức có thể coi là hơi ít."], ["A16", "음식물 쓰레기를 돈으로 <b>환산하면<sup>16</sup></b> 무려 15조 원이 넘는다.", "환산하다 = quy đổi · 음식물 쓰레기 = rác thải thực phẩm · 무려 = tới tận · 15조 = 15 nghìn tỷ · 넘다 = vượt quá", "Nếu quy đổi rác thải thực phẩm ra tiền thì con số lên tới hơn 15 nghìn tỷ won."], ["Đoạn 5 · Tiết kiệm ở văn phòng"], ["A17", "사무실에서도 에너지 절약을 할 수 있다.", "사무실 = văn phòng · N에서도 = cả ở N", "Ở văn phòng cũng có thể tiết kiệm năng lượng."], ["A18", "여름에는 넥타이를 <b>풀고<sup>17</sup></b> 겨울엔 내복을 입는 것을 생활화한다.", "풀다 = tháo, cởi · 넥타이 = cà vạt · 내복 = áo lót giữ nhiệt · 생활화하다 = biến thành thói quen", "Hãy biến thành thói quen việc tháo cà vạt vào mùa hè và mặc đồ lót giữ nhiệt vào mùa đông."], ["A19", "노타이(no tie)나 긴 소매 옷이 <b>체감<sup>18</sup></b> 온도 1도를 올리거나 내리는 효과가 있기 때문이다.", "체감 온도 = nhiệt độ cảm nhận · 긴 소매 = tay dài · ‐거나 = hoặc · 효과 = hiệu quả · ‐기 때문이다 = là vì", "Đó là vì không đeo cà vạt hay mặc áo dài tay có tác dụng làm giảm hoặc tăng nhiệt độ cảm nhận được 1 độ."], ["A20", "4층 이하는 이동할 때 계단을 이용하는 것이 좋다.", "이하 = trở xuống · 이동하다 = di chuyển · 계단 = cầu thang bộ", "Khi di chuyển trong phạm vi tầng 4 trở xuống thì nên đi cầu thang bộ."], ["A21", "계단으로 다니면 <b>근력<sup>19</sup></b>도 좋아지고 에너지도 절약하는 두 가지 효과가 있다.", "근력 = sức cơ bắp · ‐(으)면 = nếu · ‐아/어지다 = trở nên · ‐고 = và", "Đi cầu thang bộ có hai tác dụng: vừa tăng sức cơ bắp, vừa tiết kiệm năng lượng."], ["A22", "문서 복사는 <b>이면지<sup>20</sup></b>를 쓰고 일회용 컵을 <b>웬만하면<sup>21</sup></b> 쓰지 않는 것이 좋다.", "이면지 = giấy đã dùng một mặt · 웬만하면 = nếu được thì · 문서 복사 = sao chụp tài liệu · 일회용 = dùng một lần", "Khi photo tài liệu nên dùng mặt sau của giấy đã dùng, và nếu được thì đừng dùng cốc dùng một lần."], ["A23", "일회용 컵을 하루에 다섯 개씩만 써도 연간 이산화탄소 20kg이 발생한다.", "N씩 = mỗi · ‐아/어도 = dù chỉ · 발생하다 = phát sinh", "Dù mỗi ngày chỉ dùng năm chiếc cốc dùng một lần thì mỗi năm cũng thải ra 20 kg CO₂."], ["A24", "또 출퇴근 때에는 대중교통을 이용하거나 가까운 거리는 걸어 다닌다.", "출퇴근 = đi làm và tan làm · 대중교통 = phương tiện giao thông công cộng · 거리 = quãng đường · 걸어 다니다 = đi bộ", "Ngoài ra, khi đi làm và tan làm thì dùng phương tiện công cộng, quãng đường gần thì đi bộ."], ["Đoạn 6 · Tiết kiệm ở trường học"], ["A25", "학교나 캠퍼스에서도 절약할 요소들이 많다.", "요소 = yếu tố · ‐(으)ㄹ N = N để (làm)", "Ở trường học hay khuôn viên đại học cũng có nhiều thứ có thể tiết kiệm."], ["A26", "교복과 교재는 후배들에게 <b>물려준다는<sup>22</sup></b> 생각으로 깨끗하게 쓴다.", "물려주다 = truyền lại, để lại · 교복 = đồng phục · 교재 = giáo trình · 후배 = đàn em, khóa sau · ‐는다는 생각으로 = với suy nghĩ rằng", "Hãy dùng đồng phục và giáo trình thật sạch sẽ với suy nghĩ sẽ để lại cho các em khóa sau."], ["A27", "교복과 교재 물려주기 활동에 5명 가운데 1명만 참여해도 무려 520억 원이나 절약하는 효과가 있다.", "물려주기 활동 = hoạt động truyền lại · 가운데 = trong số · 참여하다 = tham gia · N(이)나 = tới tận (nhấn mạnh số lượng)", "Chỉ cần 1 trong 5 người tham gia hoạt động truyền lại đồng phục và giáo trình thì đã tiết kiệm được tới 52 tỷ won."], ["Đoạn 7 · Lái xe tiết kiệm và kết luận"], ["A28", "이 밖에도 우리 생활 주변에는 간단하게 에너지의 <b>과소비<sup>23</sup></b>를 막는 길이 많다.", "과소비 = tiêu dùng quá mức · 이 밖에도 = ngoài ra · 주변 = xung quanh · 길 = cách", "Ngoài ra, quanh cuộc sống của chúng ta còn nhiều cách đơn giản để ngăn việc tiêu dùng năng lượng quá mức."], ["A29", "운전을 할 때 규정속도만 지켜도 에너지를 6%까지 줄일 수 있다.", "규정속도 = tốc độ quy định · 지키다 = tuân thủ · N만 ‐아/어도 = chỉ cần … thôi cũng · N까지 = tới", "Khi lái xe, chỉ cần tuân thủ tốc độ quy định thôi cũng có thể giảm tới 6% năng lượng."], ["A30", "자동차가 <b>공회전<sup>24</sup></b>하는 것을 피해도 이산화탄소 121kg의 <b>배출<sup>25</sup></b>을 막을 수 있다.", "공회전 = nổ máy không chạy (chạy không tải) · 배출 = thải ra · 피하다 = tránh · ‐아/어도 = chỉ cần … cũng", "Chỉ cần tránh để ô tô nổ máy không tải cũng có thể ngăn được việc thải ra 121 kg CO₂."], ["A31", "에너지 절약이야말로 최고의 생산이다.", "N(이)야말로 = chính N mới là · 최고 = tốt nhất · 생산 = sản xuất", "Chính tiết kiệm năng lượng mới là cách sản xuất tốt nhất."]], "B": [["Bài báo 1 · 한경협, 에너지 절약 캠페인 적극 시행…485개 회원사에 동참 당부", "<a href=\"https://www.ceoscoredaily.com/page/view/2026032517421187006\" target=\"_blank\" rel=\"noopener\">CEO스코어데일리, 2026.03.25</a>"], ["N1", "한경협은 최근 중동 정세 장기화에 따른 에너지 수급 및 가격 변동성 확대 가능성에 대응하기 위해 내부적으로 에너지 <b>절약</b> 캠페인을 시행하고, 485개 회원사에 에너지 효율 제고 노력을 기울여줄 것을 당부했다고 25일 밝혔다.", "한경협 = Hiệp hội Doanh nghiệp Hàn Quốc (FKI) · 중동 정세 = tình hình Trung Đông · 장기화 = kéo dài · 수급 = cung cầu · 변동성 = tính biến động · N에 대응하다 = ứng phó với N · 시행하다 = triển khai · 제고 = nâng cao · ‐아/어 줄 것을 당부하다 = đề nghị (ai) hãy · ‐다고 밝혔다 = cho biết rằng", "Ngày 25, Hiệp hội Doanh nghiệp Hàn Quốc (FKI) cho biết, để ứng phó với khả năng biến động cung cầu và giá năng lượng gia tăng do tình hình Trung Đông kéo dài gần đây, hiệp hội đã triển khai chiến dịch tiết kiệm năng lượng trong nội bộ và đề nghị 485 doanh nghiệp hội viên nỗ lực nâng cao hiệu suất năng lượng."], ["N2", "우선 한경협은 하루 뒤인 26일부터 임직원들을 대상으로 '에너지 다이어트를 위한 6가지 실천' 캠페인을 실시한다.", "우선 = trước hết · 하루 뒤인 26일 = ngày 26, tức một ngày sau · 임직원 = cán bộ nhân viên · N을/를 대상으로 = nhắm vào N · 실천 = thực hành · 실시하다 = tiến hành", "Trước hết, từ ngày 26 – tức một ngày sau đó – FKI sẽ tiến hành chiến dịch ‘6 điều thực hành để giảm cân năng lượng’ dành cho cán bộ nhân viên."], ["N3", "출퇴근 시 차량 운행 수요를 줄이기 위해 대중교통 이용을 권장한다.", "출퇴근 시 = khi đi làm và tan làm · 차량 운행 = lưu thông xe · 수요 = nhu cầu · ‐기 위해 = để · 권장하다 = khuyến khích", "Để giảm nhu cầu đi lại bằng xe riêng khi đi làm và tan làm, hiệp hội khuyến khích sử dụng phương tiện công cộng."], ["N4", "또 외부 기관과의 대면 회의는 필요한 범위 내에서 운영하고, 화상 회의 활용을 확대키로 했다.", "외부 기관 = cơ quan bên ngoài · 대면 회의 = họp trực tiếp · 범위 내 = trong phạm vi · 화상 회의 = họp trực tuyến · 활용 = tận dụng · ‐기로 하다 (‐키로) = quyết định", "Ngoài ra, hiệp hội quyết định chỉ tổ chức họp trực tiếp với các cơ quan bên ngoài trong phạm vi cần thiết và mở rộng việc sử dụng họp trực tuyến."], ["N5", "사무실 내 자원·에너지 <b>절약</b> 노력도 함께 추진한다.", "자원 = tài nguyên · 노력 = nỗ lực · 추진하다 = xúc tiến, thúc đẩy", "Hiệp hội cũng đồng thời thúc đẩy nỗ lực tiết kiệm tài nguyên và năng lượng trong văn phòng."], ["N6", "점심 시간 사무실 전등은 일괄 소등하고, 미사용 PC·모니터·프린터 전원 차단, 일회용품 줄이기 등 임직원들이 <b>실천</b>할 수 있는 생활 속 <b>절약</b>에 나선다.", "일괄 = đồng loạt · 소등하다 = tắt đèn · 미사용 = không sử dụng · 전원 차단 = ngắt nguồn điện · 일회용품 = đồ dùng một lần · N에 나서다 = bắt tay vào N", "Giờ nghỉ trưa, đèn văn phòng sẽ được tắt đồng loạt; nhân viên sẽ bắt tay vào những việc tiết kiệm trong sinh hoạt mà ai cũng có thể thực hành, như ngắt nguồn máy tính, màn hình, máy in không dùng đến và giảm đồ dùng một lần."], ["N7", "또 서울 여의도 FKI타워의 자동 소등 시간을 1시간 앞당기는 등 건물 전체의 전력 사용량도 줄일 예정이다.", "자동 소등 = tự động tắt đèn · 앞당기다 = đẩy sớm lên · ‐는 등 = như là … v.v. · 전력 사용량 = lượng điện sử dụng · ‐(으)ㄹ 예정이다 = dự kiến sẽ", "Ngoài ra, hiệp hội dự kiến giảm lượng điện sử dụng của toàn bộ tòa nhà, chẳng hạn như đẩy giờ tự động tắt đèn của tòa FKI Tower ở Yeouido, Seoul sớm lên 1 tiếng."], ["N8", "아울러 FKI타워 입주사들에게도 대중교통 이용 캠페인 참여를 권장키로 했다.", "아울러 = đồng thời, thêm vào đó · 입주사 = công ty thuê văn phòng (trong tòa nhà) · 참여 = tham gia · ‐키로 했다 = quyết định", "Đồng thời, hiệp hội cũng quyết định khuyến khích các công ty thuê văn phòng tại FKI Tower tham gia chiến dịch sử dụng phương tiện công cộng."], ["N9", "한경협은 이날 회원사들에게 보낸 협조 공문을 통해 제조 시설, 사무실, 건물, 교통 등 각 부문에서 실천할 수 있는 범위 내 에너지 사용을 <b>점검</b>하도록 안내했다.", "협조 공문 = công văn đề nghị phối hợp · N을/를 통해 = thông qua N · 제조 시설 = cơ sở sản xuất · 부문 = lĩnh vực · 점검하다 = kiểm tra · ‐도록 안내하다 = hướng dẫn (ai) làm", "Qua công văn đề nghị phối hợp gửi các doanh nghiệp hội viên trong cùng ngày, FKI đã hướng dẫn họ kiểm tra việc sử dụng năng lượng trong phạm vi có thể thực hiện ở từng lĩnh vực như cơ sở sản xuất, văn phòng, tòa nhà, giao thông."]], "V": [[1, "절약", "節約 tiết ước", "sự tiết kiệm"], [2, "변환하다", "變換 biến hoán", "chuyển đổi, biến đổi"], [3, "지구온난화", "地球溫暖化 địa cầu ôn noãn hóa", "sự nóng lên toàn cầu"], [4, "주범", "主犯 chủ phạm", "thủ phạm chính, nguyên nhân chính"], [5, "막다", "—", "ngăn chặn, ngăn ngừa"], [6, "일석이조", "一石二鳥 nhất thạch nhị điểu", "một công đôi việc (một đá hai chim)"], [7, "모으다", "—", "gom lại, dồn lại"], [8, "뽑다", "—", "rút ra, nhổ ra"], [9, "활용하다", "活用 hoạt dụng", "vận dụng, tận dụng"], [10, "실천", "實踐 thực tiễn", "sự thực hành, thực hiện"], [11, "요금", "料金 liệu kim", "cước phí, tiền phí"], [12, "점검하다", "點檢 điểm kiểm", "kiểm tra"], [13, "교체하다", "交替 giao thế", "thay thế, thay đổi"], [14, "조절하다", "調節 điều tiết", "điều chỉnh, điều tiết"], [15, "지혜", "智慧 trí tuệ", "sự khôn ngoan, trí tuệ"], [16, "환산하다", "換算 hoán toán", "quy đổi"], [17, "풀다", "—", "a. tháo, cởi b. giải (bài toán)"], [18, "체감", "體感 thể cảm", "cảm nhận của cơ thể (체감 온도 = nhiệt độ cảm nhận)"], [19, "근력", "筋力 cân lực", "sức cơ bắp"], [20, "이면지", "裏面紙 lý diện chỉ", "giấy đã dùng một mặt (dùng mặt sau)"], [21, "웬만하다", "—", "tàm tạm, kha khá; 웬만하면 = nếu được thì"], [22, "물려주다", "—", "truyền lại, để lại cho"], [23, "과소비", "過消費 quá tiêu phí", "sự tiêu dùng quá mức"], [24, "공회전", "空回轉 không hồi chuyển", "(động cơ) chạy không tải, nổ máy tại chỗ"], [25, "배출", "排出 bài xuất", "sự thải ra, phát thải"]], "AN": {"N1": {"v": "Chủ ngữ: 한경협은 · Vị ngữ chính: 밝혔다 → 'cho biết'. Nội dung được báo cáo (‐다고) có 2 vị ngữ: 시행하고 / 당부했다.", "cut": "4 khúc: ① 한경협은 … 25일 밝혔다 (ngày 25, FKI cho biết – đưa lên đầu) ② 최근 중동 정세 장기화에 따른 … 가능성에 대응하기 위해 (để ứng phó với khả năng…) ③ 내부적으로 에너지 절약 캠페인을 시행하고 (đã triển khai chiến dịch tiết kiệm trong nội bộ) ④ 485개 회원사에 … 노력을 기울여줄 것을 당부했다고 (và đề nghị 485 hội viên nỗ lực…).", "mod": "Định ngữ: 최근 중동 정세 장기화에 따른 → danh từ: 에너지 수급 및 가격 변동성 확대 가능성. Dịch: 'khả năng biến động cung cầu và giá năng lượng gia tăng' trước, rồi 'do tình hình Trung Đông kéo dài' sau.", "words": "변동성 (變動性 biến động tính) = tính biến động · 제고 (提高 đề cao) = nâng cao · 수급 (需給 nhu cấp) = cung cầu"}, "N2": {"v": "Chủ ngữ: 한경협은 · Vị ngữ chính: 실시한다 → 'sẽ tiến hành'.", "cut": "2 khúc: ① 우선 한경협은 하루 뒤인 26일부터 임직원들을 대상으로 (trước hết, từ ngày 26, dành cho nhân viên) ② '에너지 다이어트를 위한 6가지 실천' 캠페인을 실시한다 (tiến hành chiến dịch ‘6 điều thực hành…’).", "mod": "Định ngữ ngắn: 하루 뒤인 → 26일 ('ngày 26, tức một ngày sau') · 에너지 다이어트를 위한 → 6가지 실천 ('6 điều thực hành để giảm cân năng lượng').", "words": "임직원 (任職員 nhiệm chức viên) = cán bộ và nhân viên · 실천 (實踐 thực tiễn) = thực hành"}, "N3": {"v": "Chủ ngữ ẩn (한경협은) · Vị ngữ chính: 권장한다 → 'khuyến khích'.", "cut": "2 khúc, cắt ở ‐기 위해: ① 출퇴근 시 차량 운행 수요를 줄이기 위해 (để giảm nhu cầu đi lại bằng xe khi đi làm/tan làm) ② 대중교통 이용을 권장한다 (khuyến khích dùng phương tiện công cộng).", "mod": "Không có định ngữ dài.", "words": "권장 (勸奬 khuyến tưởng) = khuyến khích · 운행 (運行 vận hành) = lưu thông (xe)"}, "N4": {"v": "Chủ ngữ ẩn (한경협은) · Vị ngữ chính: 확대키로 했다 → 'quyết định mở rộng'; vị ngữ phụ: 운영하고.", "cut": "2 khúc, cắt ở ‐고: ① 또 외부 기관과의 대면 회의는 필요한 범위 내에서 운영하고 (họp trực tiếp với bên ngoài chỉ trong phạm vi cần thiết) ② 화상 회의 활용을 확대키로 했다 (qu  권장키로 했다 (quyết định khuyến khích tham gia chiến dịch đi phương tiện công cộng).", "mod": "Không có định ngữ dài (cụm danh từ 대중교통 이용 캠페인 참여 dịch ngược: 'tham gia chiến dịch sử dụng phương tiện công cộng').", "words": "입주사 (入住社 nhập trú xã) = công ty vào ở/thuê trong tòa nhà · 아울러 = đồng thời, thêm vào đó"}, "N9": {"v": "Chủ ngữ: 한경협은 · Vị ngữ chính: 안내했다 → 'đã hướng dẫn'.", "cut": "3 khúc: ① 한경협은 이날 회원사들에게 보낸 협조 공문을 통해 (qua công văn gửi hội viên trong cùng ngày) ② 제조 시설, 사무실, 건물, 교통 등 각 부문에서 실천할 수 있는 범위 내 (trong phạm vi có thể thực hiện ở từng lĩnh vực…) ③ 에너지 사용을 점검하도록 안내했다 (hướng dẫn kiểm tra việc dùng năng lượng).", "mod": "Định ngữ 1: 이날 회원사들에게 보낸 → 협조 공문 ('công văn đề nghị phối hợp' + 'gửi các hội viên trong ngày'). Định ngữ 2: 제조 시설… 각 부문에서 실천할 수 있는 → 범위 ('phạm vi' + 'có thể thực hiện ở từng lĩnh vực như…').", "words": "협조 (協助 hiệp trợ) = phối hợp, hỗ trợ · 공문 (公文 công văn) = công văn · 부문 (部門 bộ môn) = lĩnh vực, bộ phận"}}}};

      <div class="acts"><button class="btn g" data-k="g">Chấm</button>${hint?`<button class="btn" data-k="h">Gợi ý</button>`:""}<button class="btn" data-k="a">Xem đáp án</button></div>

function items(){return tab==="V"?[]:(tab==="A"?A:B).filter(r=>r.length>2)}

const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function showGrade(d,id,state){

    box.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>{G()[id]={score:+b.dataset.s,self:true};save();showGrade(d,id);prog()}));return}
  if(!g){box.hidden=true;box.innerHTML="";return}
  if(g.error){box.hidden=false;box.innerHTML=`<span class="stale">${esc(g.error)}</span>`;return}
  const [cls,lab]=tagFor(g.score);
  box.hidden=false;
  box.innerHTML=`<div class="score"><span class="pts">${g.score}<small>/10</small></span><span class="tag ${cls}">${lab}</span>${g.self?'<span class="stale" style="color:var(--muted)">tự chấm</span>':""}</div>

}

  msg.textContent=`Đang chấm ${rows.length} câu…`;
  const payload=rows.map(r=>({id:r[0],korean:plain(r[1]),reference:r[3],student:saved[r[0]].trim()}));
  const prompt=`Bạn là giáo viên dạy dịch Hàn → Việt cho sinh viên Việt Nam học môn biên dịch kinh tế xã hội (trình độ TOPIK trung cao cấp).
Chấm từng bản dịch của sinh viên ("student") so với câu gốc tiếng Hàn ("korean") và bản dịch tham khảo ("reference").
Tiêu chí: đúng nghĩa (quan trọng nhất), dịch đúng từ vựng kinh tế, đủ ý không bỏ sót, câu tiếng Việt tự nhiên. Dịch khác chữ với bản tham khảo mà đúng ý thì vẫn cho điểm cao. Không trừ điểm vì lỗi gõ dấu nhỏ.
Thang điểm 0-10 (số nguyên). Viết nhận xét bằng tiếng Việt, giọng thân thiện, ngắn gọn.
Trả về DUY NHẤT một mảng JSON, mỗi phần tử: {"id": string, "score": number, "good": string (1 câu khen điểm làm tốt, có thể rỗng), "fixes": string[] (0-3 lỗi cụ thể, mỗi lỗi nêu từ/cụm tiếng Hàn bị dịch sai và nên dịch thế nào), "better": string (bản dịch đã sửa từ chính câu của sinh viên; rỗng nếu đạt 10)}.
Ví dụ: [{"id":"A3","score":7,"good":"Dịch đúng ý chính.","fixes":["재화 là \\"hàng hóa\\", không phải \\"tài sản\\"."],"better":"..."}]

Dữ liệu:
${JSON.stringify(payload,null,1)}`;
  try{
    const res=await sample.json(prompt);
    const arr=Array.isArray(res)?res:(res&&Array.isArray(res.results)?res.results:[]);
    let n=0;
    for(const r of rows){const g=arr.find(x=>x&&String(x.id)===r[0]);
      if(g&&isFinite(+g.score)){G()[r[0]]={score:Math.max(0,Math.min(10,Math.round(+g.score))),good:String(g.good||""),fixes:Array.isArray(g.fixes)?g.fixes.map(String).slice(0,3):[],better:String(g.better||"")};n++}
      else G()[r[0]]={error:"Câu này chưa chấm được, bấm “Chấm” lại nha."};}
    save();msg.textContent=`Đã chấm ${n} câu.`;
  }catch(e){
    const code=e&&e.code;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){
      aiOff=true;rows.forEach(r=>{const d=itemEl(r[0]);if(d)showGrade(d,r[0],"self")});
      msg.textContent="Claude chấm chưa được phép trên trang này, bà tự chấm bằng nút dưới mỗi câu nha.";btns.forEach(b=>b.disabled=false);return}
    const why=code==="rate_limited"?"Chấm nhiều quá, đợi chút rồi thử lại nha.":code==="session_expired"?"Bà đăng nhập lại Claude rồi thử lại nha.":code==="cancelled"?"Đã dừng chấm.":"Chấm bị lỗi, bấm thử lại nha.";
    rows.forEach(r=>{const g=G()[r[0]];if(!g||g.error||typeof g.score!=="number")G()[r[0]]={error:why}});save();
    msg.textContent=why;
  }finally{btns.forEach(b=>b.disabled=false);rows.forEach(r=>{const d=itemEl(r[0]);if(d&&!aiOff)showGrade(d,r[0])});prog()}
}
document.getElementById("gradeAll").addEventListener("click",()=>gradeItems(items()));
const TF=[["v","Chủ ngữ & động từ chính"],["cut","Cắt mấy khúc, cắt ở đâu"],["mod","Định ngữ dài & danh từ chính"],["words","Từ lạ & đoán nghĩa (nếu có)"]];
function AS(){return saved._an||(saved._an={})}
function AF(){return saved._af||(saved._af={})}
function unlocked(id){return !!((saved._u||{})[id]||(saved[id]||"").trim())}
function unlock(d,id){(saved._u||(saved._u={}))[id]=true;save();d.querySelector(".step2").hidden=false}
function thinkHTML(id){return `<div class="think"><div class="tk-h">① Phân tích trước khi dịch</div>
  ${TF.map(([k,l])=>`<label>${l}<textarea rows="1" data-f="${k}"></textarea></label>`).join("")}
  <div class="acts"><button class="btn g" data-k="ck">Kiểm tra phân tích</button><button class="btn" data-k="am">Xem phân tích mẫu</button><button class="btn" data-k="skip">Bỏ qua, dịch luôn</button></div>
  <div class="tfb" hidden></div><div class="amodel" hidden></div></div>`}
function modelHTML(id){const a=AN[id];return TF.map(([k,l])=>`<div><b>${l}:</b> ${esc(a[k]||"")}</div>`).join("")}
function showModel(d,id){const m=d.querySelector(".amodel");m.innerHTML=modelHTML(id);m.hidden=false;d.querySelector('[data-k="am"]').textContent="Ẩn phân tích mẫu"}
function showTFB(d,id,state){const box=d.querySelector(".tfb");const f=AF()[id];
  if(state==="loading"){box.hidden=false;box.innerHTML='<span style="color:var(--muted)">Đang kiểm tra phân tích…</span>';return}
  if(!f){box.hidden=true;return}
  if(f.error){box.hidden=false;box.innerHTML=`<span class="stale" style="color:var(--warn)">${esc(f.error)}</span>`;return}
  const cls=f.verdict==="đúng"?"hi":f.verdict==="gần đúng"?"mid":"lo";
  box.hidden=false;box.innerHTML=`<div class="score"><span class="tag ${cls}" style="font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px">${esc(f.verdict||"")}</span></div>
  ${f.good?`<div><b style="color:var(--good)">Tốt:</b> ${esc(f.good)}</div>`:""}
  ${(f.fixes&&f.fixes.length)?`<ul>${f.fixes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
  ${f.tip?`<div style="color:var(--muted)">Mẹo: ${esc(f.tip)}</div>`:""}`}
function wireThink(d,id,row){
  const st=AS()[id]||{};
  d.querySelectorAll(".think textarea").forEach(t=>{t.value=st[t.dataset.f]||"";
    t.addEventListener("input",()=>{(AS()[id]||(AS()[id]={}))[t.dataset.f]=t.value;save()})});
  showTFB(d,id);
  d.querySelector('[data-k="am"]').addEventListener("click",e=>{const m=d.querySelector(".amodel");
    if(m.hidden){showModel(d,id);unlock(d,id)}else{m.hidden=true;e.target.textContent="Xem phân tích mẫu"}});
  d.querySelector('[data-k="skip"]').addEventListener("click",()=>{unlock(d,id);d.querySelector("#t-"+CSS.escape(id)).focus()});
  d.querySelector('[data-k="ck"]').addEventListener("click",()=>checkThink(d,id,row));
}
async function checkThink(d,id,row){
  const st=AS()[id]||{};const msg=document.getElementById("msg");
  if(!TF.some(([k])=>(st[k]||"").trim())){msg.textContent="Bà điền phân tích trước rồi bấm kiểm tra nha.";return}
  const sample=aiOff?null:await samplePromise;
  if(!sample){showModel(d,id);unlock(d,id);msg.textContent="Trang này chưa gọi Claude được, bà so với phân tích mẫu nha.";return}
  const b=d.querySelector('[data-k="ck"]');b.disabled=true;showTFB(d,id,"loading");
  const prompt=`Bạn là giáo viên dạy dịch Hàn → Việt cho sinh viên Việt Nam (môn biên dịch kinh tế xã hội). Trước khi dịch, sinh viên phải phân tích câu theo 4 mục: chủ ngữ & động từ chính (v), cắt câu thành mấy khúc ở chỗ nối nào (cut), định ngữ dài & danh từ chính (mod), từ lạ & cách đoán nghĩa (words, có thể bỏ trống).
Hãy so phân tích của sinh viên ("student") với phân tích mẫu ("model") cho câu tiếng Hàn ("korean"). Cách diễn đạt khác mà đúng bản chất vẫn tính đúng. Mục bỏ trống thì nhắc nhẹ, riêng "words" bỏ trống không sao.
KHÔNG đưa bản dịch hoàn chỉnh của cả câu, chỉ chỉ ra chỗ phân tích sai hoặc thiếu và gợi ý cách nghĩ.
Viết tiếng Việt, giọng thân thiện, ngắn gọn. Trả về DUY NHẤT một object JSON: {"verdict": "đúng" | "gần đúng" | "chưa đúng", "good": string (1 câu khen, có thể rỗng), "fixes": string[] (0-3 chỗ cần sửa, cụ thể, trích tiếng Hàn), "tip": string (1 mẹo tư duy cho câu này)}.

Dữ liệu:
${JSON.stringify({korean:plain(row[1]),model:AN[id],student:st},null,1)}`;
  try{const r=await sample.json(prompt);const f=Array.isArray(r)?r[0]:r;
    AF()[id]=f&&f.verdict?{verdict:String(f.verdict),good:String(f.good||""),fixes:Array.isArray(f.fixes)?f.fixes.map(String).slice(0,3):[],tip:String(f.tip||"")}:{error:"Chưa kiểm tra được, bấm lại nha."};
    if(!AF()[id].error){showModel(d,id);unlock(d,id)}
  }catch(e){const code=e&&e.code;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){aiOff=true;delete AF()[id];showModel(d,id);unlock(d,id);msg.textContent="Claude chưa được phép trên trang này, bà so với phân tích mẫu nha."}
    else AF()[id]={error:code==="rate_limited"?"Kiểm tra nhiều quá, đợi chút rồi thử lại nha.":"Kiểm tra bị lỗi, bấm thử lại nha."}}
  finally{save();showTFB(d,id);b.disabled=false}
}
function renderVocab(){
  list.innerHTML="";
  const tools=document.createElement("div");tools.className="vtools";
  tools.innerHTML='<button class="btn g" id="vhide">Che nghĩa để tự kiểm tra</button><span class="progress">Bấm vào ô nghĩa để lật từng từ. Bấm số câu để nhảy tới câu đó trong tab A.</span>';
  const wrap=document.createElement("div");wrap.className="vwrap";
  const rows=V.map(([n,w,hv,m])=>{const r=A.find(x=>x.length>2&&x[1].includes("<sup>"+n+"</sup>"));
    return `<tr><td class="n">${n}</td><td class="w">${w}</td><td class="hv">${hv}</td><td class="m"><span>${m}</span></td><td class="s">${r?`<a data-go="${r[0]}">${r[0]}</a>`:"tên bài"}</td></tr>`}).join("");
  wrap.innerHTML=`<table class="vt" id="vt"><thead><tr><th>#</th><th>Từ</th><th>Hán Việt</th><th>Nghĩa</th><th>Câu</th></tr></thead><tbody>${rows}</tbody></table>`;
  list.append(tools,wrap);
  const vt=wrap.querySelector("#vt");
  tools.querySelector("#vhide").addEventListener("click",e=>{vt.classList.toggle("hide");vt.querySelectorAll(".m").forEach(c=>c.classList.remove("show"));
    e.target.textContent=vt.classList.contains("hide")?"Hiện hết nghĩa":"Che nghĩa để tự kiểm tra"});
  vt.addEventListener("click",e=>{const m=e.target.closest(".m");if(m&&vt.classList.contains("hide"))m.classList.toggle("show");
    const g=e.target.closest("[data-go]");if(g){setTab("A");const d=itemEl(g.dataset.go);if(d){d.scrollIntoView({block:"center"});d.querySelector("textarea").focus({preventScroll:true})}}});
  document.getElementById("prog").textContent=`${V.length} từ vựng của bài`;document.getElementById("summary").textContent="";
}
function setTab(t){tab=t;["A","B","V"].forEach(x=>document.getElementById("tab"+x).setAttribute("aria-selected",x===t));render()}
for(const t of ["A","B","V"])document.getElementById("tab"+t).addEventListener("click",()=>setTab(t));
document.getElementById("showAll").addEventListener("click",e=>{
  const anyHidden=[...list.querySelectorAll(".ans")].some(a=>a.hidden);
  list.querySelectorAll(".item").forEach(d=>{d.querySelector(".ans").hidden=!anyHidden;
    d.querySelector('[data-k="a"]').textContent=anyHidden?"Ẩn đáp án":"Xem đáp án"});
  e.target.textContent=anyHidden?"Ẩn hết đáp án":"Hiện hết đáp án"});
document.getElementById("copy").addEventListener("click",()=>{
  const it=items().filter(r=>(saved[r[0]]||"").trim());
  const msg=document.getElementById("msg");
  if(!it.length){msg.textContent="Chưa có câu nào để copy. Gõ bản dịch vào ô trước nha.";return}
  const text=`Bài ${LN} – phần ${tab} – chấm giúp tui:\n\n`+it.map(r=>`${r[0]}. ${saved[r[0]].trim()}`).join("\n");
  const out=document.getElementById("out");
  navigator.clipboard.writeText(text).then(()=>{out.hidden=true;msg.textContent=`Đã copy ${it.length} câu. Dán vào chat cho tui chấm nha.`})
  .catch(()=>{out.hidden=false;out.value=text;out.select();msg.textContent="Máy không cho copy tự động, bà copy đoạn đã bôi đen ở trên nha."});
});

function head(){const d=L[LN];document.getElementById("lt").textContent="Bài "+LN+" · "+d.t;
  const na=d.A.filter(r=>r.length>2).length,nb=d.B.filter(r=>r.length>2).length;
  document.getElementById("lp").textContent=`Tab A: ${na} câu trong bài đọc${d.p?" (trang "+d.p+")":""}. Tab B: ${nb} câu báo Hàn, phân tích ① rồi mới dịch ②. Tab Từ vựng: ${d.V.length} từ. Bản dịch tự lưu trên máy, bấm “Chấm” để được chấm điểm.`;
  document.querySelectorAll("#lessons button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.n===LN));}
function loadLesson(n){pick(n);try{localStorage.setItem("dich-tonghop-ln",n)}catch(e){}
  saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
  head();document.getElementById("msg").textContent="Chỉ chấm những câu đã dịch.";setTab("A");window.scrollTo(0,0)}
document.getElementById("lessons").innerHTML=Array.from({length:10},(_,i)=>i+1).map(n=>`<button data-n="${n}" ${L[n]?"":"disabled"}>Bài ${n}</button>`).join("");
document.getElementById("lessons").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&!b.disabled&&+b.dataset.n!==LN)loadLesson(+b.dataset.n)});
head();
render();
